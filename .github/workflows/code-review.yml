name: Code Review

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
  push:
    branches: [main]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    # Skip if this is a merge commit from a PR (already reviewed)
    if: >
      github.event_name == 'pull_request' ||
      !contains(github.event.head_commit.message, 'Merge pull request')
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            EVENT: ${{ github.event_name }}
            ${{ github.event_name == 'pull_request' && format('PR NUMBER: {0}', github.event.pull_request.number) || format('COMMIT: {0}', github.sha) }}

            ${{ github.event_name == 'pull_request' && 'Review this pull request.' || 'Review this direct commit to main.' }} Focus on changed code only. Refer to CLAUDE.md for project conventions.

            ## Severity Levels
            - **Blocker**: Security vulnerabilities, data loss risks, broken functionality
            - **Warning**: Missing validation, error handling gaps
            - **Suggestion**: Style inconsistencies, minor improvements

            ## Check For
            - Security: Input validation, XSS prevention, no sensitive data logging
            - Error handling: try-catch in async handlers, appropriate HTTP status codes
            - Code style: ES modules, 2-space indent, single quotes, semicolons
            - Test coverage for new features/bug fixes

            ## Do NOT Flag
            - Code that follows existing patterns in the codebase
            - Minor style preferences beyond the above
            - Test files using mock data appropriately

            ${{ github.event_name == 'pull_request' && 'Use `gh pr comment` for summary feedback. Use inline comments for specific code issues.' || 'Output your review findings to stdout (no PR to comment on).' }}

          claude_args: |
            --allowedTools "${{ github.event_name == 'pull_request' && 'mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*)' || 'Bash(git show:*),Bash(git diff:*)' }},Bash(gh pr view:*),Read,Glob,Grep"
