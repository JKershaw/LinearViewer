name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    # Real-MongoDB smoke/concurrency coverage (LIN-1337, tests/unit/mongo-smoke.test.js)
    # needs a real server — MangoDB never throws on a duplicate _id and its
    # in-process mutex makes concurrent writers serialize for free, so it can't
    # prove the properties that file exists to prove. A service container keeps
    # the "PR runs need no repo secrets" property (8c405f0): no hosted cluster,
    # no credentials, just localhost:27017.
    services:
      mongodb:
        # LIN-3693: mongo 8.x refuses to start on kernel 6.19 to 7.0.13
        # (SERVER-121912), and the runner fleet is mixed (6.8 / 6.17 / 7.0.0).
        # Measured on 7.0.0: with glibc.pthread.rseq=1 the refused 8.x images
        # start and take load; rseq=0 doesn't help (probe run 39302841645,
        # PR #1991). Pinned to production's 8.0.32, so the pin must move with
        # production. Don't drop the env.
        image: mongo:8.0.32
        env:
          GLIBC_TUNABLES: glibc.pthread.rseq=1
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Runner kernel
        run: uname -r

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # LIN-1880: runs the SAME unit suite, once, under a socket-level watcher,
      # and additionally fails if any test opens a non-loopback socket. Costs no
      # extra CI time than `npm run test:unit` did — it wraps that command
      # rather than adding a second run. The property is worthless unenforced:
      # the unit suite reached api.linear.app on every run for months while two
      # other instruments reported clean.
      # LIN-2369: this arm runs WITH dummy OpenRouter credentials present, so
      # the suite must give the same result as the keyless proxy arm below. The
      # runner blanks both keys (scripts/run-unit-tests.mjs unitTestEnv), so
      # this proves the blanking holds: remove it and the offending files reach
      # openrouter.ai here and the arm goes red. It does not prove each file
      # tolerates a key reaching it. The value is deliberately not shaped like
      # an OpenRouter key, so the secret scan does not flag this file.
      - name: Run unit tests (hermetic — no live network, dummy OpenRouter keys set)
        run: npm run test:hermetic:keyed
        env:
          CI: true
          MONGODB_TEST_URI: mongodb://localhost:27017

      # The acceptance criteria name BOTH arms: the escape count must be zero
      # with proxy env set as well as unset. Since LIN-2992 the watcher also
      # counts a connect to the configured HTTPS_PROXY/HTTP_PROXY endpoint as
      # an escape, even on loopback, so a proxy-aware client reaching for the
      # network shows up here rather than reading as a local server. Cheap
      # (~35s) and it is the arm that would otherwise never be run.
      #
      # LIN-3949: this arm alone runs with the clock shifted +400 days, so a
      # unit test that pins a fixture date and reads the wall clock goes red in
      # the PR that introduces it, not on main after the date passes (LIN-1535,
      # LIN-2732, settings-keys). `test:hermetic` above stays on the real clock,
      # so a failure in one arm and not the other names the cause: clock rot or
      # a real bug. Costs no extra CI time. Local run: npm run test:clock-shift.
      - name: Run unit tests (hermetic, proxy env set)
        run: npm run test:hermetic:proxy
        env:
          CI: true
          MONGODB_TEST_URI: mongodb://localhost:27017
          CLOCK_SHIFT_DAYS: 400

  e2e:
    name: E2E shard ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    # Official Playwright image ships chromium + system deps preinstalled at
    # a version matching the Playwright npm package. Keep this tag in sync
    # with the "playwright" / "@playwright/test" version in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify Playwright version matches container
        run: |
          EXPECTED=1.57.0
          ACTUAL=$(node -p "require('@playwright/test/package.json').version")
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::Playwright version mismatch: container has v$EXPECTED but package.json resolves to v$ACTUAL."
            echo "Update the container image tag in .github/workflows/test.yml and the pinned version in package.json together."
            exit 1
          fi

      - name: Run E2E tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
        run: npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          SESSION_SECRET: test-secret-for-ci

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  secret-scan:
    name: Secret scan (source)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run secret scan over source
        run: npm run secret-scan

  # Single stable check that aggregates all test jobs above. The e2e job names
  # are dynamic (they embed the shard index), which makes them awkward to pin
  # as required status checks. Require this job instead: it's one fixed name
  # that only passes when every unit and e2e job passes, so it's the right
  # gate for branch protection / automated merges.
  ci-success:
    name: CI success
    if: always()
    needs: [unit, e2e, secret-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all test jobs passed
        run: |
          if [ "${{ needs.unit.result }}" != "success" ] || [ "${{ needs.e2e.result }}" != "success" ] || [ "${{ needs.secret-scan.result }}" != "success" ]; then
            echo "::error::One or more test jobs failed (unit=${{ needs.unit.result }}, e2e=${{ needs.e2e.result }}, secret-scan=${{ needs.secret-scan.result }})."
            exit 1
          fi
          echo "All test jobs passed."
