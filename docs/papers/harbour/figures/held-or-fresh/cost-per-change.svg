<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 442" width="1000" height="442" font-family="Inter, system-ui, sans-serif" role="img" aria-label="Modelled weighted tokens per correct change in September: today against the relay and its variants, with each range"><title>Modelled weighted tokens per correct change in September: today against the relay and its variants, with each range</title><rect width="1000" height="442" fill="#ffffff"/><text x="24.0" y="26.0" font-size="15" fill="#1f2937" text-anchor="start" font-weight="600">What September would have cost per correct change under each shape</text><text x="24.0" y="44.0" font-size="11" fill="#6b7280" text-anchor="start">Millions of weighted tokens per correct, complete change. Today is the mean of September’s four weeks (11.4–16.0M, measuring-throughput.md); each shape</text><text x="24.0" y="60.0" font-size="11" fill="#6b7280" text-anchor="start">scales it by its modelled change in the fleet’s tokens. The bar is the central case; the whisker runs from the cheap to the dear scenario.</text><line x1="290.0" y1="84.0" x2="290.0" y2="408.0" stroke="#e5e7eb" stroke-width="1"/><text x="290.0" y="424.0" font-size="10" fill="#6b7280" text-anchor="middle">0M</text><line x1="365.0" y1="84.0" x2="365.0" y2="408.0" stroke="#e5e7eb" stroke-width="1"/><text x="365.0" y="424.0" font-size="10" fill="#6b7280" text-anchor="middle">3M</text><line x1="440.0" y1="84.0" x2="440.0" y2="408.0" stroke="#e5e7eb" stroke-width="1"/><text x="440.0" y="424.0" font-size="10" fill="#6b7280" text-anchor="middle">6M</text><line x1="515.0" y1="84.0" x2="515.0" y2="408.0" stroke="#e5e7eb" stroke-width="1"/><text x="515.0" y="424.0" font-size="10" fill="#6b7280" text-anchor="middle">9M</text><line x1="590.0" y1="84.0" x2="590.0" y2="408.0" stroke="#e5e7eb" stroke-width="1"/><text x="590.0" y="424.0" font-size="10" fill="#6b7280" text-anchor="middle">12M</text><line x1="665.0" y1="84.0" x2="665.0" y2="408.0" stroke="#e5e7eb" stroke-width="1"/><text x="665.0" y="424.0" font-size="10" fill="#6b7280" text-anchor="middle">15M</text><line x1="740.0" y1="84.0" x2="740.0" y2="408.0" stroke="#e5e7eb" stroke-width="1"/><text x="740.0" y="424.0" font-size="10" fill="#6b7280" text-anchor="middle">18M</text><text x="278.0" y="108.0" font-size="12" fill="#1f2937" text-anchor="end" font-weight="600">Today (held supervisors)</text><rect x="290" y="96" width="332.5" height="18" fill="#94a3b8" fill-opacity="0.85"/><text x="630.5" y="109.0" font-size="11" fill="#1f2937" text-anchor="start">13.3M</text><text x="290.0" y="130.0" font-size="10.5" fill="#6b7280" text-anchor="start">September, as measured</text><text x="278.0" y="170.0" font-size="12" fill="#1f2937" text-anchor="end" font-weight="600">Relay as proposed</text><rect x="290" y="158" width="339.5" height="18" fill="#eb6834" fill-opacity="0.85"/><line x1="562.0" y1="167.0" x2="660.1" y2="167.0" stroke="#1f2937" stroke-width="1.5"/><line x1="562.0" y1="161.0" x2="562.0" y2="173.0" stroke="#1f2937" stroke-width="1.5"/><line x1="660.1" y1="161.0" x2="660.1" y2="173.0" stroke="#1f2937" stroke-width="1.5"/><text x="668.1" y="171.0" font-size="11" fill="#1f2937" text-anchor="start">13.6M (+2.1%; 10.9–14.8M)</text><text x="290.0" y="192.0" font-size="10.5" fill="#6b7280" text-anchor="start">quiet wakes to code; each acted wake a fresh session that orients as fresh starts do today</text><text x="278.0" y="232.0" font-size="12" fill="#1f2937" text-anchor="end" font-weight="600">Lean relay</text><rect x="290" y="220" width="270.7" height="18" fill="#2a78d6" fill-opacity="0.85"/><line x1="538.0" y1="229.0" x2="591.6" y2="229.0" stroke="#1f2937" stroke-width="1.5"/><line x1="538.0" y1="223.0" x2="538.0" y2="235.0" stroke="#1f2937" stroke-width="1.5"/><line x1="591.6" y1="223.0" x2="591.6" y2="235.0" stroke="#1f2937" stroke-width="1.5"/><text x="599.6" y="233.0" font-size="11" fill="#1f2937" text-anchor="start">10.8M (-18.6%; 9.9–12.1M)</text><text x="290.0" y="254.0" font-size="10.5" fill="#6b7280" text-anchor="start">as above, but the fresh session reads only a handoff (10–60k tokens) instead of orienting</text><text x="278.0" y="294.0" font-size="12" fill="#1f2937" text-anchor="end" font-weight="600">Quiet wakes to code, acted wakes stay held</text><rect x="290" y="282" width="286.3" height="18" fill="#1baf7a" fill-opacity="0.85"/><line x1="553.7" y1="291.0" x2="577.9" y2="291.0" stroke="#1f2937" stroke-width="1.5"/><line x1="553.7" y1="285.0" x2="553.7" y2="297.0" stroke="#1f2937" stroke-width="1.5"/><line x1="577.9" y1="285.0" x2="577.9" y2="297.0" stroke="#1f2937" stroke-width="1.5"/><text x="585.9" y="295.0" font-size="11" fill="#1f2937" text-anchor="start">11.5M (-13.9%; 10.5–11.5M)</text><text x="290.0" y="316.0" font-size="10.5" fill="#6b7280" text-anchor="start">no fresh sessions; the cache may expire between acted wakes</text><text x="278.0" y="356.0" font-size="12" fill="#1f2937" text-anchor="end" font-weight="600">Relay for Runner and autopilot only</text><rect x="290" y="344" width="294.3" height="18" fill="#94a3b8" fill-opacity="0.85"/><text x="592.3" y="357.0" font-size="11" fill="#1f2937" text-anchor="start">11.8M (-11.5%)</text><text x="290.0" y="378.0" font-size="10.5" fill="#6b7280" text-anchor="start">legs and steppers held, quiet wakes to code</text></svg>
