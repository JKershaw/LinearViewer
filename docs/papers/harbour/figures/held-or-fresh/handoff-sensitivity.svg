<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" font-family="Inter, system-ui, sans-serif" role="img" aria-label="How the relay’s saving depends on the size of the handoff each fresh judgement step must read"><title>How the relay’s saving depends on the size of the handoff each fresh judgement step must read</title><rect width="940" height="400" fill="#ffffff"/><text x="24.0" y="26.0" font-size="15" fill="#1f2937" text-anchor="start" font-weight="600">The relay pays only if the handoff stays small</text><text x="24.0" y="44.0" font-size="11" fill="#6b7280" text-anchor="start">Change in the fleet’s September weighted tokens against the handoff each fresh judgement step reads (thousand tokens). Below zero is a saving.</text><text x="24.0" y="60.0" font-size="11" fill="#6b7280" text-anchor="start">Orange: the fresh step also orients as fresh supervisors do today. Blue: it reads only the handoff. Green: quiet wakes to code, acted wakes stay held.</text><line x1="80.0" y1="360.0" x2="860.0" y2="360.0" stroke="#e5e7eb" stroke-width="1"/><text x="72.0" y="364.0" font-size="10" fill="#6b7280" text-anchor="end">-30%</text><line x1="80.0" y1="325.0" x2="860.0" y2="325.0" stroke="#e5e7eb" stroke-width="1"/><text x="72.0" y="329.0" font-size="10" fill="#6b7280" text-anchor="end">-20%</text><line x1="80.0" y1="290.0" x2="860.0" y2="290.0" stroke="#e5e7eb" stroke-width="1"/><text x="72.0" y="294.0" font-size="10" fill="#6b7280" text-anchor="end">-10%</text><line x1="80.0" y1="255.0" x2="860.0" y2="255.0" stroke="#1f2937" stroke-width="1"/><text x="72.0" y="259.0" font-size="10" fill="#6b7280" text-anchor="end">0%</text><line x1="80.0" y1="220.0" x2="860.0" y2="220.0" stroke="#e5e7eb" stroke-width="1"/><text x="72.0" y="224.0" font-size="10" fill="#6b7280" text-anchor="end">+10%</text><line x1="80.0" y1="185.0" x2="860.0" y2="185.0" stroke="#e5e7eb" stroke-width="1"/><text x="72.0" y="189.0" font-size="10" fill="#6b7280" text-anchor="end">+20%</text><line x1="80.0" y1="150.0" x2="860.0" y2="150.0" stroke="#e5e7eb" stroke-width="1"/><text x="72.0" y="154.0" font-size="10" fill="#6b7280" text-anchor="end">+30%</text><line x1="80.0" y1="115.0" x2="860.0" y2="115.0" stroke="#e5e7eb" stroke-width="1"/><text x="72.0" y="119.0" font-size="10" fill="#6b7280" text-anchor="end">+40%</text><line x1="80.0" y1="80.0" x2="860.0" y2="80.0" stroke="#e5e7eb" stroke-width="1"/><text x="72.0" y="84.0" font-size="10" fill="#6b7280" text-anchor="end">+50%</text><text x="80.0" y="376.0" font-size="10" fill="#6b7280" text-anchor="middle">0k</text><text x="158.0" y="376.0" font-size="10" fill="#6b7280" text-anchor="middle">20k</text><text x="275.0" y="376.0" font-size="10" fill="#6b7280" text-anchor="middle">50k</text><text x="470.0" y="376.0" font-size="10" fill="#6b7280" text-anchor="middle">100k</text><text x="665.0" y="376.0" font-size="10" fill="#6b7280" text-anchor="middle">150k</text><text x="860.0" y="376.0" font-size="10" fill="#6b7280" text-anchor="middle">200k</text><line x1="80.0" y1="303.6" x2="860.0" y2="303.6" stroke="#1baf7a" stroke-width="2" stroke-dasharray="6 4"/><polyline points="80.0,264.1 99.5,259.9 119.0,255.7 158.0,247.7 275.0,223.5 470.0,182.9 860.0,102.1" fill="none" stroke="#eb6834" stroke-width="2.2"/><circle cx="80.0" cy="264.1" r="3" fill="#eb6834"/><circle cx="99.5" cy="259.9" r="3" fill="#eb6834"/><circle cx="119.0" cy="255.7" r="3" fill="#eb6834"/><circle cx="158.0" cy="247.7" r="3" fill="#eb6834"/><circle cx="275.0" cy="223.5" r="3" fill="#eb6834"/><circle cx="470.0" cy="182.9" r="3" fill="#eb6834"/><circle cx="860.0" cy="102.1" r="3" fill="#eb6834"/><polyline points="80.0,336.2 99.5,332.0 119.0,328.1 158.0,320.1 275.0,295.6 470.0,255.4 860.0,174.1" fill="none" stroke="#2a78d6" stroke-width="2.2"/><circle cx="80.0" cy="336.2" r="3" fill="#2a78d6"/><circle cx="99.5" cy="332.0" r="3" fill="#2a78d6"/><circle cx="119.0" cy="328.1" r="3" fill="#2a78d6"/><circle cx="158.0" cy="320.1" r="3" fill="#2a