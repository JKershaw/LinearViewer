<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Bars: review and close-out findings by what they changed, split by named rule or reviewer judgement">
<rect width="800" height="250" fill="#ffffff"/>
<text x="20.0" y="26.0" font-size="15" fill="#1f2328" text-anchor="start" font-weight="600">What the 483 review and close-out findings changed</text><text x="20.0" y="46.0" font-size="11.5" fill="#667085" text-anchor="start">Solid: raised under a named rule. Pale: raised by reviewer judgement with no specific rule behind it.</text><text x="290.0" y="81.0" font-size="12" fill="#1f2328" text-anchor="end">Fixed a real fault in production code</text><rect x="300" y="64" width="32.3" height="26" fill="#b42318"/><rect x="332.3" y="64" width="18.4" height="26" fill="#b42318" fill-opacity="0.35"/><text x="356.7" y="81.0" font-size="11.5" fill="#667085" text-anchor="start">44 (28 named rule, 16 judgement)</text><text x="290.0" y="121.0" font-size="12" fill="#1f2328" text-anchor="end">Other production-code change</text><rect x="300" y="104" width="24.2" height="26" fill="#0f766e"/><rect x="324.2" y="104" width="15.0" height="26" fill="#0f766e" fill-opacity="0.35"/><text x="345.2" y="121.0" font-size="11.5" fill="#667085" text-anchor="start">34 (21 named rule, 13 judgement)</text><text x="290.0" y="161.0" font-size="12" fill="#1f2328" text-anchor="end">Changed only tests, tooling, docs or wording</text><rect x="300" y="144" width="188.9" height="26" fill="#6941c6"/><rect x="488.9" y="144" width="27.6" height="26" fill="#6941c6" fill-opacity="0.35"/><text x="522.6" y="161.0" font-size="11.5" fill="#667085" text-anchor="start">188 (164 named rule, 24 judgement)</text><text x="290.0" y="201.0" font-size="12" fill="#1f2328" text-anchor="end">Changed nothing here (dropped, accepted or filed)</text><rect x="300" y="184" width="232.7" height="26" fill="#98a2b3"/><rect x="532.7" y="184" width="17.3" height="26" fill="#98a2b3" fill-opacity="0.35"/><text x="556.0" y="201.0" font-size="11.5" fill="#667085" text-anchor="start">217 (202 named rule, 15 judgement)</text>
</svg>
