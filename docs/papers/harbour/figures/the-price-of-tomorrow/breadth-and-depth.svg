<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="Inter, system-ui, sans-serif" font-size="12" role="img" aria-label="Slope chart from the Federal Reserve note on AI adoption, Real-Time Population Survey: the share of US workers using generative AI at work at all rose from 31.0% a year earlier to 40.7% in November 2025 (up 9.7 points, 31.3%); the share using it daily the week before rose from 9.1% to 12% (up 2.9 points, 32%). Daily users stayed about three in ten of all users. The year-earlier values are derived as the level minus the reported change."><style data-figure-theme="1">@media (prefers-color-scheme: dark){rect[fill="#fff"]:not([fill-opacity]),rect[fill="#ffffff"]:not([fill-opacity]),rect[fill="white"]:not([fill-opacity]){fill:#16181d}[stroke="#fff"],[stroke="#ffffff"],[stroke="white"]{stroke:#16181d}circle[fill="#fff"]:not([fill-opacity]),circle[fill="#ffffff"]:not([fill-opacity]),circle[fill="white"]:not([fill-opacity]){fill:#16181d}path[fill="#fff"]:not([fill-opacity]),path[fill="#ffffff"]:not([fill-opacity]),path[fill="white"]:not([fill-opacity]){fill:#16181d}polygon[fill="#fff"]:not([fill-opacity]),polygon[fill="#ffffff"]:not([fill-opacity]),polygon[fill="white"]:not([fill-opacity]){fill:#16181d}ellipse[fill="#fff"]:not([fill-opacity]),ellipse[fill="#ffffff"]:not([fill-opacity]),ellipse[fill="white"]:not([fill-opacity]){fill:#16181d}text[fill="#111827"]:not([data-on-fill]),text[fill="#1f2937"]:not([data-on-fill]),text[fill="#333"]:not([data-on-fill]),text[fill="#1f2328"]:not([data-on-fill]),text[fill="#555"]:not([data-on-fill]),text[fill="#475569"]:not([data-on-fill]){fill:#e6e6e6}[stroke="#111827"],[stroke="#1f2937"],[stroke="#333"],[stroke="#1f2328"],[stroke="#555"],[stroke="#475569"]{stroke:#e6e6e6}text[fill="#6b7280"]:not([data-on-fill]),text[fill="#666"]:not([data-on-fill]),text[fill="#667085"]:not([data-on-fill]),text[fill="#888"]:not([data-on-fill]),text[fill="#6e7781"]:not([data-on-fill]),text[fill="#999"]:not([data-on-fill]),text[fill="#aaa"]:not([data-on-fill]),text[fill="#bbb"]:not([data-on-fill]),text[fill="#9ca3af"]:not([data-on-fill]),text[fill="#94a3b8"]:not([data-on-fill]){fill:#9aa0a6}[stroke="#6b7280"],[stroke="#666"],[stroke="#667085"],[stroke="#888"],[stroke="#6e7781"],[stroke="#999"],[stroke="#aaa"],[stroke="#bbb"],[stroke="#9ca3af"],[stroke="#94a3b8"]{stroke:#9aa0a6}[stroke="#e5e7eb"],[stroke="#eee"],[stroke="#d1d5db"],[stroke="#f0f0f0"],[stroke="#cbd5e1"],[stroke="#d9d9d9"]{stroke:#2c313a}[fill="#f3f4f6"],[fill="#f9fafb"]{fill:#1f222a}rect[fill="#f0f0f0"],rect[fill="#d1d5db"],rect[fill="#e5e7eb"],rect[fill="#eee"]{fill:#2c313a}text:not([fill]):not([class]):not([data-on-fill]){fill:#e6e6e6}rect[fill="#1f2937"],circle[fill="#1f2937"],path[fill="#1f2937"]{fill:#4b5563}rect[fill="#3b1f5e"],circle[fill="#3b1f5e"],path[fill="#3b1f5e"]{fill:#553185}svg .t,svg .h{fill:#e6e6e6}svg .a,svg .s{fill:#9aa0a6}svg .f{fill:#1f222a;stroke:#2c313a}svg .g{stroke:#2c313a}rect[fill="#dbeafe"]{fill:#1d2d44}rect[fill="#93c5fd"]{fill:#2a5a9a}rect[fill="#fff7ed"]{fill:#2a2118}}</style><rect x="0" y="0" width="900" height="430" fill="#fff"/><text x="20" y="28" fill="#111827" font-size="16" font-weight="600">Wide and shallow: US workers using generative AI at work, %</text><text x="20" y="48" fill="#6b7280">Share of workers who used it at all, and who used it every day in the week before the survey. Real-Time Population Survey.</text><line x1="240" y1="350" x2="660" y2="350" stroke="#e5e7eb" stroke-width="1"/><text x="232" y="354" fill="#6b7280" font-size="11" text-anchor="end">0</text><line x1="240" y1="302" x2="660" y2="302" stroke="#e5e7eb" stroke-width="1"/><text x="232" y="306" fill="#6b7280" font-size="11" text-anchor="end">10</text><line x1="240" y1="254" x2="660" y2="254" stroke="#e5e7eb" stroke-width="1"/><text x="232" y="258" fill="#6b7280" font-size="11" text-anchor="end">20</text><line x1="240" y1="206" x2="660" y2="206" stroke="#e5e7eb" stroke-width="1"/><text x="232" y="210" fill="#6b7280" font-size="11" text-anchor="end">30</text><line x1="240" y1="158" x2="660" y2="158" stroke="#e5e7eb" stroke-width="1"/><text x="232" y="162" fill="#6b7280" font-size="11" text-anchor="end">40</text><line x1="240" y1="110" x2="660" y2="110" stroke="#e5e7eb" stroke-width="1"/><text x="232" y="114" fill="#6b7280" font-size="11" text-anchor="end">50</text><text x="300" y="370" fill="#111827" font-size="11" text-anchor="middle">A year earlier (derived)</text><text x="600" y="370" fill="#111827" font-size="11" text-anchor="middle">November 2025</text><line x1="300" y1="201.2" x2="600" y2="154.64" stroke="#2a78d6" stroke-width="2.5"/><circle cx="300" cy="201.2" r="6" fill="#fff" stroke="#2a78d6" stroke-width="2.5"/><circle cx="600" cy="154.64" r="6" fill="#2a78d6"/><text x="286" y="205.2" fill="#111827" font-size="12" font-weight="600" text-anchor="end">31.0</text><text x="614" y="150.64" fill="#111827" font-size="12" font-weight="600">Used it at work at all: 40.7</text><text x="614" y="166.64" fill="#6b7280" font-size="11">+9.7 points, +31.3%</text><line x1="300" y1="306.32" x2="600" y2="292.4" stroke="#d97706" stroke-width="2.5"/><circle cx="300" cy="306.32" r="6" fill="#fff" stroke="#d97706" stroke-width="2.5"/><circle cx="600" cy="292.4" r="6" fill="#d97706"/><text x="286" y="310.32" fill="#111827" font-size="12" font-weight="600" text-anchor="end">9.1</text><text x="614" y="288.4" fill="#111827" font-size="12" font-weight="600">Used it daily last week: 12</text><text x="614" y="304.4" fill="#6b7280" font-size="11">+2.9 points, +32%</text><text x="20" y="110" fill="#6b7280" font-size="11">Daily users are about</text><text x="20" y="124" fill="#6b7280" font-size="11">three in ten of all users</text><text x="20" y="138" fill="#6b7280" font-size="11">in both years.</text><text x="20" y="160" fill="#6b7280" font-size="11">In points the gap opened;</text><text x="20" y="174" fill="#6b7280" font-size="11">in proportion it held.</text><text x="20" y="394" fill="#111827" font-size="12" font-style="italic">“Daily usage is less than a third of the overall rate but has grown at a similar pace.” — the FEDS Note</text><text x="20" y="416" fill="#6b7280" font-size="11">Hollow points are derived, not published: the November 2025 level minus the year-on-year change the source reports.</text></svg>
