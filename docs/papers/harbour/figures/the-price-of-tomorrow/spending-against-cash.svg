ddle">Q1 2026</text><text x="330" y="420" fill="#111827" font-size="14" font-weight="700" text-anchor="middle">+10.1</text><rect x="403" y="217.212" width="30" height="162.788" fill="#2a78d6"/><text x="418" y="212.212" fill="#6b7280" font-size="10" text-anchor="middle">39.1</text><rect x="437" y="192.817" width="30" height="187.183" fill="#d97706"/><text x="452" y="187.817" fill="#6b7280" font-size="10" text-anchor="middle">44.9</text><text x="435" y="398" fill="#111827" font-size="11" text-anchor="middle">Q2 2026</text><text x="435" y="420" fill="#dc2626" font-size="14" font-weight="700" text-anchor="middle">−5.9</text><rect x="508" y="203.792" width="30" height="176.208" fill="#2a78d6"/><text x="523" y="198.792" fill="#6b7280" font-size="10" text-anchor="middle">42.3</text><rect x="542" y="166.021" width="30" height="213.979" fill="#d97706"/><text x="557" y="161.021" fill="#6b7280" font-size="10" text-anchor="middle">51.4</text><text x="540" y="398" fill="#111827" font-size="11" text-anchor="middle">Q3 2026</text><text x="540" y="420" fill="#dc2626" font-size="14" font-weight="700" text-anchor="middle">−9.1</text><line x1="655" y1="104" x2="655" y2="428" stroke="#e5e7eb" stroke-width="1"/><text x="672" y="112" fill="#111827" font-weight="600">Meta, the two quarters on record</text><text x="672" y="126" fill="#6b7280" font-size="11">its capital spending includes</text><text x="672" y="140" fill="#6b7280" font-size="11">finance-lease payments</text><rect x="688" y="255.004" width="30" height="124.996" fill="#2a78d6"/><text x="703" y="250.004" fill="#6b7280" font-size="10" text-anchor="middle">30.0</text><rect x="722" y="299.275" width="30" height="80.725" fill="#d97706"/><text x="737" y="294.275" fill="#6b7280" font-size="10" text-anchor="middle">19.4</text><text x="720" y="398" fill="#111827" font-size="11" text-anchor="middle">Q3 2025</text><text x="720" y="420" fill="#111827" font-size="14" font-weight="700" text-anchor="middle">+10.6</text><rect x="798" y="243.3