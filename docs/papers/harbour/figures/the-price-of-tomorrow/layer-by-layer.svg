<svg xmlns="http://www.w3.org/2000/svg" width="900" height="656" viewBox="0 0 900 656" font-family="Inter, system-ui, sans-serif" font-size="12" role="img" aria-label="Diagram of the essay’s reading, not data: a grid of five layers by four trajectories, with what each trajectory predicts for each layer and what the record shows by October 2026. Chips and cloud are placed: they are earning, which argues against the divided economy as first stated but does not tell dot-com from breakthrough. Model labs and debt-financed data-centre owners are drawn open, as layers that cannot be placed: the labs report run-rates and project losses, and the owners publish no returns. Users are partly placed: surplus above revenue at one point, use wide and shallow and rising. The record argues against winter so far."><style data-figure-theme="1">@media (prefers-color-scheme: dark){rect[fill="#fff"]:not([fill-opacity]),rect[fill="#ffffff"]:not([fill-opacity]),rect[fill="white"]:not([fill-opacity]){fill:#16181d}[stroke="#fff"],[stroke="#ffffff"],[stroke="white"]{stroke:#16181d}circle[fill="#fff"]:not([fill-opacity]),circle[fill="#ffffff"]:not([fill-opacity]),circle[fill="white"]:not([fill-opacity]){fill:#16181d}path[fill="#fff"]:not([fill-opacity]),path[fill="#ffffff"]:not([fill-opacity]),path[fill="white"]:not([fill-opacity]){fill:#16181d}polygon[fill="#fff"]:not([fill-opacity]),polygon[fill="#ffffff"]:not([fill-opacity]),polygon[fill="white"]:not([fill-opacity]){fill:#16181d}ellipse[fill="#fff"]:not([fill-opacity]),ellipse[fill="#ffffff"]:not([fill-opacity]),ellipse[fill="white"]:not([fill-opacity]){fill:#16181d}text[fill="#111827"]:not([data-on-fill]),text[fill="#1f2937"]:not([data-on-fill]),text[fill="#333"]:not([data-on-fill]),text[fill="#1f2328"]:not([data-on-fill]),text[fill="#555"]:not([data-on-fill]),text[fill="#475569"]:not([data-on-fill]){fill:#e6e6e6}[stroke="#111827"],[stroke="#1f2937"],[stroke="#333"],[stroke="#1f2328"],[stroke="#555"],[stroke="#475569"]{stroke:#e6e6e6}text[fill="#6b7280"]:not([data-on-fill]),text[fill="#666"]:not([data-on-fill]),text[fill="#667085"]:not([data-on-fill]),text[fill="#888"]:not([data-on-fill]),text[fill="#6e7781"]:not([data-on-fill]),text[fill="#999"]:not([data-on-fill]),text[fill="#aaa"]:not([data-on-fill]),text[fill="#bbb"]:not([data-on-fill]),text[fill="#9ca3af"]:not([data-on-fill]),text[fill="#94a3b8"]:not([data-on-fill]){fill:#9aa0a6}[stroke="#6b7280"],[stroke="#666"],[stroke="#667085"],[stroke="#888"],[stroke="#6e7781"],[stroke="#999"],[stroke="#aaa"],[stroke="#bbb"],[stroke="#9ca3af"],[stroke="#94a3b8"]{stroke:#9aa0a6}[stroke="#e5e7eb"],[stroke="#eee"],[stroke="#d1d5db"],[stroke="#f0f0f0"],[stroke="#cbd5e1"],[stroke="#d9d9d9"]{stroke:#2c313a}[fill="#f3f4f6"],[fill="#f9fafb"]{fill:#1f222a}rect[fill="#f0f0f0"],rect[fill="#d1d5db"],rect[fill="#e5e7eb"],rect[fill="#eee"]{fill:#2c313a}text:not([fill]):not([class]):not([data-on-fill]){fill:#e6e6e6}rect[fill="#1f2937"],circle[fill="#1f2937"],path[fill="#1f2937"]{fill:#4b5563}rect[fill="#3b1f5e"],circle[fill="#3b1f5e"],path[fill="#3b1f5e"]{fill:#553185}svg .t,svg .h{fill:#e6e6e6}svg .a,svg .s{fill:#9aa0a6}svg .f{fill:#1f222a;stroke:#2c313a}svg .g{stroke:#2c313a}rect[fill="#dbeafe"]{fill:#1d2d44}rect[fill="#93c5fd"]{fill:#2a5a9a}rect[fill="#fff7ed"]{fill:#2a2118}}</style><rect x="0" y="0" width="900" height="656" fill="#fff"/><text x="20" y="28" fill="#111827" font-size="16" font-weight="600">The record, layer by layer</text><rect x="20" y="40" width="860" height="26" rx="4" fill="#fef3c7" stroke="#d97706"/><text x="450" y="58" fill="#92400e" font-weight="600" text-anchor="middle">THE ESSAY’S READING OF ITS SOURCES — not data and not a forecast.</text><text x="20" y="88" fill="#6b7280" font-size="11">What each trajectory predicts for each layer, and what the record shows by October 2026. A layer is placed only where the evidence is published.</text><text x="20" y="116" fill="#111827" font-weight="600">Layer</text><text x="160" y="116" fill="#111827" font-weight="600">Dot-com</text><text x="280" y="116" fill="#111827" font-weight="600">Breakthrough</text><text x="400" y="116" fill="#111827" font-weight="600">Winter</text><text x="520" y="116" fill="#111827" font-weight="600">Divided</text><text x="648" y="116" fill="#111827" font-weight="600">The record by October 2026</text><rect x="20" y="126" width="614" height="86" rx="4" fill="#f3f4f6"/><text x="28" y="146" fill="#111827" font-weight="600">Chips</text><text x="160" y="146" fill="#111827" font-size="11">earn until orders</text><text x="160" y="160" fill="#111827" font-size="11">stop, then fall</text><text x="280" y="146" fill="#111827" font-size="11">keep earning</text><text x="400" y="146" fill="#111827" font-size="11">fall</text><text x="520" y="146" fill="#111827" font-size="11">keep earning while</text><text x="520" y="160" fill="#111827" font-size="11">scarce</text><rect x="640" y="126" width="240" height="86" rx="4" fill="#fff" stroke="#2a78d6" stroke-width="2"/><circle cx="656" cy="142" r="6" fill="#2a78d6"/><text x="668" y="147" fill="#111827" font-size="14" font-weight="700">Placed</text><text x="650" y="164" fill="#6b7280" font-size="10.5">75% gross margin; data-centre revenue up</text><text x="650" y="177" fill="#6b7280" font-size="10.5">117% [NVDA26]. Earning, but chips also</text><text x="650" y="190" fill="#6b7280" font-size="10.5">earn under dot-com until orders stop.</text><rect x="20" y="218" width="614" height="86" rx="4" fill="#f3f4f6"/><text x="28" y="238" fill="#111827" font-weight="600">Cloud</text><text x="160" y="238" fill="#111827" font-size="11">idle capacity,</text><text x="160" y="252" fill="#111827" font-size="11">falling prices</text><text x="280" y="238" fill="#111827" font-size="11">profitable growth</text><text x="400" y="238" fill="#111827" font-size="11">contracts</text><text x="520" y="238" fill="#111827" font-size="11">grows, thin return</text><text x="520" y="252" fill="#111827" font-size="11">on the capital</text><rect x="640" y="218" width="240" height="86" rx="4" fill="#fff" stroke="#2a78d6" stroke-width="2"/><circle cx="656" cy="234" r="6" fill="#2a78d6"/><text x="668" y="239" fill="#111827" font-size="14" font-weight="700">Placed</text><text x="650" y="256" fill="#6b7280" font-size="10.5">Google Cloud up 103% at an operating</text><text x="650" y="269" fill="#6b7280" font-size="10.5">profit [GOOG26]; demand above capacity</text><text x="650" y="282" fill="#6b7280" font-size="10.5">[MSFT26]. Whether the capital earns its</text><text x="650" y="295" fill="#6b7280" font-size="10.5">cost is not shown.</text><rect x="20" y="310" width="614" height="86" rx="4" fill="#f3f4f6"/><text x="28" y="330" fill="#111827" font-weight="600">Model labs</text><text x="160" y="330" fill="#111827" font-size="11">many fail;</text><text x="160" y="344" fill="#111827" font-size="11">survivors buy</text><text x="160" y="358" fill="#111827" font-size="11">compute cheaply</text><text x="280" y="330" fill="#111827" font-size="11">margins widen</text><text x="400" y="330" fill="#111827" font-size="11">funding gone</text><text x="520" y="330" fill="#111827" font-size="11">revenue grows,</text><text x="520" y="344" fill="#111827" font-size="11">margins stay thin</text><rect x="640" y="310" width="240" height="86" rx="4" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4"/><circle cx="656" cy="326" r="6" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3 2"/><text x="668" y="331" fill="#dc2626" font-size="14" font-weight="700">Open: cannot be placed</text><text x="650" y="348" fill="#6b7280" font-size="10.5">Fast growth on run-rates; losses</text><text x="650" y="361" fill="#6b7280" font-size="10.5">projected to 2030 [OAI26a] [OAI26b]</text><text x="650" y="374" fill="#6b7280" font-size="10.5">[ANT26].</text><rect x="20" y="402" width="614" height="86" rx="4" fill="#f3f4f6"/><text x="28" y="422" fill="#111827" font-weight="600">Data-centre owners</text><text x="28" y="437" fill="#111827" font-weight="600">financed by debt</text><text x="160" y="422" fill="#111827" font-size="11">losses pass to</text><text x="160" y="436" fill="#111827" font-size="11">lenders</text><text x="280" y="422" fill="#111827" font-size="11">refinanced from</text><text x="280" y="436" fill="#111827" font-size="11">earnings</text><text x="400" y="422" fill="#111827" font-size="11">losses pass to</text><text x="400" y="436" fill="#111827" font-size="11">lenders</text><text x="520" y="422" fill="#111827" font-size="11">thin returns, slow</text><text x="520" y="436" fill="#111827" font-size="11">repayment</text><rect x="640" y="402" width="240" height="86" rx="4" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4"/><circle cx="656" cy="418" r="6" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3 2"/><text x="668" y="423" fill="#dc2626" font-size="14" font-weight="700">Open: cannot be placed</text><text x="650" y="440" fill="#6b7280" font-size="10.5">Debt rising fast [BOE26]; no returns</text><text x="650" y="453" fill="#6b7280" font-size="10.5">published.</text><rect x="20" y="494" width="614" height="86" rx="4" fill="#f3f4f6"/><text x="28" y="514" fill="#111827" font-weight="600">Users</text><text x="160" y="514" fill="#111827" font-size="11">use keeps spreading</text><text x="160" y="528" fill="#111827" font-size="11">on cheap capacity</text><text x="280" y="514" fill="#111827" font-size="11">use deepens;</text><text x="280" y="528" fill="#111827" font-size="11">exposed industries</text><text x="280" y="542" fill="#111827" font-size="11">pull away</text><text x="400" y="514" fill="#111827" font-size="11">use falls</text><text x="520" y="514" fill="#111827" font-size="11">surplus well above</text><text x="520" y="528" fill="#111827" font-size="11">what they pay</text><rect x="640" y="494" width="240" height="86" rx="4" fill="#fff" stroke="#93c5fd" stroke-width="2"/><path d="M 656 504 A 6 6 0 0 1 656 516 Z" fill="#2a78d6"/><circle cx="656" cy="510" r="6" fill="none" stroke="#2a78d6" stroke-width="1.5"/><text x="668" y="515" fill="#111827" font-size="14" font-weight="700">Partly placed</text><text x="650" y="532" fill="#6b7280" font-size="10.5">Surplus above revenue at one point, in</text><text x="650" y="545" fill="#6b7280" font-size="10.5">one market [BCE26]; use wide and</text><text x="650" y="558" fill="#6b7280" font-size="10.5">shallow, rising [FED26].</text><text x="20" y="604" fill="#111827" font-weight="600">The two open layers are where dot-com, breakthrough and divided part company, and they are the two the record cannot place.</text><text x="20" y="624" fill="#6b7280" font-size="11">Across every layer the record argues against winter so far. No single trajectory is the verdict.</text><text x="20" y="640" fill="#6b7280" font-size="11">Solid outline: placed. Pale outline, half disc: partly placed. Dashed, hollow: open.</text></svg>
