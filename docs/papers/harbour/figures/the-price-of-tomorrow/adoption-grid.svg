<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" viewBox="0 0 820 470" font-family="Inter, system-ui, sans-serif" font-size="12" role="img" aria-label="Diagram, not data. A two by two grid: general-purpose tool or embedded in a product, by defined task or open-ended objective, shaded by the expertise the operator needs. Conversational use is general-purpose and defined; embedded intelligence is embedded and defined; expert-led open-ended work such as Harbour is general-purpose and open-ended and needs the most expertise; embedded and open-ended is mostly unbuilt."><style data-figure-theme="1">@media (prefers-color-scheme: dark){rect[fill="#fff"]:not([fill-opacity]),rect[fill="#ffffff"]:not([fill-opacity]),rect[fill="white"]:not([fill-opacity]){fill:#16181d}[stroke="#fff"],[stroke="#ffffff"],[stroke="white"]{stroke:#16181d}circle[fill="#fff"]:not([fill-opacity]),circle[fill="#ffffff"]:not([fill-opacity]),circle[fill="white"]:not([fill-opacity]){fill:#16181d}path[fill="#fff"]:not([fill-opacity]),path[fill="#ffffff"]:not([fill-opacity]),path[fill="white"]:not([fill-opacity]){fill:#16181d}polygon[fill="#fff"]:not([fill-opacity]),polygon[fill="#ffffff"]:not([fill-opacity]),polygon[fill="white"]:not([fill-opacity]){fill:#16181d}ellipse[fill="#fff"]:not([fill-opacity]),ellipse[fill="#ffffff"]:not([fill-opacity]),ellipse[fill="white"]:not([fill-opacity]){fill:#16181d}text[fill="#111827"]:not([data-on-fill]),text[fill="#1f2937"]:not([data-on-fill]),text[fill="#333"]:not([data-on-fill]),text[fill="#1f2328"]:not([data-on-fill]),text[fill="#555"]:not([data-on-fill]),text[fill="#475569"]:not([data-on-fill]){fill:#e6e6e6}[stroke="#111827"],[stroke="#1f2937"],[stroke="#333"],[stroke="#1f2328"],[stroke="#555"],[stroke="#475569"]{stroke:#e6e6e6}text[fill="#6b7280"]:not([data-on-fill]),text[fill="#666"]:not([data-on-fill]),text[fill="#667085"]:not([data-on-fill]),text[fill="#888"]:not([data-on-fill]),text[fill="#6e7781"]:not([data-on-fill]),text[fill="#999"]:not([data-on-fill]),text[fill="#aaa"]:not([data-on-fill]),text[fill="#bbb"]:not([data-on-fill]),text[fill="#9ca3af"]:not([data-on-fill]),text[fill="#94a3b8"]:not([data-on-fill]){fill:#9aa0a6}[stroke="#6b7280"],[stroke="#666"],[stroke="#667085"],[stroke="#888"],[stroke="#6e7781"],[stroke="#999"],[stroke="#aaa"],[stroke="#bbb"],[stroke="#9ca3af"],[stroke="#94a3b8"]{stroke:#9aa0a6}[stroke="#e5e7eb"],[stroke="#eee"],[stroke="#d1d5db"],[stroke="#f0f0f0"],[stroke="#cbd5e1"],[stroke="#d9d9d9"]{stroke:#2c313a}[fill="#f3f4f6"],[fill="#f9fafb"]{fill:#1f222a}rect[fill="#f0f0f0"],rect[fill="#d1d5db"],rect[fill="#e5e7eb"],rect[fill="#eee"]{fill:#2c313a}text:not([fill]):not([class]):not([data-on-fill]){fill:#e6e6e6}rect[fill="#1f2937"],circle[fill="#1f2937"],path[fill="#1f2937"]{fill:#4b5563}rect[fill="#3b1f5e"],circle[fill="#3b1f5e"],path[fill="#3b1f5e"]{fill:#553185}svg .t,svg .h{fill:#e6e6e6}svg .a,svg .s{fill:#9aa0a6}svg .f{fill:#1f222a;stroke:#2c313a}svg .g{stroke:#2c313a}rect[fill="#dbeafe"]{fill:#1d2d44}rect[fill="#93c5fd"]{fill:#2a5a9a}rect[fill="#fff7ed"]{fill:#2a2118}}</style><rect x="0" y="0" width="820" height="470" fill="#fff"/><text x="20" y="28" fill="#111827" font-size="16" font-weight="600">Three ways AI reaches work</text><text x="20" y="48" fill="#6b7280" font-size="11">Diagram: a way of sorting uses, not data. Shading is the expertise the operator needs to get a reliable result.</text><rect x="174" y="94" width="302" height="152" rx="6" fill="#f9fafb" stroke="#e5e7eb"/><text x="188" y="120" fill="#2a78d6" font-size="13" font-weight="600">Conversational use</text><text x="188" y="142" fill="#111827" font-size="11.5">Ask, draft, summarise, translate.</text><text x="188" y="159" fill="#111827" font-size="11.5">Low expertise to start; the user checks.</text><text x="188" y="176" fill="#111827" font-size="11.5">Spreads like a consumer app: wide, shallow.</text><text x="188" y="193" fill="#111827" font-size="11.5">Measured by &quot;uses AI at all&quot;.</text><rect x="484" y="94" width="302" height="152" rx="6" fill="#f9fafb" stroke="#e5e7eb"/><text x="498" y="120" fill="#059669" font-size="13" font-weight="600">Embedded intelligence</text><text x="498" y="142" fill="#111827" font-size="11.5">Search ranking, fraud checks, transcription,</text><text x="498" y="159" fill="#111827" font-size="11.5">coding features inside an editor.</text><text x="498" y="176" fill="#111827" font-size="11.5">The user needs no AI expertise; the builder does.</text><text x="498" y="193" fill="#111827" font-size="11.5">Spreads with the product it lives in.</text><rect x="174" y="254" width="302" height="152" rx="6" fill="#e5e7eb" stroke="#e5e7eb"/><text x="188" y="280" fill="#7c3aed" font-size="13" font-weight="600">Expert-led open-ended work</text><text x="188" y="302" fill="#111827" font-size="11.5">An operator directs agents at a goal</text><text x="188" y="319" fill="#111827" font-size="11.5">and judges what comes back (Harbour).</text><text x="188" y="336" fill="#111827" font-size="11.5">High expertise; value rests on verification.</text><text x="188" y="353" fill="#111827" font-size="11.5">Spreads person by person, slowly.</text><rect x="484" y="254" width="302" height="152" rx="6" fill="#f3f4f6" stroke="#e5e7eb"/><text x="498" y="280" fill="#6b7280" font-size="13" font-weight="600">Embedded and open-ended</text><text x="498" y="302" fill="#111827" font-size="11.5">A product that carries an open goal to a</text><text x="498" y="319" fill="#111827" font-size="11.5">verified result for a non-expert.</text><text x="498" y="336" fill="#111827" font-size="11.5">Mostly unbuilt: where the gap between</text><text x="498" y="353" fill="#111827" font-size="11.5">capability and captured value is widest.</text><text x="158" y="170" fill="#111827" font-weight="600" text-anchor="end">Defined task</text><text x="158" y="330" fill="#111827" font-weight="600" text-anchor="end">Open-ended</text><text x="158" y="346" fill="#111827" font-weight="600" text-anchor="end">objective</text><text x="325" y="78" fill="#111827" font-weight="600" text-anchor="middle">General-purpose tool</text><text x="635" y="78" fill="#111827" font-weight="600" text-anchor="middle">Embedded in a product</text><text x="20" y="444" fill="#6b7280" font-size="11">Darker cell: more operator expertise needed. Depth of adoption differs by cell; a single &quot;share using AI&quot; figure adds the cells together.</text></svg>
