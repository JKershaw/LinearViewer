<text x="460" y="677" font-size="11.5" fill="#111827" text-anchor="middle">Three reports</text>
<text x="648" y="694" font-size="11.5" fill="#6b7280" font-weight="600">posted to a lane that had closed</text>
<text x="20" y="740" font-size="11.5" fill="#6b7280" font-family="JetBrains Mono, ui-monospace, monospace">10:52</text>
