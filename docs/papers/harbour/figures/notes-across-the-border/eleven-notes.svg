<rect x="270" y="725" width="334" height="22" fill="#fff"/>
<text x="604" y="740" font-size="12" fill="#111827" font-weight="600" text-anchor="end">Prompts' last step changes two things on Runs' side</text>
<text x="648" y="740" font-size="11.5" fill="#eb6834" font-weight="600">nothing posted to Runs</text>
