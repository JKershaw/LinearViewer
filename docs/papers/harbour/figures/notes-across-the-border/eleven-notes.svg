<text x="460" y="221" font-size="11.5" fill="#111827" text-anchor="middle">&quot;Agree to all three&quot;</text>
<text x="648" y="234" font-size="11.5" fill="#2a78d6" font-weight="600">Runs builds on it</text>
<text x="20" y="280" font-size="11.5" fill="#6b7280" font-family="JetBrains Mono, ui-monospace, monospace">15:55</text>
<line x1="620" y1="276" x2="303" y2="276" stroke="#2a78d6" stroke-width="2" marker-end="url(#n-taken)"/>
<rect x="610" y="266" width="20" height="20" rx="10" fill="#2a78d6"/>
<text x="620" y="280" font-size="11" fill="#fff" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace">3</text>
<text x="460" y="267" font-size="11.5" fill="#111827" text-anchor="middle">A correction: &quot;That was wrong.&quot;</text>
<text x="648" y="280" font-size="11.5" fill="#2a78d6" font-weight="600">Runs builds on it</text>
<text x="20" y="326" font-size="11.5" fill="#6b7280" font-family="JetBrains Mono, ui-monospace, monospace">16:42</text>
<line x1="300" y1="322" x2="617" y2="322" stroke="#eb6834" stroke-width="2" marker-end="url(#n-unanswered)"/>
<rect x="290" y="312" width="20" height="20" rx="10" fill="#eb6834"/>
