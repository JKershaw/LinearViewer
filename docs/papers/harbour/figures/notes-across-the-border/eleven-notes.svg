<text x="648" y="372" font-size="11.5" fill="#eb6834" font-weight="600">no reply on record</text>
<text x="20" y="418" font-size="11.5" fill="#6b7280" font-family="JetBrains Mono, ui-monospace, monospace">17:06</text>
<line x1="300" y1="414" x2="617" y2="414" stroke="#eb6834" stroke-width="2" marker-end="url(#n-unanswered)"/>
