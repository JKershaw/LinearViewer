<text x="20" y="28" font-size="14" fill="#111827" font-weight="600">Eleven notes across the border</text>
<text x="20" y="46" font-size="11.5" fill="#6b7280">Every note one lane wrote to the other, 13 and 14 November, in order. Times are UTC.</text>
