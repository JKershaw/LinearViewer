<text x="300" y="188" font-size="11" fill="#fff" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace">1</text>
<text x="460" y="175" font-size="11.5" fill="#111827" text-anchor="middle">Three moves proposed: &quot;reply … with agree&quot;</text>
<text x="648" y="188" font-size="11.5" fill="#2a78d6" font-weight="600">answered at 15:39</text>
