<text x="460" y="313" font-size="11.5" fill="#111827" text-anchor="middle">The ask renewed, with a new detail</text>
<text x="648" y="326" font-size="11.5" fill="#eb6834" font-weight="600">no reply on record</text>
<text x="20" y="372" font-size="11.5" fill="#6b7280" font-family="JetBrains Mono, ui-monospace, monospace">16:42</text>
