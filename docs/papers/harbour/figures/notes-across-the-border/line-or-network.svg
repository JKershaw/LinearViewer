<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" font-family="Inter, system-ui, sans-serif" font-size="12" role="img" aria-label="Top: under today's rule work that shares a file takes turns, one piece after another; with notes that work, two lanes run side by side and settle the border as they go. Bottom, three new ways to go wrong: waits, where a question waits as long as the slowest party; knots, where two lanes each hold work and wait for the other; and unseen decisions, where one side decides for both where only it looks. A drawing, not data."><style data-figure-theme="1">@media (prefers-color-scheme: dark){rect[fill="#fff"]:not([fill-opacity]),rect[fill="#ffffff"]:not([fill-opacity]),rect[fill="white"]:not([fill-opacity]){fill:#16181d}[stroke="#fff"],[stroke="#ffffff"],[stroke="white"]{stroke:#16181d}circle[fill="#fff"]:not([fill-opacity]),circle[fill="#ffffff"]:not([fill-opacity]),circle[fill="white"]:not([fill-opacity]){fill:#16181d}path[fill="#fff"]:not([fill-opacity]),path[fill="#ffffff"]:not([fill-opacity]),path[fill="white"]:not([fill-opacity]){fill:#16181d}polygon[fill="#fff"]:not([fill-opacity]),polygon[fill="#ffffff"]:not([fill-opacity]),polygon[fill="white"]:not([fill-opacity]){fill:#16181d}ellipse[fill="#fff"]:not([fill-opacity]),ellipse[fill="#ffffff"]:not([fill-opacity]),ellipse[fill="white"]:not([fill-opacity]){fill:#16181d}text[fill="#111827"]:not([data-on-fill]),text[fill="#1f2937"]:not([data-on-fill]),text[fill="#333"]:not([data-on-fill]),text[fill="#1f2328"]:not([data-on-fill]),text[fill="#555"]:not([data-on-fill]),text[fill="#475569"]:not([data-on-fill]){fill:#e6e6e6}[stroke="#111827"],[stroke="#1f2937"],[stroke="#333"],[stroke="#1f2328"],[stroke="#555"],[stroke="#475569"]{stroke:#e6e6e6}text[fill="#6b7280"]:not([data-on-fill]),text[fill="#666"]:not([data-on-fill]),text[fill="#667085"]:not([data-on-fill]),text[fill="#888"]:not([data-on-fill]),text[fill="#6e7781"]:not([data-on-fill]),text[fill="#999"]:not([data-on-fill]),text[fill="#aaa"]:not([data-on-fill]),text[fill="#bbb"]:not([data-on-fill]),text[fill="#9ca3af"]:not([data-on-fill]),text[fill="#94a3b8"]:not([data-on-fill]){fill:#9aa0a6}[stroke="#6b7280"],[stroke="#666"],[stroke="#667085"],[stroke="#888"],[stroke="#6e7781"],[stroke="#999"],[stroke="#aaa"],[stroke="#bbb"],[stroke="#9ca3af"],[stroke="#94a3b8"]{stroke:#9aa0a6}[stroke="#e5e7eb"],[stroke="#eee"],[stroke="#d1d5db"],[stroke="#f0f0f0"],[stroke="#cbd5e1"],[stroke="#d9d9d9"]{stroke:#2c313a}[fill="#f3f4f6"],[fill="#f9fafb"]{fill:#1f222a}rect[fill="#f0f0f0"],rect[fill="#d1d5db"],rect[fill="#e5e7eb"],rect[fill="#eee"]{fill:#2c313a}text:not([fill]):not([class]):not([data-on-fill]){fill:#e6e6e6}rect[fill="#1f2937"],circle[fill="#1f2937"],path[fill="#1f2937"]{fill:#4b5563}rect[fill="#3b1f5e"],circle[fill="#3b1f5e"],path[fill="#3b1f5e"]{fill:#553185}svg .t,svg .h{fill:#e6e6e6}svg .a,svg .s{fill:#9aa0a6}svg .f{fill:#1f222a;stroke:#2c313a}svg .g{stroke:#2c313a}rect[fill="#dbeafe"]{fill:#1d2d44}rect[fill="#93c5fd"]{fill:#2a5a9a}rect[fill="#fff7ed"]{fill:#2a2118}}</style><rect x="0" y="0" width="960" height="520" fill="#fff"/>
<defs><marker id="k-grey" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="#6b7280"/></marker><marker id="k-orange" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="#eb6834"/></marker><marker id="k-blue" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="#2a78d6"/></marker></defs>
<text x="20" y="28" font-size="14" fill="#111827" font-weight="600">What it opens, and what it costs</text>
<rect x="20" y="46" width="450" height="172" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2"/>
<text x="36" y="70" font-size="13" fill="#111827" font-weight="600">Today's rule: work that shares a file takes turns</text>
<rect x="44" y="92" width="170" height="36" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/><text x="129" y="115" font-size="12" fill="#111827" text-anchor="middle">one side of the tangle</text>
<line x1="218" y1="110" x2="270" y2="110" stroke="#6b7280" stroke-width="1.6" marker-end="url(#k-grey)"/>
<rect x="276" y="92" width="170" height="36" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/><text x="361" y="115" font-size="12" fill="#111827" text-anchor="middle">then the other side</text>
<text x="44" y="160" font-size="11.5" fill="#6b7280">One lane, one piece after another. Nothing collides,</text><text x="44" y="176" font-size="11.5" fill="#6b7280">and the second side waits for the first.</text>
<rect x="490" y="46" width="450" height="172" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2"/>
<text x="506" y="70" font-size="13" fill="#111827" font-weight="600">With notes that work: side by side</text>
<rect x="514" y="92" width="170" height="36" rx="6" fill="#dbeafe" stroke="#2a78d6" stroke-width="1.4"/><text x="599" y="115" font-size="12" fill="#111827" text-anchor="middle">one side of the tangle</text>
<rect x="746" y="92" width="170" height="36" rx="6" fill="#dbeafe" stroke="#2a78d6" stroke-width="1.4"/><text x="831" y="115" font-size="12" fill="#111827" text-anchor="middle">the other side</text>
<line x1="715" y1="84" x2="715" y2="138" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="3 6"/>
<line x1="690" y1="103" x2="740" y2="103" stroke="#eb6834" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#k-orange)"/>
<line x1="740" y1="117" x2="690" y2="117" stroke="#eb6834" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#k-orange)"/>
<text x="514" y="160" font-size="11.5" fill="#6b7280">Two lanes at once. The border is settled by note, as the</text><text x="514" y="176" font-size="11.5" fill="#6b7280">work shows where it should run. Tests still check every merge.</text>
<text x="20" y="252" font-size="13" fill="#111827" font-weight="600">Three new ways to go wrong</text>
<rect x="20" y="266" width="296" height="196" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2"/>
<text x="36" y="290" font-size="13" fill="#111827" font-weight="600">Waits</text>
<rect x="40" y="310" width="64" height="30" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/><text x="72" y="330" font-size="11.5" fill="#111827" text-anchor="middle">lane A</text>
<line x1="108" y1="325" x2="134" y2="325" stroke="#eb6834" stroke-width="1.8" marker-end="url(#k-orange)"/>
<rect x="140" y="310" width="64" height="30" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/><text x="172" y="330" font-size="11.5" fill="#111827" text-anchor="middle">lane B</text>
<line x1="208" y1="325" x2="234" y2="325" stroke="#eb6834" stroke-width="1.8" marker-end="url(#k-orange)"/>
<rect x="240" y="310" width="56" height="30" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/><text x="268" y="330" font-size="11.5" fill="#111827" text-anchor="middle">John</text>
<text x="40" y="370" font-size="11.5" fill="#111827">A question waits as long as the slowest</text><text x="40" y="386" font-size="11.5" fill="#111827">party behind it, and that can be a person.</text>
<text x="40" y="416" font-size="11.5" fill="#6b7280">What helps: a default with a deadline,</text><text x="40" y="432" font-size="11.5" fill="#6b7280">so the asker is never stuck.</text>
<rect x="332" y="266" width="296" height="196" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2"/>
<text x="348" y="290" font-size="13" fill="#111827" font-weight="600">Knots</text>
<rect x="376" y="310" width="64" height="30" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/><text x="408" y="330" font-size="11.5" fill="#111827" text-anchor="middle">lane A</text>
<rect x="520" y="310" width="64" height="30" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/><text x="552" y="330" font-size="11.5" fill="#111827" text-anchor="middle">lane B</text>
<path d="M444 318 C 468 304, 492 304, 516 318" fill="none" stroke="#eb6834" stroke-width="1.8" marker-end="url(#k-orange)"/>
<path d="M516 332 C 492 346, 468 346, 444 332" fill="none" stroke="#eb6834" stroke-width="1.8" marker-end="url(#k-orange)"/>
<text x="352" y="370" font-size="11.5" fill="#111827">Each holds its work and waits for the</text><text x="352" y="386" font-size="11.5" fill="#111827">other. Every wait is reasonable.</text>
<text x="352" y="416" font-size="11.5" fill="#6b7280">What helps: the same default breaks the</text><text x="352" y="432" font-size="11.5" fill="#6b7280">circle; so does a check for waiting circles.</text>
<rect x="644" y="266" width="296" height="196" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2"/>
<text x="660" y="290" font-size="13" fill="#111827" font-weight="600">Unseen decisions</text>
<rect x="668" y="310" width="64" height="30" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/><text x="700" y="330" font-size="11.5" fill="#111827" text-anchor="middle">lane A</text>
<line x1="736" y1="325" x2="794" y2="325" stroke="#eb6834" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#k-orange)"/>
<rect x="800" y="310" width="116" height="30" rx="6" fill="#fff" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="4 4"/>
<text x="858" y="330" font-size="11.5" fill="#6b7280" text-anchor="middle">B has gone home</text>
<text x="664" y="370" font-size="11.5" fill="#111827">One side decides for both, in a place</text><text x="664" y="386" font-size="11.5" fill="#111827">where only it looks.</text>
<text x="664" y="416" font-size="11.5" fill="#6b7280">What helps: a receipt, and a note on the</text><text x="664" y="432" font-size="11.5" fill="#6b7280">other side's ticket even after it closes.</text>
<text x="20" y="490" font-size="11" fill="#6b7280">A drawing, not data. Orange arrows are waits and notes.</text>
<text x="20" y="506" font-size="11" fill="#6b7280">The top-right picture is what happened on 13 November; the record does not show the notes were what made it possible.</text>
</svg>
