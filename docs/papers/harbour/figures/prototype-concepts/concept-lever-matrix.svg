<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 628" font-family="Inter, system-ui, sans-serif"><rect width="1080" height="628" fill="#fff"/><text x="20" y="26" font-size="13" fill="#1f2937" font-weight="600">Which prototype concepts serve which of Harbour's levers, and how strong the evidence for each is</text><text x="20" y="44" font-size="11" fill="#6b7280">Shade: the strongest evidence the prototype produced for that lever, on its own endpoint, not on Harbour's. Blank: the concept does not serve the lever.</text><text x="20" y="60" font-size="11" fill="#6b7280">0 idea only · 1 recorded observation, no control · 2 controlled comparison, single runs or an internal endpoint · 3 controlled, repeated, stated endpoint</text><text x="492" y="88" font-size="11" fill="#1f2937" text-anchor="middle">starting</text><text x="492" y="101" font-size="11" fill="#1f2937" text-anchor="middle">context</text><text x="616" y="88" font-size="11" fill="#1f2937" text-anchor="middle">handoffs</text><text x="616" y="101" font-size="11" fill="#1f2937" text-anchor="middle">in a relay</text><text x="740" y="88" font-size="11" fill="#1f2937" text-anchor="middle">research and</text><text x="740" y="101" font-size="11" fill="#1f2937" text-anchor="middle">planning cost</text><text x="864" y="88" font-size="11" fill="#1f2937" text-anchor="middle">deterministic</text><text x="864" y="101" font-size="11" fill="#1f2937" text-anchor="middle">conductor</text><text x="988" y="88" font-size="11" fill="#1f2937" text-anchor="middle">proportional</text><text x="988" y="101" font-size="11" fill="#1f2937" text-anchor="middle">process</text><text x="420" y="133" font-size="11.5" fill="#1f2937" text-anchor="end">Short pointer handed to the next session</text><text x="420" y="146" font-size="9.5" fill="#6b7280" text-anchor="end">Harbour itself, LIN-2115 (comparator)</text><rect x="432" y="120" width="120" height="30" fill="#93c5fd" stroke="#e5e7eb"/><text x="492" y="139" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="600">2 ●</text><rect x="556" y="120" width="120" height="30" fill="#dbeafe" stroke="#e5e7eb"/><text x="616" y="139" font-size="11" fill="#1f2937" text-anchor="middle">1</text><rect x="680" y="120" width="120" height="30" fill="#fff" stroke="#e5e7eb"/><rect x="804" y="120" width="120" height="30" fill="#fff" stroke="#e5e7eb"/><rect x="928" y="120" width="120" height="30" fill="#fff" stroke="#e5e7eb"/><text x="420" y="167" font-size="11.5" fill="#1f2937" text-anchor="end">Pre-built code map queried instead of exploring</text><text x="420" y="180" font-size="9.5" fill="#6b7280" text-anchor="end">pith</text><rect x="432" y="154" width="120" height="30" fill="#93c5fd" stroke="#e5e7eb"/><text x="492" y="173" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="600">2 ●</text><rect x="556" y="154" width="120" height="30" fill="#fff" stroke="#e5e7eb"/><rect x="680" y="154" width="120" height="30" fill="#fff" stroke="#e5e7eb"/><rect x="804" y="154" width="120" height="30" fill="#fff" stroke="#e5e7eb"/><rect x="928" y="154" width="120" height="30" fill="#fff" stroke="#e5e7eb"/><text x="420" y="201" font-size="11.5" fill="#1f2937" text-anchor="end">Model-maintained code wiki</text><text x="420" y="214" font-size="9.5" fill="#6b7280" text-anchor="end">CodeWiki</text><rect x="432" y="188" width="120" height="30" fill="#dbeafe" stroke="#e5e7eb"/><text x="492" y="207" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="600">1 ●</text><rect x="556" y="188" width="120" height="30" fill="#fff" stroke="#e5e7eb"/><rect x="680" y="188" width="120" height="30" fill="#fff" stroke="#e5e7eb"/><rect x="804" y="188" width="120" height="30" fill="#fff" stroke="#e5e7eb"/><rect x="928" y="188" width="120" height="30" fill="#fff" stroke="#e5e7eb"/><text x="420" y="235" font-size="11.5" fill="#1f2937" text-anchor="end">Wiki built from commit history, read by a context agent</text><text x="420" y="248" font-size="9.5" fill="#6b7280" text-anchor="end">CodeWiki-Generator</text><rect x="432" y="222" width="120" height="30" fill="#dbeafe" stroke="#e5e7eb"/><text x="492" y="241" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="600">1 ●</text><rect x="556" y="222" width="120" height="30" fill="#fff" stroke="#e5e7eb"/><rect x="680" y="222" width="120" height="30" fill="#fff" stroke="#e5e7eb"/><rect x="804" y="222" width="120" height="30" fill="#fff" stroke="#e5e7eb"/><rect x="928" y="222" width="120" height="30" fill="#fff" stroke="#e5e7eb"/><text x="420" y="269" font-size="11.5" fill="#1f2937" text-anchor="end">Durable task record lets stateless calls resume</text><text x="420" y="282" font-size="9.5" fill="#6b7280" text-anchor="end">tag-two</text><rect x="432" y="256" width="120" height="30" fill="#dbeafe" stroke="#e5e7eb"/><text x="492" y="275" font-size="11" fill="#1f2937" text-anchor="middle">1</text><rect x="556" y="256" width="120" height="30" fill="#dbeafe" stroke="#e5e7eb"/><text x="616" y="275" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="600">1 ●</text><rect x="680" y="256" width="120" height="30" fill="#fff" stroke="#e5e7eb"/><rect x="804" y="256" width="120" height="30" fill="#fff" stroke="#e5e7eb"/><rect x="928" y="256" width="120" height="30" fill="#fff" stroke="#e5e7eb"/><text x="420" y="303" font-size="11.5" fill="#1f2937" text-anchor="end">Graph state, a fresh worker per bounded step, code schedules</text><text x="420" y="316" font-size="9.5" fill="#6b7280" text-anchor="end">tag</text><rect x="432" y="290" width="120" height="30" fill="#fff" stroke="#e5e7eb"/><rect x="556" y="290" width="120" height="30" fill="#dbeafe" stroke="#e5e7eb"/><text x="616" y="309" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="600">1 ●</text><rect x="680" y="290" width="120" height="30" fill="#fff" stroke="#e5e7eb"/><rect x="804" y="290" width="120" height="30" fill="#dbeafe" stroke="#e5e7eb"/><text x="864" y="309" font-size="11" fill="#1f2937" text-anchor="middle">1</text><rect x="928" y="290" width="120" height="30" fill="#fff" stroke="#e5e7eb"/><text x="420" y="337" font-size="11.5" fill="#1f2937" text-anchor="end">Investigation structured as a graph, not one tool loop</text><text x="420" y="350" font-size="9.5" fill="#6b7280" text-anchor="end">tangle</text><rect x="432" y="324" width="120" height="30" fill="#dbeafe" stroke="#e5e7eb"/><text x="492" y="343" font-size="11" fill="#1f2937" text-anchor="middle">1</text><rect x="556" y="324" width="120" height="30" fill="#fff" stroke="#e5e7eb"/><rect x="680" y="324" width="120" height="30" fill="#93c5fd" stroke="#e5e7eb"/><text x="740" y="343" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="600">2 ●</text><rect x="804" y="324" width="120" height="30" fill="#fff" stroke="#e5e7eb"/><rect x="928" y="324" width="120" height="30" fill="#fff" stroke="#e5e7eb"/><text x="420" y="371" font-size="11.5" fill="#1f2937" text-anchor="end">Code holds the plan; the model makes one narrow call a step</text><text x="420" y="384" font-size="9.5" fill="#6b7280" text-anchor="end">Browser-agent</text><rect x="432" y="358" width="120" height="30" fill="#fff" stroke="#e5e7eb"/><rect x="556" y="358" width="120" height="30" fill="#fff" stroke="#e5e7eb"/><rect x="680" y="358" width="120" height="30" fill="#fff" stroke="#e5e7eb"/><rect x="804" y="358" width="120" height="30" fill="#93c5fd" stroke="#e5e7eb"/><text x="864" y="377" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="600">2 ●</text><rect x="928" y="358" width="120" height="30" fill="#fff" stroke="#e5e7eb"/><text x="420" y="405" font-size="11.5" fill="#1f2937" text-anchor="end">Lean budgeted research: research, review against sources, release</text><text x="420" y="418" font-size="9.5" fill="#6b7280" text-anchor="end">lighthouse</text><rect x="432" y="392" width="120" height="30" fill="#fff" stroke="#e5e7eb"/><rect x="556" y="392" width="120" height="30" fill="#dbeafe" stroke="#e5e7eb"/><text x="616" y="411" font-size="11" fill="#1f2937" text-anchor="middle">1</text><rect x="680" y="392" width="120" height="30" fill="#dbeafe" stroke="#e5e7eb"/><text x="740" y="411" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="600">1 ●</text><rect x="804" y="392" width="120" height="30" fill="#fff" stroke="#e5e7eb"/><rect x="928" y="392" width="120" height="30" fill="#dbeafe" stroke="#e5e7eb"/><text x="988" y="411" font-size="11" fill="#1f2937" text-anchor="middle">1</text><text x="420" y="439" font-size="11.5" fill="#1f2937" text-anchor="end">Staged review: evidence, then a reader's inference, then a recheck</text><text x="420" y="452" font-size="9.5" fill="#6b7280" text-anchor="end">lighthouse</text><rect x="432" y="426" width="120" height="30" fill="#fff" stroke="#e5e7eb"/><rect x="556" y="426" width="120" height="30" fill="#fff" stroke="#e5e7eb"/><rect x="680" y="426" width="120" height="30" fill="#dbeafe" stroke="#e5e7eb"/><text x="740" y="445" font-size="11" fill="#1f2937" text-anchor="middle">1</text><rect x="804" y="426" width="120" height="30" fill="#fff" stroke="#e5e7eb"/><rect x="928" y="426" width="120" height="30" fill="#93c5fd" stroke="#e5e7eb"/><text x="988" y="445" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="600">2 ●</text><text x="420" y="473" font-size="11.5" fill="#1f2937" text-anchor="end">Fixture eval per workflow step, to pick the cheapest adequate tier</text><text x="420" y="486" font-size="9.5" fill="#6b7280" text-anchor="end">harbour-evals</text><rect x="432" y="460" width="120" height="30" fill="#dbeafe" stroke="#e5e7eb"/><text x="492" y="479" font-size="11" fill="#1f2937" text-anchor="middle">1</text><rect x="556" y="460" width="120" height="30" fill="#fff" stroke="#e5e7eb"/><rect x="680" y="460" width="120" height="30" fill="#93c5fd" stroke="#e5e7eb"/><text x="740" y="479" font-size="11" fill="#1f2937" text-anchor="middle">2</text><rect x="804" y="460" width="120" height="30" fill="#fff" stroke="#e5e7eb"/><rect x="928" y="460" width="120" height="30" fill="#93c5fd" stroke="#e5e7eb"/><text x="988" y="479" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="600">2 ●</text><text x="420" y="507" font-size="11.5" fill="#1f2937" text-anchor="end">User interventions as labels for where steering is needed</text><text x="420" y="520" font-size="9.5" fill="#6b7280" text-anchor="end">session-viewer</text><rect x="432" y="494" width="120" height="30" fill="#fff" stroke="#e5e7eb"/><rect x="556" y="494" width="120" height="30" fill="#fff" stroke="#e5e7eb"/><rect x="680" y="494" width="120" height="30" fill="#fff" stroke="#e5e7eb"/><rect x="804" y="494" width="120" height="30" fill="#dbeafe" stroke="#e5e7eb"/><text x="864" y="513" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="600">1 ●</text><rect x="928" y="494" width="120" height="30" fill="#f3f4f6" stroke="#e5e7eb"/><text x="988" y="513" font-size="11" fill="#1f2937" text-anchor="middle">0</text><text x="420" y="541" font-size="11.5" fill="#1f2937" text-anchor="end">Rule detectors for reading spirals and loops in session logs</text><text x="420" y="554" font-size="9.5" fill="#6b7280" text-anchor="end">dash-analysis</text><rect x="432" y="528" width="120" height="30" fill="#f3f4f6" stroke="#e5e7eb"/><text x="492" y="547" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="600">0 ●</text><rect x="556" y="528" width="120" height="30" fill="#fff" stroke="#e5e7eb"/><rect x="680" y="528" width="120" height="30" fill="#fff" stroke="#e5e7eb"/><rect x="804" y="528" width="120" height="30" fill="#f3f4f6" stroke="#e5e7eb"/><text x="864" y="547" font-size="11" fill="#1f2937" text-anchor="middle">0</text><rect x="928" y="528" width="120" height="30" fill="#fff" stroke="#e5e7eb"/><text x="420" y="575" font-size="11.5" fill="#1f2937" text-anchor="end">Fixed phase pipeline and a code-built repo scan</text><text x="420" y="588" font-size="9.5" fill="#6b7280" text-anchor="end">dash</text><rect x="432" y="562" width="120" height="30" fill="#f3f4f6" stroke="#e5e7eb"/><text x="492" y="581" font-size="11" fill="#1f2937" text-anchor="middle">0</text><rect x="556" y="562" width="120" height="30" fill="#f3f4f6" stroke="#e5e7eb"/><text x="616" y="581" font-size="11" fill="#1f2937" text-anchor="middle">0</text><rect x="680" y="562" width="120" height="30" fill="#fff" stroke="#e5e7eb"/><rect x="804" y="562" width="120" height="30" fill="#f3f4f6" stroke="#e5e7eb"/><text x="864" y="581" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="600">0 ●</text><rect x="928" y="562" width="120" height="30" fill="#f3f4f6" stroke="#e5e7eb"/><text x="988" y="581" font-size="11" fill="#1f2937" text-anchor="middle">0</text><text x="20" y="614" font-size="10" fill="#6b7280">● the lever the concept chiefly serves. Strength is of the prototype's own evidence; none of it was measured inside Harbour except the pointer probe (LIN-2115).</text></svg>
