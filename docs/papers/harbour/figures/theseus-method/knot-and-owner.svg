<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" font-family="Inter, system-ui, sans-serif" font-size="12" role="img" aria-label="A knot between the agent API and the pages area. The pages area imports one thing from the API, the runner lifetimes, which the API owns. The API imports an issue-state rule, isBlocked, from a page module. Cutting by ownership moves isBlocked to providers, its owner, and keeps the thin edge. Cutting the thin edge instead would copy the API's lifetimes into the page, a second copy of a decision."><style data-figure-theme="1">@media (prefers-color-scheme: dark){rect[fill="#fff"]:not([fill-opacity]),rect[fill="#ffffff"]:not([fill-opacity]),rect[fill="white"]:not([fill-opacity]){fill:#16181d}[stroke="#fff"],[stroke="#ffffff"],[stroke="white"]{stroke:#16181d}circle[fill="#fff"]:not([fill-opacity]),circle[fill="#ffffff"]:not([fill-opacity]),circle[fill="white"]:not([fill-opacity]){fill:#16181d}path[fill="#fff"]:not([fill-opacity]),path[fill="#ffffff"]:not([fill-opacity]),path[fill="white"]:not([fill-opacity]){fill:#16181d}polygon[fill="#fff"]:not([fill-opacity]),polygon[fill="#ffffff"]:not([fill-opacity]),polygon[fill="white"]:not([fill-opacity]){fill:#16181d}ellipse[fill="#fff"]:not([fill-opacity]),ellipse[fill="#ffffff"]:not([fill-opacity]),ellipse[fill="white"]:not([fill-opacity]){fill:#16181d}text[fill="#111827"]:not([data-on-fill]),text[fill="#1f2937"]:not([data-on-fill]),text[fill="#333"]:not([data-on-fill]),text[fill="#1f2328"]:not([data-on-fill]),text[fill="#555"]:not([data-on-fill]),text[fill="#475569"]:not([data-on-fill]){fill:#e6e6e6}[stroke="#111827"],[stroke="#1f2937"],[stroke="#333"],[stroke="#1f2328"],[stroke="#555"],[stroke="#475569"]{stroke:#e6e6e6}text[fill="#6b7280"]:not([data-on-fill]),text[fill="#666"]:not([data-on-fill]),text[fill="#667085"]:not([data-on-fill]),text[fill="#888"]:not([data-on-fill]),text[fill="#6e7781"]:not([data-on-fill]),text[fill="#999"]:not([data-on-fill]),text[fill="#aaa"]:not([data-on-fill]),text[fill="#bbb"]:not([data-on-fill]),text[fill="#9ca3af"]:not([data-on-fill]),text[fill="#94a3b8"]:not([data-on-fill]){fill:#9aa0a6}[stroke="#6b7280"],[stroke="#666"],[stroke="#667085"],[stroke="#888"],[stroke="#6e7781"],[stroke="#999"],[stroke="#aaa"],[stroke="#bbb"],[stroke="#9ca3af"],[stroke="#94a3b8"]{stroke:#9aa0a6}[stroke="#e5e7eb"],[stroke="#eee"],[stroke="#d1d5db"],[stroke="#f0f0f0"],[stroke="#cbd5e1"],[stroke="#d9d9d9"]{stroke:#2c313a}[fill="#f3f4f6"],[fill="#f9fafb"]{fill:#1f222a}rect[fill="#f0f0f0"],rect[fill="#d1d5db"],rect[fill="#e5e7eb"],rect[fill="#eee"]{fill:#2c313a}text:not([fill]):not([class]):not([data-on-fill]){fill:#e6e6e6}rect[fill="#1f2937"],circle[fill="#1f2937"],path[fill="#1f2937"]{fill:#4b5563}rect[fill="#3b1f5e"],circle[fill="#3b1f5e"],path[fill="#3b1f5e"]{fill:#553185}svg .t,svg .h{fill:#e6e6e6}svg .a,svg .s{fill:#9aa0a6}svg .f{fill:#1f222a;stroke:#2c313a}svg .g{stroke:#2c313a}rect[fill="#dbeafe"]{fill:#1d2d44}rect[fill="#93c5fd"]{fill:#2a5a9a}rect[fill="#fff7ed"]{fill:#2a2118}}</style>
<defs>
<marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6b7280"/></marker>
<marker id="ao" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#eb6834"/></marker>
</defs>
<rect x="0" y="0" width="960" height="320" fill="#fff"/>

<!-- ===== left: the knot ===== -->
<text x="20" y="30" font-size="15" font-weight="600" fill="#111827">A knot</text>
<text x="20" y="49" font-size="11.5" fill="#6b7280">two areas that import each other</text>
<rect x="20" y="68" width="138" height="164" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
<rect x="222" y="68" width="138" height="96" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
<rect x="222" y="184" width="138" height="48" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
<text x="31" y="86" font-size="11" fill="#6b7280">pages</text>
<text x="233" y="86" font-size="11" fill="#6b7280">agent API</text>
<text x="233" y="202" font-size="11" fill="#6b7280">providers</text>
<rect x="34" y="104" width="110" height="24" rx="5" fill="#fff" stroke="#d1d5db"/>
<text x="89" y="120" font-size="10.5" fill="#6b7280" text-anchor="middle">runner page</text>
<rect x="34" y="186" width="110" height="26" rx="5" fill="#fff7ed" stroke="#eb6834" stroke-width="1.3"/>
<text x="89" y="203" font-size="11" fill="#111827" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace">isBlocked()</text>
<line x1="144" y1="112" x2="220" y2="112" stroke="#6b7280" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="182" y="104" font-size="10.5" fill="#6b7280" text-anchor="middle">lifetimes</text>
<path d="M222 146 C 190 150, 176 186, 147 194" fill="none" stroke="#eb6834" stroke-width="1.6" marker-end="url(#ao)"/>
<text x="168" y="214" font-size="10.5" fill="#6b7280">2 rules</text>
<line x1="291" y1="164" x2="291" y2="182" stroke="#6b7280" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="300" y="177" font-size="10" fill="#6b7280">already used</text>
<text x="20" y="258" font-size="11.5" fill="#111827">Which edge is wrong? Not "the thinner one".</text>
<text x="20" y="275" font-size="11.5" fill="#111827">Ask of each: which area would have to</text>
<text x="20" y="292" font-size="11.5" fill="#111827">change if this rule changed?</text>

<line x1="374" y1="150" x2="398" y2="150" stroke="#6b7280" stroke-width="1.2" marker-end="url(#ah)"/>

<!-- ===== option 1: by ownership ===== -->
<g transform="translate(404,0)">
<rect x="0" y="16" width="536" height="138" rx="8" fill="#fff" stroke="#e5e7eb"/>
<rect x="14" y="34" width="86" height="104" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
<rect x="146" y="34" width="104" height="48" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
<rect x="146" y="92" width="104" height="46" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
<text x="23" y="50" font-size="10" fill="#6b7280">pages</text>
<text x="155" y="50" font-size="10" fill="#6b7280">agent API</text>
<text x="155" y="107" font-size="10" fill="#6b7280">providers</text>
<line x1="100" y1="62" x2="144" y2="62" stroke="#6b7280" stroke-width="1.2" marker-end="url(#ah)"/>
<line x1="198" y1="82" x2="198" y2="90" stroke="#6b7280" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="156" y="113" width="84" height="19" rx="4" fill="#dbeafe" stroke="#2a78d6" stroke-width="1.3"/>
<text x="198" y="126" font-size="10" fill="#111827" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace">isBlocked()</text>
<text x="272" y="40" font-size="13" font-weight="600" fill="#111827">✓ Cut by ownership (what was done)</text>
<text x="272" y="62" font-size="11" fill="#111827">The lifetimes are the API's rule, so the page</text>
<text x="272" y="77" font-size="11" fill="#111827">reading them is right: that edge stays.</text>
<text x="272" y="92" font-size="11" fill="#111827">isBlocked is an issue-state rule, so it moves</text>
<text x="272" y="107" font-size="11" fill="#111827">to providers. No edge added; the knot is gone.</text>
<text x="272" y="136" font-size="10.5" fill="#6b7280">moved code byte-identical; behaviour replayed</text>
</g>

<!-- ===== option 2: by thinness ===== -->
<g transform="translate(404,0)">
<rect x="0" y="166" width="536" height="138" rx="8" fill="#fff" stroke="#e5e7eb"/>
<rect x="14" y="184" width="86" height="104" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
<rect x="146" y="184" width="104" height="48" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
<rect x="146" y="242" width="104" height="46" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
<text x="23" y="200" font-size="10" fill="#6b7280">pages</text>
<text x="155" y="200" font-size="10" fill="#6b7280">agent API</text>
<text x="155" y="257" font-size="10" fill="#6b7280">providers</text>
<rect x="18" y="209" width="80" height="19" rx="4" fill="#fff7ed" stroke="#eb6834" stroke-width="1.2" stroke-dasharray="3 2"/>
<text x="58" y="222" font-size="9.5" fill="#111827" text-anchor="middle">lifetimes (copy)</text>
<rect x="21" y="258" width="72" height="19" rx="4" fill="#fff7ed" stroke="#eb6834" stroke-width="1.2"/>
<text x="57" y="271" font-size="9.5" fill="#111827" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace">isBlocked()</text>
<path d="M146 222 C 124 228, 116 258, 96 264" fill="none" stroke="#eb6834" stroke-width="1.5" marker-end="url(#ao)"/>
<line x1="198" y1="232" x2="198" y2="240" stroke="#6b7280" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="272" y="190" font-size="13" font-weight="600" fill="#111827">✗ Cut the thin edge</text>
<text x="272" y="212" font-size="11" fill="#111827">Copy the lifetimes into the page. The pair is</text>
<text x="272" y="227" font-size="11" fill="#111827">untied by making a second copy of the API's</text>
<text x="272" y="242" font-size="11" fill="#111827">rule, and the API still reaches into a page</text>
<text x="272" y="257" font-size="11" fill="#111827">for an issue rule it doesn't own either.</text>
<text x="272" y="286" font-size="10.5" fill="#6b7280">a knot traded for a scattered decision</text>
</g>
</svg>
