<svg xmlns="http://www.w3.org/2000/svg" width="960" height="356" viewBox="0 0 960 356" font-family="Inter, system-ui, sans-serif" font-size="12" role="img" aria-label="Two tests guarding the same property, that a request without the dispatch grant is refused. A location pin reads the source text: it fails when the code moves with behaviour unchanged, and passes when a new route skips the check. A behaviour test sends requests to every route: it passes when code moves and fails when the guard is removed or skipped. Below, the order of work: write the behaviour test, land it beside the old pin, prove in a scratch copy that it fails with the check deleted, then loosen the old pin, and only then move the code."><style data-figure-theme="1">@media (prefers-color-scheme: dark){rect[fill="#fff"]:not([fill-opacity]),rect[fill="#ffffff"]:not([fill-opacity]),rect[fill="white"]:not([fill-opacity]){fill:#16181d}[stroke="#fff"],[stroke="#ffffff"],[stroke="white"]{stroke:#16181d}circle[fill="#fff"]:not([fill-opacity]),circle[fill="#ffffff"]:not([fill-opacity]),circle[fill="white"]:not([fill-opacity]){fill:#16181d}path[fill="#fff"]:not([fill-opacity]),path[fill="#ffffff"]:not([fill-opacity]),path[fill="white"]:not([fill-opacity]){fill:#16181d}polygon[fill="#fff"]:not([fill-opacity]),polygon[fill="#ffffff"]:not([fill-opacity]),polygon[fill="white"]:not([fill-opacity]){fill:#16181d}ellipse[fill="#fff"]:not([fill-opacity]),ellipse[fill="#ffffff"]:not([fill-opacity]),ellipse[fill="white"]:not([fill-opacity]){fill:#16181d}text[fill="#111827"]:not([data-on-fill]),text[fill="#1f2937"]:not([data-on-fill]),text[fill="#333"]:not([data-on-fill]),text[fill="#1f2328"]:not([data-on-fill]),text[fill="#555"]:not([data-on-fill]),text[fill="#475569"]:not([data-on-fill]){fill:#e6e6e6}[stroke="#111827"],[stroke="#1f2937"],[stroke="#333"],[stroke="#1f2328"],[stroke="#555"],[stroke="#475569"]{stroke:#e6e6e6}text[fill="#6b7280"]:not([data-on-fill]),text[fill="#666"]:not([data-on-fill]),text[fill="#667085"]:not([data-on-fill]),text[fill="#888"]:not([data-on-fill]),text[fill="#6e7781"]:not([data-on-fill]),text[fill="#999"]:not([data-on-fill]),text[fill="#aaa"]:not([data-on-fill]),text[fill="#bbb"]:not([data-on-fill]),text[fill="#9ca3af"]:not([data-on-fill]),text[fill="#94a3b8"]:not([data-on-fill]){fill:#9aa0a6}[stroke="#6b7280"],[stroke="#666"],[stroke="#667085"],[stroke="#888"],[stroke="#6e7781"],[stroke="#999"],[stroke="#aaa"],[stroke="#bbb"],[stroke="#9ca3af"],[stroke="#94a3b8"]{stroke:#9aa0a6}[stroke="#e5e7eb"],[stroke="#eee"],[stroke="#d1d5db"],[stroke="#f0f0f0"],[stroke="#cbd5e1"],[stroke="#d9d9d9"]{stroke:#2c313a}[fill="#f3f4f6"],[fill="#f9fafb"]{fill:#1f222a}rect[fill="#f0f0f0"],rect[fill="#d1d5db"],rect[fill="#e5e7eb"],rect[fill="#eee"]{fill:#2c313a}text:not([fill]):not([class]):not([data-on-fill]){fill:#e6e6e6}rect[fill="#1f2937"],circle[fill="#1f2937"],path[fill="#1f2937"]{fill:#4b5563}rect[fill="#3b1f5e"],circle[fill="#3b1f5e"],path[fill="#3b1f5e"]{fill:#553185}svg .t,svg .h{fill:#e6e6e6}svg .a,svg .s{fill:#9aa0a6}svg .f{fill:#1f222a;stroke:#2c313a}svg .g{stroke:#2c313a}rect[fill="#dbeafe"]{fill:#1d2d44}rect[fill="#93c5fd"]{fill:#2a5a9a}rect[fill="#fff7ed"]{fill:#2a2118}}</style>
<defs>
<marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6b7280"/></marker>
</defs>
<rect x="0" y="0" width="960" height="356" fill="#fff"/>

<text x="20" y="28" font-size="13" font-weight="600" fill="#111827">Two tests of one property: "no grant, no dispatch"</text>

<!-- column heads -->
<g font-size="11" fill="#111827" text-anchor="middle">
<text x="351" y="58">the check moves,</text><text x="351" y="72">behaviour the same</text>
<text x="529" y="58">the check is</text><text x="529" y="72">deleted</text>
<text x="707" y="58">a new route</text><text x="707" y="72">skips the check</text>
</g>
<line x1="20" y1="82" x2="790" y2="82" stroke="#e5e7eb"/>

<!-- row 1: location pin -->
<text x="20" y="104" font-size="12.5" font-weight="600" fill="#111827">location pin</text>
<text x="20" y="121" font-size="10" fill="#6b7280" font-family="JetBrains Mono, ui-monospace, monospace">src(routes/x.js)</text>
<text x="20" y="134" font-size="10" fill="#6b7280" font-family="JetBrains Mono, ui-monospace, monospace">.includes("requireGrant")</text>
<rect x="276" y="92" width="150" height="40" rx="6" fill="#fff7ed" stroke="#eb6834" stroke-width="1.3"/>
<text x="351" y="109" font-size="11.5" font-weight="600" fill="#111827" text-anchor="middle">fails</text>
<text x="351" y="124" font-size="10.5" fill="#111827" text-anchor="middle">false alarm, blocks the move</text>
<rect x="454" y="92" width="150" height="40" rx="6" fill="#dbeafe" stroke="#2a78d6" stroke-width="1.3"/>
<text x="529" y="109" font-size="11.5" font-weight="600" fill="#111827" text-anchor="middle">fails</text>
<text x="529" y="124" font-size="10.5" fill="#111827" text-anchor="middle">caught it</text>
<rect x="632" y="92" width="150" height="40" rx="6" fill="#fff7ed" stroke="#eb6834" stroke-width="1.3"/>
<text x="707" y="109" font-size="11.5" font-weight="600" fill="#111827" text-anchor="middle">passes</text>
<text x="707" y="124" font-size="10.5" fill="#111827" text-anchor="middle">missed it</text>
<line x1="20" y1="146" x2="790" y2="146" stroke="#e5e7eb"/>

<!-- row 2: behaviour test -->
<text x="20" y="168" font-size="12.5" font-weight="600" fill="#111827">behaviour test</text>
<text x="20" y="185" font-size="10" fill="#6b7280" font-family="JetBrains Mono, ui-monospace, monospace">for each dispatch route:</text>
<text x="20" y="198" font-size="10" fill="#6b7280" font-family="JetBrains Mono, ui-monospace, monospace">  no grant → expect 403</text>
<rect x="276" y="156" width="150" height="40" rx="6" fill="#dbeafe" stroke="#2a78d6" stroke-width="1.3"/>
<text x="351" y="173" font-size="11.5" font-weight="600" fill="#111827" text-anchor="middle">passes</text>
<text x="351" y="188" font-size="10.5" fill="#111827" text-anchor="middle">the move is free</text>
<rect x="454" y="156" width="150" height="40" rx="6" fill="#dbeafe" stroke="#2a78d6" stroke-width="1.3"/>
<text x="529" y="173" font-size="11.5" font-weight="600" fill="#111827" text-anchor="middle">fails</text>
<text x="529" y="188" font-size="10.5" fill="#111827" text-anchor="middle">caught it</text>
<rect x="632" y="156" width="150" height="40" rx="6" fill="#dbeafe" stroke="#2a78d6" stroke-width="1.3"/>
<text x="707" y="173" font-size="11.5" font-weight="600" fill="#111827" text-anchor="middle">fails</text>
<text x="707" y="188" font-size="10.5" fill="#111827" text-anchor="middle">caught it</text>

<!-- legend for cells -->
<rect x="812" y="98" width="14" height="14" rx="3" fill="#dbeafe" stroke="#2a78d6" stroke-width="1.3"/>
<text x="834" y="110" font-size="11" fill="#111827">the test told</text>
<text x="834" y="124" font-size="11" fill="#111827">the truth</text>
<rect x="812" y="160" width="14" height="14" rx="3" fill="#fff7ed" stroke="#eb6834" stroke-width="1.3"/>
<text x="834" y="172" font-size="11" fill="#111827">the test</text>
<text x="834" y="186" font-size="11" fill="#111827">misled</text>

<!-- order of work -->
<text x="20" y="240" font-size="13" font-weight="600" fill="#111827">The order of work: no pin is loosened before its replacement has caught something</text>
<g stroke="#2a78d6" stroke-width="1.3">
<path d="M20 254 H186 L200 284 L186 314 H20 Z" fill="#fff"/>
<path d="M206 254 H372 L386 284 L372 314 H206 L220 284 Z" fill="#fff"/>
<path d="M392 254 H558 L572 284 L558 314 H392 L406 284 Z" fill="#fff"/>
<path d="M578 254 H744 L758 284 L744 314 H578 L592 284 Z" fill="#fff"/>
<path d="M764 254 H940 V314 H764 L778 284 Z" fill="#fff"/>
</g>
<g font-size="11" fill="#111827">
<text x="32" y="279" font-weight="600">1 Write</text><text x="32" y="295">the behaviour test</text>
<text x="226" y="279" font-weight="600">2 Land it</text><text x="226" y="295">beside the old pin, green</text>
<text x="412" y="279" font-weight="600">3 Prove it</text><text x="412" y="295">check deleted: it fails</text>
<text x="598" y="279" font-weight="600">4 Loosen the pin</text><text x="598" y="295">or delete it</text>
<text x="784" y="279" font-weight="600">5 Now move the code</text><text x="784" y="295">the next move is free</text>
</g>
<text x="20" y="342" font-size="10.5" fill="#6b7280">Step 3 runs in a scratch copy outside the repository, and both runs are recorded.</text>
</svg>
