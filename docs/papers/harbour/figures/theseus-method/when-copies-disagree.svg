<svg xmlns="http://www.w3.org/2000/svg" width="960" height="356" viewBox="0 0 960 356" font-family="Inter, system-ui, sans-serif" font-size="12" role="img" aria-label="When two copies of a decision answer differently, three questions in order sort the difference. Is one copy plainly wrong? Fix it and name the fix. Is the difference deliberate? Keep it as a named parameter of the one authority. Is it unreachable or harmless? Allow it, listed, never in security, money or stored data. Otherwise keep today's behaviour for each caller and write the question up for a later ruling."><style data-figure-theme="1">@media (prefers-color-scheme: dark){rect[fill="#fff"]:not([fill-opacity]),rect[fill="#ffffff"]:not([fill-opacity]),rect[fill="white"]:not([fill-opacity]){fill:#16181d}[stroke="#fff"],[stroke="#ffffff"],[stroke="white"]{stroke:#16181d}circle[fill="#fff"]:not([fill-opacity]),circle[fill="#ffffff"]:not([fill-opacity]),circle[fill="white"]:not([fill-opacity]){fill:#16181d}path[fill="#fff"]:not([fill-opacity]),path[fill="#ffffff"]:not([fill-opacity]),path[fill="white"]:not([fill-opacity]){fill:#16181d}polygon[fill="#fff"]:not([fill-opacity]),polygon[fill="#ffffff"]:not([fill-opacity]),polygon[fill="white"]:not([fill-opacity]){fill:#16181d}ellipse[fill="#fff"]:not([fill-opacity]),ellipse[fill="#ffffff"]:not([fill-opacity]),ellipse[fill="white"]:not([fill-opacity]){fill:#16181d}text[fill="#111827"]:not([data-on-fill]),text[fill="#1f2937"]:not([data-on-fill]),text[fill="#333"]:not([data-on-fill]),text[fill="#1f2328"]:not([data-on-fill]),text[fill="#555"]:not([data-on-fill]),text[fill="#475569"]:not([data-on-fill]){fill:#e6e6e6}[stroke="#111827"],[stroke="#1f2937"],[stroke="#333"],[stroke="#1f2328"],[stroke="#555"],[stroke="#475569"]{stroke:#e6e6e6}text[fill="#6b7280"]:not([data-on-fill]),text[fill="#666"]:not([data-on-fill]),text[fill="#667085"]:not([data-on-fill]),text[fill="#888"]:not([data-on-fill]),text[fill="#6e7781"]:not([data-on-fill]),text[fill="#999"]:not([data-on-fill]),text[fill="#aaa"]:not([data-on-fill]),text[fill="#bbb"]:not([data-on-fill]),text[fill="#9ca3af"]:not([data-on-fill]),text[fill="#94a3b8"]:not([data-on-fill]){fill:#9aa0a6}[stroke="#6b7280"],[stroke="#666"],[stroke="#667085"],[stroke="#888"],[stroke="#6e7781"],[stroke="#999"],[stroke="#aaa"],[stroke="#bbb"],[stroke="#9ca3af"],[stroke="#94a3b8"]{stroke:#9aa0a6}[stroke="#e5e7eb"],[stroke="#eee"],[stroke="#d1d5db"],[stroke="#f0f0f0"],[stroke="#cbd5e1"],[stroke="#d9d9d9"]{stroke:#2c313a}[fill="#f3f4f6"],[fill="#f9fafb"]{fill:#1f222a}rect[fill="#f0f0f0"],rect[fill="#d1d5db"],rect[fill="#e5e7eb"],rect[fill="#eee"]{fill:#2c313a}text:not([fill]):not([class]):not([data-on-fill]){fill:#e6e6e6}rect[fill="#1f2937"],circle[fill="#1f2937"],path[fill="#1f2937"]{fill:#4b5563}rect[fill="#3b1f5e"],circle[fill="#3b1f5e"],path[fill="#3b1f5e"]{fill:#553185}svg .t,svg .h{fill:#e6e6e6}svg .a,svg .s{fill:#9aa0a6}svg .f{fill:#1f222a;stroke:#2c313a}svg .g{stroke:#2c313a}rect[fill="#dbeafe"]{fill:#1d2d44}rect[fill="#93c5fd"]{fill:#2a5a9a}rect[fill="#fff7ed"]{fill:#2a2118}}</style>
<defs>
<marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6b7280"/></marker>
</defs>
<rect x="0" y="0" width="960" height="356" fill="#fff"/>

<!-- start -->
<rect x="20" y="36" width="160" height="48" rx="8" fill="#fff7ed" stroke="#eb6834" stroke-width="1.3"/>
<text x="100" y="56" font-size="11.5" font-weight="600" fill="#111827" text-anchor="middle">Two copies answer</text>
<text x="100" y="72" font-size="11.5" font-weight="600" fill="#111827" text-anchor="middle">differently</text>
<line x1="180" y1="60" x2="214" y2="60" stroke="#6b7280" stroke-width="1.2" marker-end="url(#ah)"/>

<!-- questions -->
<g stroke="#6b7280" stroke-width="1.2">
<rect x="218" y="36" width="236" height="48" rx="24" fill="#fff"/>
<rect x="218" y="116" width="236" height="48" rx="24" fill="#fff"/>
<rect x="218" y="196" width="236" height="48" rx="24" fill="#fff"/>
</g>
<g font-size="11.5" fill="#111827" text-anchor="middle">
<text x="336" y="56">Is one copy plainly wrong?</text>
<text x="336" y="72" font-size="10.5" fill="#6b7280">wrong by its own comment, docs or test</text>
<text x="336" y="136">Is the difference deliberate?</text>
<text x="336" y="152" font-size="10.5" fill="#6b7280">a caller needs it, for a stated reason</text>
<text x="336" y="216">Unreachable, or harmless?</text>
<text x="336" y="232" font-size="10.5" fill="#6b7280">no real input reaches it; log wording</text>
</g>

<!-- yes arrows -->
<g stroke="#6b7280" stroke-width="1.2" marker-end="url(#ah)">
<line x1="454" y1="60" x2="526" y2="60"/><line x1="454" y1="140" x2="526" y2="140"/><line x1="454" y1="220" x2="526" y2="220"/>
</g>
<g font-size="10.5" fill="#6b7280">
<text x="470" y="54">yes</text><text x="470" y="134">yes</text><text x="470" y="214">yes</text>
</g>
<!-- no arrows -->
<g stroke="#6b7280" stroke-width="1.2" marker-end="url(#ah)">
<line x1="336" y1="84" x2="336" y2="112"/><line x1="336" y1="164" x2="336" y2="192"/>
<path d="M336 244 V300 H526" fill="none"/>
</g>
<g font-size="10.5" fill="#6b7280">
<text x="344" y="102">no</text><text x="344" y="182">no</text><text x="344" y="270">no</text>
</g>

<!-- leaves -->
<g stroke-width="1.3">
<rect x="530" y="30" width="410" height="60" rx="8" fill="#dbeafe" stroke="#2a78d6"/>
<rect x="530" y="110" width="410" height="60" rx="8" fill="#dbeafe" stroke="#2a78d6"/>
<rect x="530" y="190" width="410" height="60" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
<rect x="530" y="270" width="410" height="60" rx="8" fill="#fff7ed" stroke="#eb6834"/>
</g>
<g font-size="12" font-weight="600" fill="#111827">
<text x="544" y="51">(a) Fix it</text>
<text x="544" y="131">(b) Keep it, as a named parameter</text>
<text x="544" y="211">(c) Allow it, bounded</text>
<text x="544" y="291">(d) Keep today's answer, write it up</text>
</g>
<g font-size="10.5" fill="#111827">
<text x="544" y="68">Name it and list it. Inside a consolidation only comments are fixed;</text>
<text x="544" y="82">a wrong behaviour becomes (d), so the replay stays at zero.</text>
<text x="544" y="148">One authority, one visible knob per variation (a lane, a mode);</text>
<text x="544" y="162">never a silent branch keyed on who is calling.</text>
<text x="544" y="228">Listed, with the reason. Never a success reply, a write and its</text>
<text x="544" y="242">arguments, stored data, or a security check: those go to (d).</text>
<text x="544" y="308">Each caller keeps exactly what it does today. The question goes</text>
<text x="544" y="322">on a standing ticket for a later ruling; the run never waits on it.</text>
</g>
<g font-size="10.5" fill="#6b7280" text-anchor="end" font-family="JetBrains Mono, ui-monospace, monospace">
<text x="930" y="51">7</text><text x="930" y="131">~20</text><text x="930" y="211">9</text><text x="930" y="291">7</text>
</g>
<text x="20" y="130" font-size="10.5" fill="#6b7280">Ask in this order.</text>
<text x="20" y="146" font-size="10.5" fill="#6b7280">Numbers at right: the 43</text>
<text x="20" y="160" font-size="10.5" fill="#6b7280">differences found when</text>
<text x="20" y="174" font-size="10.5" fill="#6b7280">one entrance's copies</text>
<text x="20" y="188" font-size="10.5" fill="#6b7280">were gathered.</text>
</svg>
