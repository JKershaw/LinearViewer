<svg xmlns="http://www.w3.org/2000/svg" width="960" height="356" viewBox="0 0 960 356" font-family="Inter, system-ui, sans-serif" font-size="12" role="img" aria-label="Every move runs as one ticket wrapped in checks. Before launch: the ticket, a committed prediction, a fresh reader, and the replay built and self-checked. Then the codebase's own pipeline plans, reviews, builds and merges. After merge: the replay runs on two seeds, the result is scored against the prediction, and the standing measures are re-read to pick the next target. People are touched at two points only: a ruling when a review loop runs out, and open questions answered later without blocking a run."><style data-figure-theme="1">@media (prefers-color-scheme: dark){rect[fill="#fff"]:not([fill-opacity]),rect[fill="#ffffff"]:not([fill-opacity]),rect[fill="white"]:not([fill-opacity]){fill:#16181d}[stroke="#fff"],[stroke="#ffffff"],[stroke="white"]{stroke:#16181d}circle[fill="#fff"]:not([fill-opacity]),circle[fill="#ffffff"]:not([fill-opacity]),circle[fill="white"]:not([fill-opacity]){fill:#16181d}path[fill="#fff"]:not([fill-opacity]),path[fill="#ffffff"]:not([fill-opacity]),path[fill="white"]:not([fill-opacity]){fill:#16181d}polygon[fill="#fff"]:not([fill-opacity]),polygon[fill="#ffffff"]:not([fill-opacity]),polygon[fill="white"]:not([fill-opacity]){fill:#16181d}ellipse[fill="#fff"]:not([fill-opacity]),ellipse[fill="#ffffff"]:not([fill-opacity]),ellipse[fill="white"]:not([fill-opacity]){fill:#16181d}text[fill="#111827"]:not([data-on-fill]),text[fill="#1f2937"]:not([data-on-fill]),text[fill="#333"]:not([data-on-fill]),text[fill="#1f2328"]:not([data-on-fill]),text[fill="#555"]:not([data-on-fill]),text[fill="#475569"]:not([data-on-fill]){fill:#e6e6e6}[stroke="#111827"],[stroke="#1f2937"],[stroke="#333"],[stroke="#1f2328"],[stroke="#555"],[stroke="#475569"]{stroke:#e6e6e6}text[fill="#6b7280"]:not([data-on-fill]),text[fill="#666"]:not([data-on-fill]),text[fill="#667085"]:not([data-on-fill]),text[fill="#888"]:not([data-on-fill]),text[fill="#6e7781"]:not([data-on-fill]),text[fill="#999"]:not([data-on-fill]),text[fill="#aaa"]:not([data-on-fill]),text[fill="#bbb"]:not([data-on-fill]),text[fill="#9ca3af"]:not([data-on-fill]),text[fill="#94a3b8"]:not([data-on-fill]){fill:#9aa0a6}[stroke="#6b7280"],[stroke="#666"],[stroke="#667085"],[stroke="#888"],[stroke="#6e7781"],[stroke="#999"],[stroke="#aaa"],[stroke="#bbb"],[stroke="#9ca3af"],[stroke="#94a3b8"]{stroke:#9aa0a6}[stroke="#e5e7eb"],[stroke="#eee"],[stroke="#d1d5db"],[stroke="#f0f0f0"],[stroke="#cbd5e1"],[stroke="#d9d9d9"]{stroke:#2c313a}[fill="#f3f4f6"],[fill="#f9fafb"]{fill:#1f222a}rect[fill="#f0f0f0"],rect[fill="#d1d5db"],rect[fill="#e5e7eb"],rect[fill="#eee"]{fill:#2c313a}text:not([fill]):not([class]):not([data-on-fill]){fill:#e6e6e6}rect[fill="#1f2937"],circle[fill="#1f2937"],path[fill="#1f2937"]{fill:#4b5563}rect[fill="#3b1f5e"],circle[fill="#3b1f5e"],path[fill="#3b1f5e"]{fill:#553185}svg .t,svg .h{fill:#e6e6e6}svg .a,svg .s{fill:#9aa0a6}svg .f{fill:#1f222a;stroke:#2c313a}svg .g{stroke:#2c313a}rect[fill="#dbeafe"]{fill:#1d2d44}rect[fill="#93c5fd"]{fill:#2a5a9a}rect[fill="#fff7ed"]{fill:#2a2118}}</style>
<defs>
<marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6b7280"/></marker>
<marker id="ao" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#eb6834"/></marker>
</defs>
<rect x="0" y="0" width="960" height="356" fill="#fff"/>

<!-- loop-back -->
<path d="M790 44 V24 H170 V40" fill="none" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ah)"/>
<text x="480" y="18" font-size="10.5" fill="#6b7280" text-anchor="middle">next target</text>

<!-- panel 1 -->
<rect x="20" y="44" width="300" height="180" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
<text x="34" y="66" font-size="13" font-weight="600" fill="#111827">Before launch</text>
<g font-size="11" fill="#111827">
<text x="34" y="92"><tspan font-weight="600">1 Ticket</tspan>: target, owner, counting rule,</text>
<text x="48" y="107">what the plan must contain</text>
<text x="34" y="129"><tspan font-weight="600">2 Prediction</tspan>, committed: what moves,</text>
<text x="48" y="144">and by how much</text>
<text x="34" y="166"><tspan font-weight="600">3 Fresh reader</tspan>: every claim true, the repo</text>
<text x="48" y="181">named, no words put in anyone's mouth</text>
<text x="34" y="203"><tspan font-weight="600">4 Replay</tspan> built and self-checked</text>
</g>
<line x1="320" y1="134" x2="346" y2="134" stroke="#6b7280" stroke-width="1.2" marker-end="url(#ah)"/>

<!-- panel 2 -->
<rect x="350" y="44" width="270" height="180" rx="10" fill="#fff" stroke="#6b7280"/>
<text x="364" y="66" font-size="13" font-weight="600" fill="#111827">The codebase's own pipeline</text>
<g stroke="#6b7280" stroke-width="1.1">
<rect x="364" y="80" width="242" height="30" rx="5" fill="#f3f4f6"/>
<rect x="364" y="118" width="242" height="30" rx="5" fill="#f3f4f6"/>
<rect x="364" y="156" width="242" height="30" rx="5" fill="#f3f4f6"/>
</g>
<g font-size="11" fill="#111827">
<text x="376" y="99">plan ⟲ plan review, bounded loop</text>
<text x="376" y="137">build ⟲ code review</text>
<text x="376" y="175">merge, CI green</text>
</g>
<text x="364" y="210" font-size="10.5" fill="#6b7280">the method adds nothing here but the ticket</text>
<line x1="620" y1="134" x2="636" y2="134" stroke="#6b7280" stroke-width="1.2" marker-end="url(#ah)"/>

<!-- panel 3 -->
<rect x="640" y="44" width="300" height="180" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
<text x="654" y="66" font-size="13" font-weight="600" fill="#111827">After merge</text>
<g font-size="11" fill="#111827">
<text x="654" y="92"><tspan font-weight="600">5 Replay</tspan> old against new, two seeds</text>
<text x="654" y="114"><tspan font-weight="600">6 Score</tspan> against the prediction,</text>
<text x="668" y="129">and file the differences it found</text>
<text x="654" y="151"><tspan font-weight="600">7 Re-measure</tspan> with the standing</text>
<text x="668" y="166">measures; pick the next target</text>
</g>

<!-- people lane -->
<rect x="20" y="262" width="920" height="76" rx="10" fill="#fff7ed" stroke="#eb6834" stroke-width="1.2"/>
<text x="34" y="284" font-size="13" font-weight="600" fill="#111827">People</text>
<text x="34" y="302" font-size="10.5" fill="#6b7280">touched at two points</text>
<path d="M420 224 V258" fill="none" stroke="#eb6834" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ao)"/>
<text x="428" y="246" font-size="10.5" fill="#6b7280">a review loop runs out</text>
<text x="350" y="290" font-size="11" fill="#111827"><tspan font-weight="600">A ruling</tspan>: the card comes</text>
<text x="350" y="306" font-size="11" fill="#111827">pre-filled; a person presses</text>
<path d="M720 224 V258" fill="none" stroke="#eb6834" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ao)"/>
<text x="728" y="246" font-size="10.5" fill="#6b7280">unclear differences, written up</text>
<text x="654" y="290" font-size="11" fill="#111827"><tspan font-weight="600">Open questions</tspan>: answered</text>
<text x="654" y="306" font-size="11" fill="#111827">later, never blocking a run</text>
<text x="34" y="326" font-size="10.5" fill="#6b7280">One round: eight merges, two presses.</text>
</svg>
