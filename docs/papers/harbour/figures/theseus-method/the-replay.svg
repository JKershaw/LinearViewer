<svg xmlns="http://www.w3.org/2000/svg" width="960" height="372" viewBox="0 0 960 372" font-family="Inter, system-ui, sans-serif" font-size="12" role="img" aria-label="The independent replay. Inputs captured from the test suite, thousands of seeded generated inputs, and targeted edge cases go to the old and the new code, each pinned at a commit and run under the same frozen clock, timezone, environment and fakes. Everything an outsider can see is recorded, normalised and compared. The result is zero differences, or each difference named as a fix, bounded fuzz or a regression. It is trusted only after old against old gives zero, every planted mutant is caught, and it covers at least 95% of the old code's lines; after merge it runs on two seeds."><style data-figure-theme="1">@media (prefers-color-scheme: dark){rect[fill="#fff"]:not([fill-opacity]),rect[fill="#ffffff"]:not([fill-opacity]),rect[fill="white"]:not([fill-opacity]){fill:#16181d}[stroke="#fff"],[stroke="#ffffff"],[stroke="white"]{stroke:#16181d}circle[fill="#fff"]:not([fill-opacity]),circle[fill="#ffffff"]:not([fill-opacity]),circle[fill="white"]:not([fill-opacity]){fill:#16181d}path[fill="#fff"]:not([fill-opacity]),path[fill="#ffffff"]:not([fill-opacity]),path[fill="white"]:not([fill-opacity]){fill:#16181d}polygon[fill="#fff"]:not([fill-opacity]),polygon[fill="#ffffff"]:not([fill-opacity]),polygon[fill="white"]:not([fill-opacity]){fill:#16181d}ellipse[fill="#fff"]:not([fill-opacity]),ellipse[fill="#ffffff"]:not([fill-opacity]),ellipse[fill="white"]:not([fill-opacity]){fill:#16181d}text[fill="#111827"]:not([data-on-fill]),text[fill="#1f2937"]:not([data-on-fill]),text[fill="#333"]:not([data-on-fill]),text[fill="#1f2328"]:not([data-on-fill]),text[fill="#555"]:not([data-on-fill]),text[fill="#475569"]:not([data-on-fill]){fill:#e6e6e6}[stroke="#111827"],[stroke="#1f2937"],[stroke="#333"],[stroke="#1f2328"],[stroke="#555"],[stroke="#475569"]{stroke:#e6e6e6}text[fill="#6b7280"]:not([data-on-fill]),text[fill="#666"]:not([data-on-fill]),text[fill="#667085"]:not([data-on-fill]),text[fill="#888"]:not([data-on-fill]),text[fill="#6e7781"]:not([data-on-fill]),text[fill="#999"]:not([data-on-fill]),text[fill="#aaa"]:not([data-on-fill]),text[fill="#bbb"]:not([data-on-fill]),text[fill="#9ca3af"]:not([data-on-fill]),text[fill="#94a3b8"]:not([data-on-fill]){fill:#9aa0a6}[stroke="#6b7280"],[stroke="#666"],[stroke="#667085"],[stroke="#888"],[stroke="#6e7781"],[stroke="#999"],[stroke="#aaa"],[stroke="#bbb"],[stroke="#9ca3af"],[stroke="#94a3b8"]{stroke:#9aa0a6}[stroke="#e5e7eb"],[stroke="#eee"],[stroke="#d1d5db"],[stroke="#f0f0f0"],[stroke="#cbd5e1"],[stroke="#d9d9d9"]{stroke:#2c313a}[fill="#f3f4f6"],[fill="#f9fafb"]{fill:#1f222a}rect[fill="#f0f0f0"],rect[fill="#d1d5db"],rect[fill="#e5e7eb"],rect[fill="#eee"]{fill:#2c313a}text:not([fill]):not([class]):not([data-on-fill]){fill:#e6e6e6}rect[fill="#1f2937"],circle[fill="#1f2937"],path[fill="#1f2937"]{fill:#4b5563}rect[fill="#3b1f5e"],circle[fill="#3b1f5e"],path[fill="#3b1f5e"]{fill:#553185}svg .t,svg .h{fill:#e6e6e6}svg .a,svg .s{fill:#9aa0a6}svg .f{fill:#1f222a;stroke:#2c313a}svg .g{stroke:#2c313a}rect[fill="#dbeafe"]{fill:#1d2d44}rect[fill="#93c5fd"]{fill:#2a5a9a}rect[fill="#fff7ed"]{fill:#2a2118}}</style>
<defs>
<marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6b7280"/></marker>
</defs>
<rect x="0" y="0" width="960" height="372" fill="#fff"/>

<!-- inputs -->
<text x="20" y="28" font-size="13" font-weight="600" fill="#111827">Inputs</text>
<g stroke="#d1d5db">
<rect x="20" y="40" width="200" height="44" rx="6" fill="#f9fafb"/>
<rect x="20" y="94" width="200" height="44" rx="6" fill="#f9fafb"/>
<rect x="20" y="148" width="200" height="44" rx="6" fill="#f9fafb"/>
</g>
<g font-size="11" fill="#111827">
<text x="32" y="59">captured from the test suite</text>
<text x="32" y="113">generated from a seed</text>
<text x="32" y="167">targeted at the change</text>
</g>
<g font-size="10" fill="#6b7280">
<text x="32" y="74">every call the tests make</text>
<text x="32" y="128">thousands, reproducible</text>
<text x="32" y="182">edges, every listed difference</text>
</g>
<g stroke="#6b7280" stroke-width="1.2" fill="none">
<path d="M220 62 H252 M220 116 H252 M220 170 H252 M252 62 V170"/>
<path d="M252 76 H304" marker-end="url(#ah)"/><path d="M252 148 H304" marker-end="url(#ah)"/>
</g>
<text x="258" y="104" font-size="10" fill="#6b7280">same</text>
<text x="258" y="117" font-size="10" fill="#6b7280">inputs</text>

<!-- the two runs -->
<rect x="296" y="36" width="240" height="160" rx="10" fill="#fff" stroke="#6b7280" stroke-dasharray="4 3"/>
<text x="416" y="190" font-size="10" fill="#6b7280" text-anchor="middle">same frozen clock, timezone, env, fakes</text>
<rect x="310" y="52" width="212" height="48" rx="6" fill="#f3f4f6" stroke="#6b7280"/>
<text x="322" y="72" font-size="11.5" font-weight="600" fill="#111827">old code</text>
<text x="322" y="88" font-size="10" fill="#6b7280" font-family="JetBrains Mono, ui-monospace, monospace">pinned at the base commit</text>
<rect x="310" y="124" width="212" height="48" rx="6" fill="#dbeafe" stroke="#2a78d6"/>
<text x="322" y="144" font-size="11.5" font-weight="600" fill="#111827">new code</text>
<text x="322" y="160" font-size="10" fill="#6b7280" font-family="JetBrains Mono, ui-monospace, monospace">pinned at the change</text>

<!-- outputs -->
<line x1="522" y1="76" x2="578" y2="100" stroke="#6b7280" stroke-width="1.2" marker-end="url(#ah)"/>
<line x1="522" y1="148" x2="578" y2="124" stroke="#6b7280" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="582" y="64" width="172" height="96" rx="6" fill="#f9fafb" stroke="#d1d5db"/>
<text x="594" y="84" font-size="11.5" font-weight="600" fill="#111827">what an outsider sees</text>
<g font-size="10.5" fill="#111827">
<text x="594" y="103">replies: status, headers, body</text>
<text x="594" y="119">stored writes</text>
<text x="594" y="135">calls out (to the fakes)</text>
<text x="594" y="151">thrown errors</text>
</g>
<line x1="754" y1="112" x2="770" y2="112" stroke="#6b7280" stroke-width="1.2" marker-end="url(#ah)"/>

<!-- verdict -->
<rect x="774" y="52" width="166" height="120" rx="8" fill="#dbeafe" stroke="#2a78d6" stroke-width="1.3"/>
<text x="786" y="72" font-size="11.5" font-weight="600" fill="#111827">compare, normalised</text>
<text x="786" y="94" font-size="11" fill="#111827">0 differences,</text>
<text x="786" y="110" font-size="11" fill="#111827">or each one named:</text>
<text x="786" y="128" font-size="10.5" fill="#111827" font-family="JetBrains Mono, ui-monospace, monospace">fix · fuzz · regression</text>
<text x="786" y="152" font-size="10" fill="#6b7280">a regression sends it back</text>

<!-- trust it only after -->
<text x="20" y="232" font-size="13" font-weight="600" fill="#111827">Trust the replay only after it passes its own checks</text>
<g stroke="#d1d5db">
<rect x="20" y="246" width="214" height="56" rx="6" fill="#f9fafb"/>
<rect x="244" y="246" width="214" height="56" rx="6" fill="#f9fafb"/>
<rect x="468" y="246" width="214" height="56" rx="6" fill="#f9fafb"/>
<rect x="692" y="246" width="248" height="56" rx="6" fill="#f9fafb"/>
</g>
<g font-size="11.5" font-weight="600" fill="#111827">
<text x="32" y="267">old against old = 0</text>
<text x="256" y="267">planted mutants caught</text>
<text x="480" y="267">old code covered, 95%+</text>
<text x="704" y="267">two seeds after merge</text>
</g>
<g font-size="10.5" fill="#6b7280">
<text x="32" y="286">it is deterministic</text>
<text x="256" y="286">it can see a real break</text>
<text x="480" y="286">it reaches what could move</text>
<text x="704" y="286">old main against new main</text>
</g>
<text x="20" y="330" font-size="10.5" fill="#6b7280">Built by a separate agent, outside the pipeline, before the work starts; the worker never sees it. Known blind spot: a comparison</text>
<text x="20" y="346" font-size="10.5" fill="#6b7280">that sorts keys or rows cannot see an order change, so order-sensitive outputs need an order-aware compare.</text>
</svg>
