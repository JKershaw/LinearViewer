<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 526" width="780" height="526"><rect width="780" height="526" fill="#fff"/><text x="20.0" y="26.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#333" font-weight="600">Where the supervision token bill goes, by action class</text><text x="20.0" y="46.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#666">September 2026: 32,525 steps in 254 supervisor sessions (Runner, leg, stepper, autopilot, wake); share of weighted tokens.</text><text x="20.0" y="62.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#666">Mechanical 77.1% · judgement 22.9% (split from a double hand-coded sample of 220 steps).</text><text x="20.0" y="95.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#333">Re-arm a wake (gate reply)</text><rect x="220" y="80" width="470.0" height="20" fill="#2b6cb0"><title>rearm mechanical 24.2%</title></rect><rect x="690.0" y="80" width="0.0" height="20" fill="#dd8a2e"><title>rearm judgement 0%</title></rect><text x="696.0" y="95.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#555">24.2%</text><text x="20.0" y="125.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#333">Read tracker / dispatch state</text><rect x="220" y="110" width="456.4" height="20" fill="#2b6cb0"><title>read mechanical 23.5%</title></rect><rect x="676.4" y="110" width="3.9" height="20" fill="#dd8a2e"><title>read judgement 0.2%</title></rect><text x="686.3" y="125.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#555">23.7%</text><text x="20.0" y="155.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#333">Restate or summarise state</text><rect x="220" y="140" width="215.6" height="20" fill="#2b6cb0"><title>restate mechanical 11.1%</title></rect><rect x="435.6" y="140" width="85.5" height="20" fill="#dd8a2e"><title>restate judgement 4.4%</title></rect><text x="527.0" y="155.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#555">15.4%</text><text x="20.0" y="185.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#333">Judge a worker's report</text><rect x="220" y="170" width="132.1" height="20" fill="#2b6cb0"><title>judge mechanical 6.8%</title></rect><rect x="352.1" y="170" width="134.0" height="20" fill="#dd8a2e"><title>judge judgement 6.9%</title></rect><text x="492.1" y="185.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#555">13.7%</text><text x="20.0" y="215.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#333">Write and send the next beat</text><rect x="220" y="200" width="35.0" height="20" fill="#2b6cb0"><title>dispatch mechanical 1.8%</title></rect><rect x="255.0" y="200" width="128.2" height="20" fill="#dd8a2e"><title>dispatch judgement 6.6%</title></rect><text x="389.1" y="215.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#555">8.4%</text><text x="20.0" y="245.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#333">Re-ground or orient</text><rect x="220" y="230" width="50.5" height="20" fill="#2b6cb0"><title>orient mechanical 2.6%</title></rect><rect x="270.5" y="230" width="54.4" height="20" fill="#dd8a2e"><title>orient judgement 2.8%</title></rect><text x="330.9" y="245.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#555">5.5%</text><text x="20.0" y="275.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#333">Wait or poll</text><rect x="220" y="260" width="87.4" height="20" fill="#2b6cb0"><title>poll mechanical 4.5%</title></rect><rect x="307.4" y="260" width="1.9" height="20" fill="#dd8a2e"><title>poll judgement 0.1%</title></rect><text x="315.3" y="275.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#555">4.6%</text><text x="20.0" y="305.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#333">Relay a ruling or escalation</text><rect x="220" y="290" width="29.1" height="20" fill="#2b6cb0"><title>relay mechanical 1.5%</title></rect><rect x="249.1" y="290" width="31.1" height="20" fill="#dd8a2e"><title>relay judgement 1.6%</title></rect><text x="286.2" y="305.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#555">3.1%</text><text x="20.0" y="335.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#333">Decide the next task</text><rect x="220" y="320" width="13.6" height="20" fill="#2b6cb0"><title>decide mechanical 0.7%</title></rect><rect x="233.6" y="320" width="3.9" height="20" fill="#dd8a2e"><title>decide judgement 0.2%</title></rect><text x="243.5" y="335.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#555">0.9%</text><text x="20.0" y="365.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#333">Do a worker's job</text><rect x="220" y="350" width="1.9" height="20" fill="#2b6cb0"><title>work mechanical 0.1%</title></rect><rect x="221.9" y="350" width="0.0" height="20" fill="#dd8a2e"><title>work judgement 0%</title></rect><text x="227.9" y="365.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#555">0.2%</text><text x="20.0" y="395.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#333">Recover from an error</text><rect x="220" y="380" width="3.9" height="20" fill="#2b6cb0"><title>recover mechanical 0.2%</title></rect><rect x="223.9" y="380" width="0.0" height="20" fill="#dd8a2e"><title>recover judgement 0%</title></rect><text x="229.9" y="395.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#555">0.2%</text><text x="20.0" y="425.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#333">Set status, merge, Done</text><rect x="220" y="410" width="1.9" height="20" fill="#2b6cb0"><title>land mechanical 0.1%</title></rec