<title id="title">Two ways to move toward a settled codebase</title>
<desc id="description">Theseus gathers scattered rules and rebuilds selected structures, checking behaviour by replay. Survey scopes ordinary work and tidies afterwards. Each section reports its own experimental observations.</desc>
<rect x="0" y="0" width="660" height="738" rx="0" fill="#ffffff" stroke="none"/>
<text x="22" y="40" font-size="32" fill="#111827" font-weight="650">Two ways to move toward settled</text>
<rect x="22" y="75" width="616" height="279" rx="8" fill="#f3f4f6" stroke="none"/>
<text x="42" y="117" font-size="30" fill="#1766ad" font-weight="650">Theseus</text>
<text x="42" y="156" font-size="25" fill="#111827" font-weight="400">Gather scattered rules, then rebuild.</text>
<text x="42" y="190" font-size="25" fill="#111827" font-weight="400">Replay old and new on the same inputs.</text>
<path d="M42 209H618" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="42" y="248" font-size="24" fill="#475569" font-weight="600">17 October trial</text>
<text x="42" y="283" font-size="25" fill="#111827" font-weight="400">8 tickets merged · 2 formal human rulings</text>
<text x="42" y="318" font-size="24" fill="#111827" font-weight="400">6 independent replays found no differences</text>
<text x="42" y="345" font-size="23" fill="#475569" font-weight="400">in the comparisons they ran.</text>
<rect x="22" y="371" width="616" height="294" rx="8" fill="#f3f4f6" stroke="none"/>
<text x="42" y="413" font-size="30" fill="#1766ad" font-weight="650">Survey</text>
<text x="42" y="452" font-size="25" fill="#111827" font-weight="400">Look first, choose the scope, then build.</text>
<text x="42" y="486" font-size="25" fill="#111827" font-weight="400">Tidy what the change leaves behind.</text>
<path d="M42 503H618" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="42" y="542" font-size="24" fill="#475569" font-weight="600">November readings</text>
<text x="42" y="577" font-size="24" fill="#111827" font-weight="400">9 selected areas read better in both passes.</text>
<text x="42" y="611" font-size="24" fill="#111827" font-weight="400">Wider reads: no detectable code difference.</text>
<text x="42" y="646" font-size="24" fill="#111827" font-weight="400">3 tidies cost 47%–85% of their parent tasks.</text>
<text x="22" y="711" font-size="22" fill="#475569" font-weight="400">Sources  Consolidate Then Rebuild · Survey records</text>
</svg>
