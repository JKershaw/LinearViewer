tered: the blind reader's judgement, moved to "worse" when a shipped test fails on behaviour or the replay ships the known fault.</text><rect x="150" y="96" width="510" height="84" fill="#f9fafb"/><text x="138" y="142" font-size="12" fill="#047857" text-anchor="end" font-weight="600">replay better</text><rect x="150" y="188" width="510" height="84" fill="#f9fafb"/><text x="138" y="234" font-size="12" fill="#6b7280" text-anchor="end" font-weight="600">replay equivalent</text><rect x="150" y="280" width="510" height="84" fill="#f9fafb"/><text x="138" y="326" font-size="12" fill="#b91c1c" text-anchor="end" font-weight="600">replay worse</text><line x1="150" x2="150" y1="92" y2="368" stroke="#e5e7eb"/><text x="150" y="384" font-size="11" fill="#6b7280" text-anchor="middle">0.5%</text><line x1="236.33984187537854" x2="236.33984187537854" y1="92" y2="368" stroke="#e5e7eb"/><text x="236.33984187537854" y="384" font-size="11" fill="#6b7280" text-anchor="middle">1%</text><line x1="322.6796837507571" x2="322.6796837507571" y1="92" y2="368" stroke="#e5e7eb"/><text x="322.6796837507571" y="384" font-size="11" fill="#6b7280" text-anchor="middle">2%</text><line x1="436.81474643395234" x2="436.81474643395234" y1="92" y2="368" stroke="#e5e7eb"/><text x="436.81474643395234" y="384" font-size="11" fill="#6b7280" text-anchor="middle">5%</text><line x1="523.1545883093308" x2="523.1545883093308" y1="92" y2="368" stroke="#e5e7eb"/><text x="523.1545883093308" y="384" font-size="11" fill="#6b7280" text-anchor="middle">10%</text><line x1="609.4944301847095" x2="609.4944301847095" y1="92" y2="368" stroke="#e5e7eb"/><text x="609.4944301847095" y="384" font-size="11" fill="#6b7280" text-anchor="middle">20%</text><text x="405" y="404" font-size="11" fill="#1f2937" text-anchor="middle">lean cost ÷ original whole-life cost (log scale)</text><path d="M492.2057291411461,115 l5,5 l-5,5 l-5,-5 z" fill="#fff" stroke="#9ca3af" stroke-width="1.6"/><line x1="492.2057291411461" x2="492.2057291411461" y1="