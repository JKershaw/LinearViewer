fill="#b45309" stroke="#b45309" stroke-width="1.6"/><text x="710" y="112" font-size="11" fill="#1f2937">runner (simple-dispatcher)</text><path d="M699,120 l6,6 l-6,6 l-6,-6 z" fill="#1f2937" stroke="#1f2937" stroke-width="1.6"/><text x="710" y="130" font-size="11" fill="#1f2937">known escape or named fix</text><circle cx="699" cy="144" r="5" fill="#1f2937" stroke="#1f2937" stroke-width="1.6"/><text x="710" y="148" font-size="11" fill="#1f2937">clean</text><circle cx="699" cy="162" r="5" fill="#fff" stroke="#1f2937" stroke-width="1.6"/><text x="710" y="166" font-size="11" fill="#1f2937">no transcripts (August):</text><text x="710" y="180" font-size="10" fill="#6b7280">ratio in working hours</text><circle cx="699" cy="206" r="4" fill="#fff" stroke="#9ca3af" stroke-width="1.6"/><text x="710" y="210" font-size="11" fill="#1f2937">blind reader's own judgement,</text><text x="710" y="224" font-size="10" fill="#6b7280">where the rule moved it to worse</text><text x="694" y="262" font-size="10.5" fill="#1f2937">Median ratio: 4.1% of tokens (10 tickets),</text><text x="694" y="277" font-size="10.5" fill="#1f2937">5.9% of working hours (all 13).</text><text x="694" y="292" font-size="10.5" fill="#1f2937">Charging wakes to the child named instead of</text><text x="694" y="307" font-size="10.5" fill="#1f2937">the session entered: 4.1%.</text><text x="694" y="322" font-size="10.5" fill="#1f2937">Blind readers agreed with each other on</text><text x="694" y="337" font-size="10.5" fill="#1f2937">12 of 12 with the order swapped.</text></svg>
