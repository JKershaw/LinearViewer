xt><rect x="150" y="174" width="190.99" height="46" fill="#7c3aed"/><text x="154" y="190" font-size="10" fill="#fff">tracker</text><text x="154" y="204" font-size="10" fill="#fff">27%</text><rect x="340.99" y="174" width="44.73" height="46" fill="#c084fc"/><text x="344.99" y="190" font-size="10" fill="#fff">remote</text><text x="344.99" y="204" font-size="10" fill="#fff">6%</text><rect x="385.72" y="174" width="2.84" height="46" fill="#e9d5ff"/><rect x="388.56" y="174" width="141.29000000000002" height="46" fill="#1d4ed8"/><text x="392.56" y="190" font-size="10" fill="#fff">read</text><text x="392.56" y="204" font-size="10" fill="#fff">20%</text><rect x="529.85" y="174" width="31.24" height="46" fill="#047857"/><rect x="561.09" y="174" width="68.87" height="46" fill="#34d399"/><text x="565.09" y="190" font-size="10" fill="#fff">test</text><text x="565.09" y="204" font-size="10" fill="#fff">10%</text><rect x="629.96" y="174" width="102.24" height="46" fill="#9ca3af"/><text x="633.96" y="190" font-size="10" fill="#1f2937">text</text><text x="633.96" y="204" font-size="10" fill="#1f2937">14%</text><rect x="732.2" y="174" width="127.8" height="46" fill="#d1d5db"/><text x="736.2" y="190" font-size="10" fill="#1f2937">other</text><text x="736.2" y="204" font-size="10" fill="#1f2937">18%</text><line x1="150" x2="388.56" y1="228" y2="228" stroke="#1f2937"/><text x="150" y="242" font-size="10.5" fill="#1f2937">chores the lean replay never did (tracker, git remote / PR / CI, waiting): 34%</text><text x="138" y="311" font-size="12" fill="#1f2937" text-anchor="end" font-weight="600">lean replay</text><text x="138" y="325" font-size="10.5" fill="#6b7280" text-anchor="end">1.34M</text><rect x="150" y="284" width="10.290039888636215" height="46" fill="#047857"/><rect x="160.29003988863622" y="284" width="5.265669464906239" height="46" fill="#1d4ed8"/><rect x="165.55570935354245" y="284" width="3.267647820628042" height="46" fill="#b45309"/><text x="176.8233571741705" y="302" font-size="10.5" fill="#1f2937">2.7% of the original: implementer, review and close-out</text><text x="176.8233571741705" y="318" font-size="10.5" fill="#6b7280">A fleet implementation leg ran a median 77 turns at 13k a turn; the replay's implementer ran </text><text x="176.8233571741705" y="332" font-size="10.5" fill="#6b7280">11 turns at 5k a turn.</text></svg>
