<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" font-family="Inter, system-ui, sans-serif" font-size="12" role="img" aria-label="Two pipelines, a drawing with no data. Top, the old line: four tickets in a row, each done by an agent that then leaves; small orange leftovers pile up between the tickets, one more each time, and clearing them is no one's job. Bottom, the new pipeline: for each change, a look first, then a decision on how big the move should be, then the change, then a tidy of what the change left behind; the leftovers from the change are cleared by the tidy, and the next change starts on a clearer floor."><style data-figure-theme="1">@media (prefers-color-scheme: dark){rect[fill="#fff"]:not([fill-opacity]),rect[fill="#ffffff"]:not([fill-opacity]),rect[fill="white"]:not([fill-opacity]){fill:#16181d}[stroke="#fff"],[stroke="#ffffff"],[stroke="white"]{stroke:#16181d}circle[fill="#fff"]:not([fill-opacity]),circle[fill="#ffffff"]:not([fill-opacity]),circle[fill="white"]:not([fill-opacity]){fill:#16181d}path[fill="#fff"]:not([fill-opacity]),path[fill="#ffffff"]:not([fill-opacity]),path[fill="white"]:not([fill-opacity]){fill:#16181d}polygon[fill="#fff"]:not([fill-opacity]),polygon[fill="#ffffff"]:not([fill-opacity]),polygon[fill="white"]:not([fill-opacity]){fill:#16181d}ellipse[fill="#fff"]:not([fill-opacity]),ellipse[fill="#ffffff"]:not([fill-opacity]),ellipse[fill="white"]:not([fill-opacity]){fill:#16181d}text[fill="#111827"]:not([data-on-fill]),text[fill="#1f2937"]:not([data-on-fill]),text[fill="#333"]:not([data-on-fill]),text[fill="#1f2328"]:not([data-on-fill]),text[fill="#555"]:not([data-on-fill]),text[fill="#475569"]:not([data-on-fill]){fill:#e6e6e6}[stroke="#111827"],[stroke="#1f2937"],[stroke="#333"],[stroke="#1f2328"],[stroke="#555"],[stroke="#475569"]{stroke:#e6e6e6}text[fill="#6b7280"]:not([data-on-fill]),text[fill="#666"]:not([data-on-fill]),text[fill="#667085"]:not([data-on-fill]),text[fill="#888"]:not([data-on-fill]),text[fill="#6e7781"]:not([data-on-fill]),text[fill="#999"]:not([data-on-fill]),text[fill="#aaa"]:not([data-on-fill]),text[fill="#bbb"]:not([data-on-fill]),text[fill="#9ca3af"]:not([data-on-fill]),text[fill="#94a3b8"]:not([data-on-fill]){fill:#9aa0a6}[stroke="#6b7280"],[stroke="#666"],[stroke="#667085"],[stroke="#888"],[stroke="#6e7781"],[stroke="#999"],[stroke="#aaa"],[stroke="#bbb"],[stroke="#9ca3af"],[stroke="#94a3b8"]{stroke:#9aa0a6}[stroke="#e5e7eb"],[stroke="#eee"],[stroke="#d1d5db"],[stroke="#f0f0f0"],[stroke="#cbd5e1"],[stroke="#d9d9d9"]{stroke:#2c313a}[fill="#f3f4f6"],[fill="#f9fafb"]{fill:#1f222a}rect[fill="#f0f0f0"],rect[fill="#d1d5db"],rect[fill="#e5e7eb"],rect[fill="#eee"]{fill:#2c313a}text:not([fill]):not([class]):not([data-on-fill]){fill:#e6e6e6}rect[fill="#1f2937"],circle[fill="#1f2937"],path[fill="#1f2937"]{fill:#4b5563}rect[fill="#3b1f5e"],circle[fill="#3b1f5e"],path[fill="#3b1f5e"]{fill:#553185}svg .t,svg .h{fill:#e6e6e6}svg .a,svg .s{fill:#9aa0a6}svg .f{fill:#1f222a;stroke:#2c313a}svg .g{stroke:#2c313a}rect[fill="#dbeafe"]{fill:#1d2d44}rect[fill="#93c5fd"]{fill:#2a5a9a}rect[fill="#fff7ed"]{fill:#2a2118}}</style><rect x="0" y="0" width="960" height="470" fill="#fff"/>
<defs><marker id="ar2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6b7280"/></marker></defs>
<text x="20" y="30" font-size="14" font-weight="600" fill="#111827">The old line: each agent finishes its own ticket and leaves</text>
<rect x="20" y="52" width="170" height="58" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/>
<text x="34" y="76" font-size="13" font-weight="600" fill="#111827">Ticket 1</text>
<text x="34" y="96" font-size="11.5" fill="#6b7280">done, and the agent leaves</text>
<line x1="194" y1="81" x2="246" y2="81" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ar2)"/>
<rect x="34" y="132" width="12" height="12" rx="2" fill="#eb6834"/>
<rect x="252" y="52" width="170" height="58" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/>
<text x="266" y="76" font-size="13" font-weight="600" fill="#111827">Ticket 2</text>
<text x="266" y="96" font-size="11.5" fill="#6b7280">done, and the agent leaves</text>
<line x1="426" y1="81" x2="478" y2="81" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ar2)"/>
<rect x="266" y="132" width="12" height="12" rx="2" fill="#eb6834"/>
<rect x="284" y="132" width="12" height="12" rx="2" fill="#eb6834"/>
<rect x="484" y="52" width="170" height="58" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/>
<text x="498" y="76" font-size="13" font-weight="600" fill="#111827">Ticket 3</text>
<text x="498" y="96" font-size="11.5" fill="#6b7280">done, and the agent leaves</text>
<line x1="658" y1="81" x2="710" y2="81" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ar2)"/>
<rect x="498" y="132" width="12" height="12" rx="2" fill="#eb6834"/>
<rect x="516" y="132" width="12" height="12" rx="2" fill="#eb6834"/>
<rect x="534" y="132" width="12" height="12" rx="2" fill="#eb6834"/>
<rect x="716" y="52" width="170" height="58" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/>
<text x="730" y="76" font-size="13" font-weight="600" fill="#111827">Ticket 4</text>
<text x="730" y="96" font-size="11.5" fill="#6b7280">done, and the agent leaves</text>
<rect x="730" y="132" width="12" height="12" rx="2" fill="#eb6834"/>
<rect x="748" y="132" width="12" height="12" rx="2" fill="#eb6834"/>
<rect x="766" y="132" width="12" height="12" rx="2" fill="#eb6834"/>
<rect x="784" y="132" width="12" height="12" rx="2" fill="#eb6834"/>
<line x1="20" y1="148" x2="886" y2="148" stroke="#e5e7eb" stroke-width="2"/>
<text x="20" y="170" font-size="11.5" fill="#111827">Leftovers (a second copy of a rule, a list nobody updated) pile up between tickets. Each ticket is done; clearing them is no one's job.</text>
<text x="20" y="218" font-size="14" font-weight="600" fill="#111827">The new pipeline: four steps for each change</text>
<rect x="20" y="230" width="196" height="74" rx="8" fill="#eef4fd" stroke="#2a78d6" stroke-width="1.4"/>
<text data-on-fill="1" x="34" y="254" font-size="13" font-weight="600" fill="#111827">1. Look first</text>
<text data-on-fill="1" x="34" y="274" font-size="11.5" fill="#6b7280">a read-only look at the code</text>
<text data-on-fill="1" x="34" y="290" font-size="11.5" fill="#6b7280">around the ticket</text>
<line x1="219" y1="267" x2="243" y2="267" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ar2)"/>
<rect x="248" y="230" width="196" height="74" rx="8" fill="#eef4fd" stroke="#2a78d6" stroke-width="1.4"/>
<text data-on-fill="1" x="262" y="254" font-size="13" font-weight="600" fill="#111827">2. Decide the size</text>
<text data-on-fill="1" x="262" y="274" font-size="11.5" fill="#6b7280">how big a move: just the</text>
<text data-on-fill="1" x="262" y="290" font-size="11.5" fill="#6b7280">task, or tidy the area too</text>
<line x1="447" y1="267" x2="471" y2="267" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ar2)"/>
<rect x="476" y="230" width="196" height="74" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/>
<text x="490" y="254" font-size="13" font-weight="600" fill="#111827">3. Make the change</text>
<text x="490" y="274" font-size="11.5" fill="#6b7280">the work itself, which may</text>
<text x="490" y="290" font-size="11.5" fill="#6b7280">leave copies at its edges</text>
<line x1="675" y1="267" x2="699" y2="267" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ar2)"/>
<rect x="704" y="230" width="196" height="74" rx="8" fill="#fff7f3" stroke="#eb6834" stroke-width="1.4"/>
<text data-on-fill="1" x="718" y="254" font-size="13" font-weight="600" fill="#111827">4. Tidy what it left</text>
<text data-on-fill="1" x="718" y="274" font-size="11.5" fill="#6b7280">straight after, a small</text>
<text data-on-fill="1" x="718" y="290" font-size="11.5" fill="#6b7280">follow-on clears them</text>
<rect x="490" y="326" width="12" height="12" rx="2" fill="#eb6834"/>
<rect x="508" y="326" width="12" height="12" rx="2" fill="#eb6834"/>
<text x="530" y="336" font-size="11" fill="#6b7280">left at the edges</text>
<rect x="718" y="326" width="12" height="12" rx="2" fill="none" stroke="#eb6834" stroke-width="1.2" stroke-dasharray="3 2"/>
<rect x="736" y="326" width="12" height="12" rx="2" fill="none" stroke="#eb6834" stroke-width="1.2" stroke-dasharray="3 2"/>
<text x="758" y="336" font-size="11" fill="#6b7280">cleared</text>
<line x1="20" y1="344" x2="900" y2="344" stroke="#e5e7eb" stroke-width="2"/>
<path d="M802 352 C 802 388, 120 388, 118 312" fill="none" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="6 5" marker-end="url(#ar2)"/>
<text x="460" y="398" font-size="11" fill="#6b7280" text-anchor="middle">the next change starts on a clearer floor; anything still left is written down for it</text>
<text x="20" y="456" font-size="11" fill="#6b7280">A drawing, not data. Orange squares: leftovers, drawn one more per ticket to show the build-up, not counted. Dashed: cleared.</text>
</svg>
