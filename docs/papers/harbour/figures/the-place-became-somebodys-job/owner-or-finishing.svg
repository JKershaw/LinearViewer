<rect x="20" y="20" width="450" height="250" rx="8" fill="#fbfbfc" stroke="#e5e7eb" stroke-width="1.2"/>
<text data-on-fill="1" x="36" y="44" font-size="13" font-weight="600" fill="#111827">Adding an owner beside the copies</text>
<rect x="44" y="78" width="190" height="40" rx="6" fill="#eef4fd" stroke="#2a78d6" stroke-width="1.4"/><text data-on-fill="1" x="139" y="102" font-size="12" fill="#111827" text-anchor="middle">new owner</text>
<rect x="264" y="78" width="180" height="40" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/><text x="354" y="102" font-size="12" fill="#111827" text-anchor="middle">old copy</text>
<rect x="264" y="124" width="180" height="40" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/><text x="354" y="148" font-size="12" fill="#111827" text-anchor="middle">old copy</text>
<rect x="264" y="170" width="180" height="40" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/><text x="354" y="194" font-size="12" fill="#111827" text-anchor="middle">old copy</text>
<rect x="44" y="150" width="120" height="28" rx="14" fill="#9ca3af"/><text x="104" y="169" font-size="12" fill="#fff" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace">mixed</text>
<text data-on-fill="1" x="44" y="234" font-size="11" fill="#6b7280">The new owner sits beside the copies it leaves running.</text>
<rect x="490" y="20" width="450" height="250" rx="8" fill="#fbfbfc" stroke="#e5e7eb" stroke-width="1.2"/>
<text data-on-fill="1" x="506" y="44" font-size="13" font-weight="600" fill="#111827">Finishing: the copies deleted</text>
<rect x="514" y="78" width="190" height="40" rx="6" fill="#eef4fd" stroke="#2a78d6" stroke-width="1.4"/><text data-on-fill="1" x="609" y="102" font-size="12" fill="#111827" text-anchor="middle">one owner</text>
<text data-on-fill="1" x="514" y="146" font-size="11" fill="#6b7280">The copies are gone; nothing is left</text>
<text data-on-fill="1" x="514" y="162" font-size="11" fill="#6b7280">beside the owner to disagree with it.</text>
<rect x="514" y="180" width="120" height="28" rx="14" fill="#2a78d6"/><text x="574" y="199" font-size="12" fill="#fff" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace">better</text>
<text x="20" y="288" font-size="11" fill="#6b7280">A drawing, not data: the hypothesis from eleven cases.</text>
</svg>
