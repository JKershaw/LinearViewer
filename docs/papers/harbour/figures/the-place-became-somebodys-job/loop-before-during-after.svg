<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" font-family="Inter, system-ui, sans-serif" font-size="12" role="img" aria-label="The loop as it ran on 5 November, in three stages: before the work a read-only Survey and a scope call; during the work a tidy first where the change binds, then the change; at merge two blind reads and the builder's answers; after the merge a tidy-after of the copies left at the edges. A dashed line returns from the tidy-after to the next ticket in the same area."><style data-figure-theme="1">@media (prefers-color-scheme: dark){rect[fill="#fff"]:not([fill-opacity]),rect[fill="#ffffff"]:not([fill-opacity]),rect[fill="white"]:not([fill-opacity]){fill:#16181d}[stroke="#fff"],[stroke="#ffffff"],[stroke="white"]{stroke:#16181d}circle[fill="#fff"]:not([fill-opacity]),circle[fill="#ffffff"]:not([fill-opacity]),circle[fill="white"]:not([fill-opacity]){fill:#16181d}path[fill="#fff"]:not([fill-opacity]),path[fill="#ffffff"]:not([fill-opacity]),path[fill="white"]:not([fill-opacity]){fill:#16181d}polygon[fill="#fff"]:not([fill-opacity]),polygon[fill="#ffffff"]:not([fill-opacity]),polygon[fill="white"]:not([fill-opacity]){fill:#16181d}ellipse[fill="#fff"]:not([fill-opacity]),ellipse[fill="#ffffff"]:not([fill-opacity]),ellipse[fill="white"]:not([fill-opacity]){fill:#16181d}text[fill="#111827"]:not([data-on-fill]),text[fill="#1f2937"]:not([data-on-fill]),text[fill="#333"]:not([data-on-fill]),text[fill="#1f2328"]:not([data-on-fill]),text[fill="#555"]:not([data-on-fill]),text[fill="#475569"]:not([data-on-fill]){fill:#e6e6e6}[stroke="#111827"],[stroke="#1f2937"],[stroke="#333"],[stroke="#1f2328"],[stroke="#555"],[stroke="#475569"]{stroke:#e6e6e6}text[fill="#6b7280"]:not([data-on-fill]),text[fill="#666"]:not([data-on-fill]),text[fill="#667085"]:not([data-on-fill]),text[fill="#888"]:not([data-on-fill]),text[fill="#6e7781"]:not([data-on-fill]),text[fill="#999"]:not([data-on-fill]),text[fill="#aaa"]:not([data-on-fill]),text[fill="#bbb"]:not([data-on-fill]),text[fill="#9ca3af"]:not([data-on-fill]),text[fill="#94a3b8"]:not([data-on-fill]){fill:#9aa0a6}[stroke="#6b7280"],[stroke="#666"],[stroke="#667085"],[stroke="#888"],[stroke="#6e7781"],[stroke="#999"],[stroke="#aaa"],[stroke="#bbb"],[stroke="#9ca3af"],[stroke="#94a3b8"]{stroke:#9aa0a6}[stroke="#e5e7eb"],[stroke="#eee"],[stroke="#d1d5db"],[stroke="#f0f0f0"],[stroke="#cbd5e1"],[stroke="#d9d9d9"]{stroke:#2c313a}[fill="#f3f4f6"],[fill="#f9fafb"]{fill:#1f222a}rect[fill="#f0f0f0"],rect[fill="#d1d5db"],rect[fill="#e5e7eb"],rect[fill="#eee"]{fill:#2c313a}text:not([fill]):not([class]):not([data-on-fill]){fill:#e6e6e6}rect[fill="#1f2937"],circle[fill="#1f2937"],path[fill="#1f2937"]{fill:#4b5563}rect[fill="#3b1f5e"],circle[fill="#3b1f5e"],path[fill="#3b1f5e"]{fill:#553185}svg .t,svg .h{fill:#e6e6e6}svg .a,svg .s{fill:#9aa0a6}svg .f{fill:#1f222a;stroke:#2c313a}svg .g{stroke:#2c313a}rect[fill="#dbeafe"]{fill:#1d2d44}rect[fill="#93c5fd"]{fill:#2a5a9a}rect[fill="#fff7ed"]{fill:#2a2118}}</style><rect x="0" y="0" width="960" height="330" fill="#fff"/>
<defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6b7280"/></marker></defs>
<rect x="20" y="58" width="300" height="150" rx="8" fill="#eef4fd" stroke="#2a78d6" stroke-width="1.4"/>
<text data-on-fill="1" x="36" y="86" font-size="14" font-weight="600" fill="#111827">Before the work</text>
<text data-on-fill="1" x="36" y="114" font-size="12" fill="#111827">A read-only Survey of the ticket, posted on it</text>
<text data-on-fill="1" x="36" y="137" font-size="12" fill="#111827">The scope call, written onto the ticket: how</text>
<text data-on-fill="1" x="36" y="154" font-size="12" fill="#111827">big the move is, and the checks to run at</text>
<text data-on-fill="1" x="36" y="171" font-size="12" fill="#111827">merge</text>
<rect x="330" y="58" width="300" height="150" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/>
<text x="346" y="86" font-size="14" font-weight="600" fill="#111827">During the work</text>
<text x="346" y="114" font-size="12" fill="#111827">A tidy first, as its own task, where the</text>
<text x="346" y="131" font-size="12" fill="#111827">change binds</text>
<text x="346" y="154" font-size="12" fill="#111827">Then the change itself, re-surveyed on the</text>
<text x="346" y="171" font-size="12" fill="#111827">tidied ground</text>
<rect x="640" y="58" width="300" height="150" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/>
<text x="656" y="86" font-size="14" font-weight="600" fill="#111827">At merge</text>
<text x="656" y="114" font-size="12" fill="#111827">Two blind reads of the commit, from its code</text>
<text x="656" y="131" font-size="12" fill="#111827">alone</text>
<text x="656" y="154" font-size="12" fill="#111827">The builder's after-answers, once the work's</text>
<text x="656" y="171" font-size="12" fill="#111827">lineage has ended</text>
<line x1="326" y1="133" x2="322" y2="133" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="636" y1="133" x2="632" y2="133" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="640" y="236" width="300" height="60" rx="8" fill="#fff7f3" stroke="#eb6834" stroke-width="1.4"/>
<text data-on-fill="1" x="656" y="260" font-size="14" font-weight="600" fill="#111827">After the merge</text>
<text data-on-fill="1" x="656" y="282" font-size="12" fill="#111827">A tidy-after: the copies left at the edges, straight away</text>
<line x1="790" y1="208" x2="790" y2="232" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ar)"/>
<path d="M640 266 C 520 300, 240 300, 170 212" fill="none" stroke="#eb6834" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#ar)"/>
<text x="330" y="292" font-size="11" fill="#6b7280" text-anchor="middle">the next ticket in the same area starts from what was left in the notebook</text>
<text x="20" y="316" font-size="11" fill="#6b7280">The Periodical reviews sit outside the loop: an occasional read of the whole codebase, the film rather than the still.</text>
</svg>
