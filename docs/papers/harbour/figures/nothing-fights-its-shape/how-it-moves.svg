<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" font-family="Inter, system-ui, sans-serif" font-size="12" role="img" aria-label="A flow. Talk settles into four things: what is wanted, a decision and why, a finding, and a job. The job becomes a change, and the change becomes what is so: the code. Under them all runs one long bar, the record of what happened, dated and never edited; dashed arrows show each form closing and joining the record. One arrow returns from the record to a finding: read later, the record gives a new finding. A drawing, not data."><style data-figure-theme="1">@media (prefers-color-scheme: dark){rect[fill="#fff"]:not([fill-opacity]),rect[fill="#ffffff"]:not([fill-opacity]),rect[fill="white"]:not([fill-opacity]){fill:#16181d}[stroke="#fff"],[stroke="#ffffff"],[stroke="white"]{stroke:#16181d}circle[fill="#fff"]:not([fill-opacity]),circle[fill="#ffffff"]:not([fill-opacity]),circle[fill="white"]:not([fill-opacity]){fill:#16181d}path[fill="#fff"]:not([fill-opacity]),path[fill="#ffffff"]:not([fill-opacity]),path[fill="white"]:not([fill-opacity]){fill:#16181d}polygon[fill="#fff"]:not([fill-opacity]),polygon[fill="#ffffff"]:not([fill-opacity]),polygon[fill="white"]:not([fill-opacity]){fill:#16181d}ellipse[fill="#fff"]:not([fill-opacity]),ellipse[fill="#ffffff"]:not([fill-opacity]),ellipse[fill="white"]:not([fill-opacity]){fill:#16181d}text[fill="#111827"]:not([data-on-fill]),text[fill="#1f2937"]:not([data-on-fill]),text[fill="#333"]:not([data-on-fill]),text[fill="#1f2328"]:not([data-on-fill]),text[fill="#555"]:not([data-on-fill]),text[fill="#475569"]:not([data-on-fill]){fill:#e6e6e6}[stroke="#111827"],[stroke="#1f2937"],[stroke="#333"],[stroke="#1f2328"],[stroke="#555"],[stroke="#475569"]{stroke:#e6e6e6}text[fill="#6b7280"]:not([data-on-fill]),text[fill="#666"]:not([data-on-fill]),text[fill="#667085"]:not([data-on-fill]),text[fill="#888"]:not([data-on-fill]),text[fill="#6e7781"]:not([data-on-fill]),text[fill="#999"]:not([data-on-fill]),text[fill="#aaa"]:not([data-on-fill]),text[fill="#bbb"]:not([data-on-fill]),text[fill="#9ca3af"]:not([data-on-fill]),text[fill="#94a3b8"]:not([data-on-fill]){fill:#9aa0a6}[stroke="#6b7280"],[stroke="#666"],[stroke="#667085"],[stroke="#888"],[stroke="#6e7781"],[stroke="#999"],[stroke="#aaa"],[stroke="#bbb"],[stroke="#9ca3af"],[stroke="#94a3b8"]{stroke:#9aa0a6}[stroke="#e5e7eb"],[stroke="#eee"],[stroke="#d1d5db"],[stroke="#f0f0f0"],[stroke="#cbd5e1"],[stroke="#d9d9d9"]{stroke:#2c313a}[fill="#f3f4f6"],[fill="#f9fafb"]{fill:#1f222a}rect[fill="#f0f0f0"],rect[fill="#d1d5db"],rect[fill="#e5e7eb"],rect[fill="#eee"]{fill:#2c313a}text:not([fill]):not([class]):not([data-on-fill]){fill:#e6e6e6}rect[fill="#1f2937"],circle[fill="#1f2937"],path[fill="#1f2937"]{fill:#4b5563}rect[fill="#3b1f5e"],circle[fill="#3b1f5e"],path[fill="#3b1f5e"]{fill:#553185}svg .t,svg .h{fill:#e6e6e6}svg .a,svg .s{fill:#9aa0a6}svg .f{fill:#1f222a;stroke:#2c313a}svg .g{stroke:#2c313a}rect[fill="#dbeafe"]{fill:#1d2d44}rect[fill="#93c5fd"]{fill:#2a5a9a}rect[fill="#fff7ed"]{fill:#2a2118}}</style><rect x="0" y="0" width="960" height="420" fill="#fff"/>
<defs><marker id="nf-ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6b7280"/></marker></defs>
<text x="20" y="30" font-size="14" font-weight="600" fill="#111827">How one kind becomes another</text>
<rect x="20" y="122" width="142" height="56" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/>
<text x="34" y="146" font-size="13" font-weight="600" fill="#111827">Talk</text>
<text x="34" y="164" font-size="11.5" fill="#6b7280">where it is first said</text>
<rect x="200" y="60" width="200" height="40" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/>
<text x="214" y="84.5" font-size="13" font-weight="600" fill="#111827">What is wanted</text>
<line x1="164" y1="150" x2="196" y2="80" stroke="#6b7280" stroke-width="1.6" marker-end="url(#nf-ar)"/>
<rect x="200" y="108" width="200" height="40" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/>
<text x="214" y="132.5" font-size="13" font-weight="600" fill="#111827">A decision, and why</text>
<line x1="164" y1="150" x2="196" y2="128" stroke="#6b7280" stroke-width="1.6" marker-end="url(#nf-ar)"/>
<rect x="200" y="156" width="200" height="40" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/>
<text x="214" y="180.5" font-size="13" font-weight="600" fill="#111827">A finding</text>
<line x1="164" y1="150" x2="196" y2="176" stroke="#6b7280" stroke-width="1.6" marker-end="url(#nf-ar)"/>
<rect x="200" y="204" width="200" height="40" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/>
<text x="214" y="228.5" font-size="13" font-weight="600" fill="#111827">A job: what remains to do</text>
<line x1="164" y1="150" x2="196" y2="224" stroke="#6b7280" stroke-width="1.6" marker-end="url(#nf-ar)"/>
<rect x="456" y="196" width="130" height="56" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/>
<text x="470" y="220" font-size="13" font-weight="600" fill="#111827">A change</text>
<text x="470" y="238" font-size="11.5" fill="#6b7280">made once</text>
<line x1="402" y1="224" x2="452" y2="224" stroke="#6b7280" stroke-width="1.6" marker-end="url(#nf-ar)"/>
<rect x="642" y="196" width="190" height="56" rx="8" fill="#eef4fd" stroke="#2a78d6" stroke-width="1.4"/>
<text data-on-fill="1" x="656" y="220" font-size="13" font-weight="600" fill="#111827">What is so</text>
<text data-on-fill="1" x="656" y="238" font-size="11.5" fill="#6b7280">the code, as it now runs</text>
<line x1="588" y1="224" x2="638" y2="224" stroke="#6b7280" stroke-width="1.6" marker-end="url(#nf-ar)"/>
<rect x="20" y="310" width="920" height="46" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/>
<text x="34" y="338" font-size="13" font-weight="600" fill="#111827">What happened: the record.</text>
<text x="222" y="338" font-size="12" fill="#6b7280">Dated, added to, never edited.</text>
<line x1="91" y1="180" x2="91" y2="306" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#nf-ar)"/>
<line x1="300" y1="246" x2="300" y2="306" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#nf-ar)"/>
<line x1="521" y1="254" x2="521" y2="306" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#nf-ar)"/>
<text x="531" y="286" font-size="11.5" fill="#6b7280">each form closes and joins the record</text>
<path d="M886 310 V176 H406" fill="none" stroke="#6b7280" stroke-width="1.6" marker-end="url(#nf-ar)"/>
<text x="880" y="168" font-size="11.5" text-anchor="end" fill="#6b7280">read later, the record gives a new finding</text>
<text x="20" y="384" font-size="12" fill="#111827">A healthy move changes the form, closes the old one and leaves a pointer.</text>
<text x="20" y="402" font-size="12" fill="#6b7280">The four troubles: it arrives and never leaves, it stops halfway, it travels by retelling, it is sent where nobody is reading.</text>
</svg>
