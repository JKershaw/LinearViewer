<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 412" font-family="Inter, system-ui, sans-serif"><rect width="1000" height="412" fill="#fff"/><text x="20" y="26" font-size="13" fill="#1f2937" font-weight="600">How the options combine: each stack's multiple of correct work per weekly budget, against 2× and the bound</text><text x="20" y="44" font-size="11" fill="#6b7280">Within a cost factor, overlapping options count once; across factors the multiples multiply. Solid bar: multiplied, low to high end of every member's range.</text><text x="20" y="60" font-size="11" fill="#6b7280">Thin grey: the same shares added, as if nothing overlapped. Dotted: the same stack applied to everything but credential work, which is held at today's cost.</text><text x="20" y="76" font-size="11" fill="#6b7280">Red: cost-mix v2's bound on that same footing, credential work held and everything else three times cheaper.</text><line x1="330" x2="330" y1="110" y2="366" stroke="#e5e7eb"/><text x="330" y="382" font-size="11" fill="#6b7280" text-anchor="middle">1×</text><line x1="447.5" x2="447.5" y1="110" y2="366" stroke="#e5e7eb"/><text x="447.5" y="382" font-size="11" fill="#6b7280" text-anchor="middle">1.5×</text><line x1="565" x2="565" y1="110" y2="366" stroke="#e5e7eb"/><text x="565" y="382" font-size="11" fill="#6b7280" text-anchor="middle">2×</text><line x1="682.5" x2="682.5" y1="110" y2="366" stroke="#e5e7eb"/><text x="682.5" y="382" font-size="11" fill="#6b7280" text-anchor="middle">2.5×</text><line x1="800" x2="800" y1="110" y2="366" stroke="#e5e7eb"/><text x="800" y="382" font-size="11" fill="#6b7280" text-anchor="middle">3×</text><line x1="565" x2="565" y1="106" y2="366" stroke="#047857" stroke-width="2" stroke-dasharray="5 3"/><text x="565" y="102" font-size="10.5" fill="#047857" text-anchor="middle">2×, John's aim</text><line x1="682.5" x2="682.5" y1="106" y2="366" stroke="#b91c1c" stroke-width="2"/><text x="682.5" y="102" font-size="10.5" fill="#b91c1c" text-anchor="middle">bound 2.5×</text><line x1="494.5" x2="518" y1="114" y2="114" stroke="#6b7280" stroke-width="4"/><text x="506.25" y="92" font-size="9.5" fill="#6b7280" text-anchor="middle">cost-mix options 1–4</text><text x="320" y="136" font-size="11" fill="#1f2937" text-anchor="end">S0 Quick and reliability-neutral</text><line x1="341.75" x2="351.15000000000003" y1="132" y2="132" stroke="#d1d5db" stroke-width="3"/><rect x="341.75" y="125" width="9.400000000000034" height="14" fill="#1d4ed8" fill-opacity="0.85"/><line x1="339.40000000000003" x2="348.8" y1="144" y2="144" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="2 2"/><text x="357.15000000000003" y="136" font-size="10" fill="#1f2937">×1.05–1.09</text><text x="320" y="176" font-size="11" fill="#1f2937" text-anchor="end">S1 Plumbing code can see</text><line x1="377" x2="421.65" y1="172" y2="172" stroke="#d1d5db" stroke-width="3"/><rect x="374.65" y="165" width="35.25000000000006" height="14" fill="#1d4ed8" fill-opacity="0.85"/><line x1="369.95" x2="400.5" y1="184" y2="184" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="2 2"/><text x="415.90000000000003" y="176" font-size="10" fill="#1f2937">×1.19–1.34</text><text x="320" y="216" font-size="11" fill="#1f2937" text-anchor="end">S1+ Plumbing code can see, plus proportionality</text><line x1="407.55" x2="522.7" y1="212" y2="212" stroke="#d1d5db" stroke-width="3"/><rect x="398.15" y="205" width="77.55000000000007" height="14" fill="#1d4ed8" fill-opacity="0.85"/><line x1="391.1" x2="454.55" y1="224" y2="224" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="2 2"/><text x="481.70000000000005" y="216" font-size="10" fill="#1f2937">×1.29–1.62</text><text x="320" y="256" font-size="11" fill="#1f2937" text-anchor="end">S2 The conductor</text><line x1="391.1" x2="492.15" y1="252" y2="252" stroke="#d1d5db" stroke-width="3"/><rect x="388.75" y="245" width="77.55000000000001" height="14" fill="#1d4ed8" fill-opacity="0.85"/><line x1="381.7" x2="447.5" y1="264" y2="264" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="2 2"/><text x="472.3" y="256" font-size="10" fill="#1f2937">×1.25–1.58</text><text x="320" y="296" font-size="11" fill="#1f2937" text-anchor="end">S3 The conductor, plus proportionality</text><line x1="424" x2="654.3" y1="292" y2="292" stroke="#d1d5db" stroke-width="3"/><rect x="412.25" y="285" width="131.60000000000002" height="14" fill="#1d4ed8" fill-opacity="0.85"/><line x1="402.85" x2="506.25" y1="304" y2="304" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="2 2"/><text x="549.85" y="296" font-size="10" fill="#1f2937">×1.35–1.91</text><text x="320" y="336" font-size="11" fill="#1f2937" text-anchor="end">S4 The whole menu</text><line x1="492.15" x2="800" y1="332" y2="332" stroke="#d1d5db" stroke-width="3"/><text x="806" y="336" font-size="9.5" fill="#6b7280">added: ×4.55</text><rect x="459.25" y="325" width="209.14999999999998" height="14" fill="#047857" fill-opacity="0.85"/><line x1="440.45" x2="597.9000000000001" y1="344" y2="344" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="2 2"/><text x="674.4" y="336" font-size="10" fill="#1f2937">×1.55–2.44</text><text x="20" y="402" font-size="10.5" fill="#1f2937">Added as if nothing overlapped, the menu's token options come to 129.4% of the budget: more than the whole. Counted once per factor and multiplied, the whole menu is ×1.55–2.44.</text></svg>
