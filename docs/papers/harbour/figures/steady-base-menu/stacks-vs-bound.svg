682.5" x2="682.5" y1="110" y2="366" stroke="#e5e7eb"/><text x="682.5" y="382" font-size="11" fill="#6b7280" text-anchor="middle">2.5×</text><line x1="800" x2="800" y1="110" y2="366" stroke="#e5e7eb"/><text x="800" y="382" font-size="11" fill="#6b7280" text-anchor="middle">3×</text><line x1="565" x2="565" y1="106" y2="366" stroke="#047857" stroke-width="2" stroke-dasharray="5 3"/><text x="565" y="102" font-size="10.5" fill="#047857" text-anchor="middle">2×, John's aim</text><line x1="682.5" x2="682.5" y1="106" y2="366" stroke="#b91c1c" stroke-width="2"/><text x="682.5" y="102" font-size="10.5" fill="#b91c1c" text-anchor="middle">bound 2.5×</text><line x1="494.5" x2="518" y1="114" y2="114" stroke="#6b7280" stroke-width="4"/><text x="506.25" y="92" font-size="9.5" fill="#6b7280" text-anchor="middle">cost-mix options 1–4</text><text x="320" y="136" font-size="11" fill="#1f2937" text-anchor="end">S0 Quick and reliability-neutral</text><line x1="341.75" x2="351.15000000000003" y1="132" y2="132" stroke="#d1d5db" stroke-width="3"/><rect x="341.75" y="125" width="9.400000000000034" height="14" fill="#1d4ed8" fill-opacity="0.85"/><line x1="339.40000000000003" x2="348.8" y1="144" y2="144" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="2 2"/><text x="357.15000000000003" y="136" font-size="10" fill="#1f2937">×1.05–1.09</text><text x="320" y="176" font-size="11" fill="#1f2937" text-anchor="end">S1 Plumbing code can see</text><line x1="377" x2="395.8" y1="172" y2="172" stroke="#d1d5db" stroke-width="3"/><rect x="374.65" y="165" width="16.450000000000045" height="14" fill="#1d4ed8" fill-opacity="0.85"/><line x1="369.95" x2="384.05" y1="184" y2="184" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="2 2"/><text x="397.1" y="176" font-size="10" fill="#1f2937">×1.19–1.26</text><text x="320" y="216" font-size="11" fill="#1f2937" text-anchor="end">S1+ Plumbing code can see, plus proportionality</text><line x1="405.20000000000005" x2="492.15" y1="212" y2="212" stroke="#d1d5db"