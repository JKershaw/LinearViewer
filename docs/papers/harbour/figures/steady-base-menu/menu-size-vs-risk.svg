<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 728" font-family="Inter, system-ui, sans-serif"><rect width="1100" height="728" fill="#fff"/><text x="20" y="26" font-size="13" fill="#1f2937" font-weight="600">The menu: each option's size against its risk to correctness, with the stack that reaches 2× marked</text><text x="20" y="44" font-size="11" fill="#6b7280">Size: share of September's fleet weighted tokens the option would save, both repos, as the cited paper states it at version 2 or later (bar: its range).</text><text x="20" y="60" font-size="11" fill="#6b7280">Risk: the paper's own words. Dark outline: in stack S4, the only stack whose top reaches 2×. Hollow: inside or overlapping M3, so not a separate saving.</text><line x1="150" x2="150" y1="90" y2="572" stroke="#e5e7eb"/><text x="150" y="588" font-size="11" fill="#6b7280" text-anchor="middle">0.1%</text><line x1="255.93615051981465" x2="255.93615051981465" y1="90" y2="572" stroke="#e5e7eb"/><text x="255.93615051981465" y="588" font-size="11" fill="#6b7280" text-anchor="middle">0.3%</text><line x1="372.0319247400927" x2="372.0319247400927" y1="90" y2="572" stroke="#e5e7eb"/><text x="372.0319247400927" y="588" font-size="11" fill="#6b7280" text-anchor="middle">1%</text><line x1="477.96807525990727" x2="477.96807525990727" y1="90" y2="572" stroke="#e5e7eb"/><text x="477.96807525990727" y="588" font-size="11" fill="#6b7280" text-anchor="middle">3%</text><line x1="594.0638494801854" x2="594.0638494801854" y1="90" y2="572" stroke="#e5e7eb"/><text x="594.0638494801854" y="588" font-size="11" fill="#6b7280" text-anchor="middle">10%</text><line x1="700" x2="700" y1="90" y2="572" stroke="#e5e7eb"/><text x="700" y="588" font-size="11" fill="#6b7280" text-anchor="middle">30%</text><text x="425" y="606" font-size="11" fill="#1f2937" text-anchor="middle">share of fleet weighted tokens saved (log scale)</text><line x1="150" x2="700" y1="140" y2="140" stroke="#e5e7eb"/><text x="142" y="122" font-size="11.5" fill="#1f2937" text-anchor="end">none or positive</text><line x1="150" x2="700" y1="309" y2="309" stroke="#e5e7eb"/><text x="142" y="228.5" font-size="11.5" fill="#1f2937" text-anchor="end">low</text><line x1="150" x2="700" y1="393" y2="393" stroke="#e5e7eb"/><text x="142" y="355" font-size="11.5" fill="#1f2937" text-anchor="end">low–medium</text><line x1="150" x2="700" y1="528" y2="528" stroke="#e5e7eb"/><text x="142" y="464.5" font-size="11.5" fill="#1f2937" text-anchor="end">medium</text><line x1="150" x2="700" y1="572" y2="572" stroke="#e5e7eb"/><text x="142" y="554" font-size="11.5" fill="#1f2937" text-anchor="end">high</text><line x1="477.96807525990727" x2="527.2255801384098" y1="154" y2="154" stroke="#b45309" stroke-width="3" stroke-opacity="0.9"/><circle cx="527.2255801384098" cy="154" r="5" fill="#b45309" stroke="#1f2937" stroke-width="2"/><text x="536.2255801384098" y="158" font-size="9.5" fill="#1f2937">M9 Stop the bootstrap summary for the roles that still run it</text><circle cx="508.0895038972327" cy="171" r="5" fill="#fff" stroke="#1f2937" stroke-width="2"/><text x="517.0895038972327" y="175" font-size="9.5" fill="#1f2937">M2 Passage layer's bookkeeping in code</text><line x1="150" x2="481.1299073656683" y1="188" y2="188" stroke="#7c3aed" stroke-width="1.5" stroke-opacity="0.9"/><circle cx="481.1299073656683" cy="188" r="4" fill="#7c3aed" stroke="#7c3aed" stroke-width="1"/><text x="490.1299073656683" y="192" font-size="9.5" fill="#1f2937">M34 Give the periodicals the alarm log instead of a search for runtime faults</text><line x1="372.0319247400927" x2="423.1989423079891" y1="205" y2="205" stroke="#b45309" stroke-width="3" stroke-opacity="0.9"/><circle cx="423.1989423079891" cy="205" r="5" fill="#b45309" stroke="#1f2937" stroke-width="2"/><text x="432.1989423079891" y="209" font-size="9.5" fill="#1f2937">M11 Answer deterministic research questions with a tool</text><line x1="150" x2="372.0319247400927" y1="222" y2="222" stroke="#1d4ed8" stroke-width="3" stroke-opacity="0.45"/><circle cx="372.0319247400927" cy="222" r="5" fill="#fff" stroke="#1f2937" stroke-width="2"/><text x="381.0319247400927" y="226" font-size="9.5" fill="#1f2937">M5 Rule-class calls in code</text><circle cx="372.0319247400927" cy="239" r="5" fill="#7c3aed" stroke="#1f2937" stroke-width="2"/><text x="381.0319247400927" y="243" font-size="9.5" fill="#1f2937">M8 Stop review and close-out rounds that change nothing *</text><line x1="150" x2="372.0319247400927" y1="256" y2="256" stroke="#b45309" stroke-width="3" stroke-opacity="0.9"/><circle cx="372.0319247400927" cy="256" r="5" fill="#b45309" stroke="#1f2937" stroke-width="2"/><text x="381.0319247400927" y="260" font-size="9.5" fill="#1f2937">M14 The plan states what it adds to the research and cites the rest</text><line x1="150" x2="372.0319247400927" y1="273" y2="273" stroke="#6b7280" stroke-width="3" stroke-opacity="0.9"/><circle cx="372.0319247400927" cy="273" r="5" fill="#6b7280" stroke="#1f2937" stroke-width="2"/><text x="381.0319247400927" y="277" font-size="9.5" fill="#1f2937">M21 Run the cross-session detectors live, outside the processes they watch</text><circle cx="189.0978811780392" cy="290" r="4" fill="#6b7280" stroke="#6b7280" stroke-width="1"/><text x="198.0978811780392" y="294" font-size="9.5" fill="#1f2937">M23 An alarm for duplicate launches</text><line x1="614.0256544170475" x2="630.5554303865347" y1="323" y2="323" stroke="#b45309" stroke-width="3" stroke-opacity="0.9"/><circle cx="630.5554303865347" cy="323" r="5" fill="#b45309" stroke="#1f2937" stroke-width="2"/><text x="639.5554303865347" y="327" font-size="9.5" fill="#1f2937">M12 Lighter legs everywhere: fewer tracker reads and writes, brief passed inline *</text><line x1="150" x2="552.5246419624352" y1="340" y2="340" stroke="#1d4ed8" stroke-width="1.5" stroke-opacity="0.45"/><circle cx="552.5246419624352" cy="340" r="4" fill="#fff" stroke="#1d4ed8" stroke-width="1"/><text x="561.5246419624352" y="344" font-size="9.5" fill="#1f2937">M6 Lighter orchestration of split families *</text><circle cx="539.8602738076956" cy="357" r="5" fill="#fff" stroke="#1f2937" stroke-width="2"/><text x="548.8602738076956" y="361" font-size="9.5" fill="#1f2937">M1 Stop waking parents for "still waiting"</text><line x1="411.12980591813186" x2="438.87019408186814" y1="374" y2="374" stroke="#b45309" stroke-width="3" stroke-opacity="0.9"/><circle cx="438.87019408186814" cy="374" r="5" fill="#b45309" stroke="#1f2937" stroke-width="2"/><text x="447.87019408186814" y="378" font-size="9.5" fill="#1f2937">M10 A short file pointer between sessions on one ticket</text><line x1="594.0638494801854" x2="689.8403762995366" y1="407" y2="407" stroke="#1d4ed8" stroke-width="3" stroke-opacity="0.9"/><circle cx="689.8403762995366" cy="407" r="5" fill="#1d4ed8" stroke="#1f2937" stroke-width="2"/><text x="698.8403762995366" y="411" font-size="9.5" fill="#1f2937">M3 Deterministic conductor for the supervision cycle</text><line x1="583.904225779722" x2="655.9560480279736" y1="424" y2="424" stroke="#1d4ed8" stroke-width="3" stroke-opacity="0.9"/><circle cx="655.9560480279736" cy="424" r="5" fill="#1d4ed8" stroke="#1f2937" stroke-width="2"/><text x="664.9560480279736" y="428" font-size="9.5" fill="#1f2937">M4 Lean relay: judgement steps start fresh from a small handoff</text><line x1="572.5467327654192" x2="654.4213646039232" y1="441" y2="441" stroke="#db2777" stroke-width="3" stroke-opacity="0.9"/><circle cx="654.4213646039232" cy="441" r="5" fill="#db2777" stroke="#1f2937" stroke-width="2"/><text x="663.4213646039232" y="445" font-size="9.5" fill="#1f2937">M17 Size the gates to the change: hold credentials and 300+ lines, halve the rest</text><line x1="572.5467327654192" x2="611.6446139434584" y1="458" y2="458" stroke="#db2777" stroke-width="3" stroke-opacity="0.9"/><circle cx="611.6446139434584" cy="458" r="5" fill="#db2777" stroke="#1f2937" stroke-width="2"/><text x="620.6446139434584" y="462" font-size="9.5" fill="#1f2937">M16 A light lane for small, non-credential changes, classified by the paths touched</text><line x1="443.57489493825994" x2="510.4131642800354" y1="475" y2="475" stroke="#b45309" stroke-width="3" stroke-opacity="0.9"/><circle cx="510.4131642800354" cy="475" r="5" fill="#b45309" stroke="#1f2937" stroke-width="2"/><text x="519.4131642800354" y="479" font-size="9.5" fill="#1f2937">M13 Close-out at a cheaper tier, with a frontier step for the open questions *</text><line x1="372.0319247400927" x2="477.96807525990727" y1="492" y2="492" stroke="#7c3aed" stroke-width="3" stroke-opacity="0.9"/><circle cx="477.96807525990727" cy="492" r="5" fill="#7c3aed" stroke="#1f2937" stroke-width="2"/><text x="486.96807525990727" y="496" font-size="9.5" fill="#1f2937">M7 A child of an approved plan does not plan again</text><line x1="350.5148080253265" x2="433.924123287881" y1="509" y2="509" stroke="#1d4ed8" stroke-width="3" stroke-opacity="0.45"/><circle cx="433.924123287881" cy="509" r="5" fill="#fff" stroke="#1f2937" stroke-width="2"/><text x="442.924123287881" y="513" font-size="9.5" fill="#1f2937">M15 Start fresh instead of resuming cold above about 100–155k tokens</text><text x="20" y="630" font-size="11.5" fill="#1f2937" font-weight="600">Sized in hours or friction, not tokens:</text><circle cx="26" cy="643" r="4" fill="#6b7280"/><text x="36" y="647" font-size="9.5" fill="#1f2937">M18 Make the flaky browser specs robust: 38 red PR runs, 54 re-runs, about 3 runner-hours of re-runs; none before two workers (risk none or positive)</text><circle cx="26" cy="658" r="4" fill="#6b7280"/><text x="36" y="662" font-size="9.5" fill="#1f2937">M19 Retire census pins for an import-graph check: about 18 tickets since June exist to repair or bump a pin, about five pure bumps (risk low)</text><circle cx="26" cy="673" r="4" fill="#6b7280"/><text x="36" y="677" font-size="9.5" fill="#1f2937">M20 Loosen text pins on prompt prose; keep the branch pins: friction on every prompt change; prose pins caught 3 of 19 deleted lines (risk low)</text><circle cx="26" cy="688" r="4" fill="#6b7280"/><text x="36" y="692" font-size="9.5" fill="#1f2937">M22 Make the runner's completion post tell the truth: 23 failed terminal posts logged as posted since July, 8 in September (risk none or positive)</text><circle cx="26" cy="703" r="4" fill="#6b7280"/><text x="36" y="707" font-size="9.5" fill="#1f2937">M36 Retry service faults inside the tools sessions use, with the duplicate guard in the tool: not sized: 47 auth flaps, outages and host faults on 20 of 36 tickets, each costing a step that re-reads its context (risk low)</text><rect x="880" y="89" width="12" height="9" fill="#1d4ed8"/><text x="898" y="98" font-size="10.5" fill="#1f2937">supervision plumbing</text><rect x="880" y="107" width="12" height="9" fill="#7c3aed"/><text x="898" y="116" font-size="10.5" fill="#1f2937">legs that need not run</text><rect x="880" y="125" width="12" height="9" fill="#b45309"/><text x="898" y="134" font-size="10.5" fill="#1f2937">tokens per session</text><rect x="880" y="143" width="12" height="9" fill="#db2777"/><text x="898" y="152" font-size="10.5" fill="#1f2937">which changes get the full process</text><rect x="880" y="161" width="12" height="9" fill="#6b7280"/><text x="898" y="170" font-size="10.5" fill="#1f2937">hours, not tokens</text><text x="880" y="196" font-size="9.5" fill="#6b7280">* a range this paper derived</text><text x="880" y="209" font-size="9.5" fill="#6b7280">  from checked figures</text></svg>
