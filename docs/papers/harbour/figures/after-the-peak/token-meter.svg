d1d5db"],[stroke="#f0f0f0"],[stroke="#cbd5e1"],[stroke="#d9d9d9"]{stroke:#2c313a}[fill="#f3f4f6"],[fill="#f9fafb"]{fill:#1f222a}rect[fill="#f0f0f0"],rect[fill="#d1d5db"],rect[fill="#e5e7eb"],rect[fill="#eee"]{fill:#2c313a}text:not([fill]):not([class]):not([data-on-fill]){fill:#e6e6e6}rect[fill="#1f2937"],circle[fill="#1f2937"],path[fill="#1f2937"]{fill:#4b5563}rect[fill="#3b1f5e"],circle[fill="#3b1f5e"],path[fill="#3b1f5e"]{fill:#553185}svg .t,svg .h{fill:#e6e6e6}svg .a,svg .s{fill:#9aa0a6}svg .f{fill:#1f222a;stroke:#2c313a}svg .g{stroke:#2c313a}rect[fill="#dbeafe"]{fill:#1d2d44}rect[fill="#93c5fd"]{fill:#2a5a9a}rect[fill="#fff7ed"]{fill:#2a2118}}</style>
<title id="title">What the token meter cannot tell you</title>
<desc id="desc">A conceptual diagram with three separate layers. Model usage may or may not yield verified, useful outcomes. Future maintenance and defects have to be measured separately. Question marks indicate uncertain relationships.</desc>
<rect width="660" height="638" fill="#ffffff"/>
<text x="22" y="43" font-size="32" font-weight="650" fill="#111827">What the token meter cannot tell you</text>
<text x="22" y="78" font-size="24" fill="#475569">Conceptual illustration</text>
<rect x="22" y="106" width="616" height="112" rx="8" fill="#f3f4f6"/>
<text x="42" y="145" font-size="28" font-weight="650" fill="#111827">Model usage</text>
<text x="42" y="180" font-size="24" fill="#475569">Capacity, sessions, tokens, caching,</text>
<text x="42" y="207" font-size="24" fill="#475569">and which models do the work</text>
<path d="M55 230v62m-8-8 8 8 8-8" fill="none" stroke="#1766ad" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="78" y="267" font-size="24" fill="#1766ad">What gets used and proves useful?</text>
<rect x="22" y="304" width="616" height="112" rx="8" fill="#f3f4f6"/>
<text x="42" y="343" font-size="28" font-weight="650" fill="#111827">Verified outcomes</text>
<text x="42" y="378" font-size="24" fill="#475569">Useful changes, adopted services,</text>
<text x="42" y="405" font-size="24" fill="#475569">and tools built for one person</text>
<path d="M55 428v62m-8-8 8 8 8-8" fill="none" stroke="#1766ad" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="78" y="465" font-size="24" fill="#1766ad">What will the work cost later?</text>
<rect x="22" y="502" width="616" height="112" rx="8" fill="#f3f4f6"/>
<text x="42" y="541" font-size="28" font-weight="650" fill="#111827">Lifetime consequences</text>
<text x="42" y="576" font-size="24" fill="#475569">Later defects, maintenance,</text>
<text x="42" y="603" font-size="24" fill="#475569">and the effort of the next change</text>
</svg>
