nt-size="10.5" fill="#1f2937" text-anchor="start">0 / 9 / 0 / 0</text><text x="260.0" y="151.0" font-size="11.5" fill="#1f2937" text-anchor="end">D2 stopped or circular wait (both)</text><rect x="270.0" y="138" width="45.8" height="20" fill="#1baf7a"/><rect x="315.8" y="138" width="82.4" height="20" fill="#eb6834"/><rect x="398.1" y="138" width="393.6" height="20" fill="#2a78d6"/><rect x="791.7" y="138" width="18.3" height="20" fill="#94a3b8"/><text x="816.0" y="152.0" font-size="10.5" fill="#1f2937" text-anchor="start">5 / 9 / 43 / 2</text><text x="260.0" y="185.0" font-size="11.5" fill="#1f2937" text-anchor="end">D5 lost wake (parked parent) (runner)</text><rect x="270.0" y="172" width="9.2" height="20" fill="#1baf7a"/><rect x="279.2" y="172" width="18.3" height="20" fill="#eb6834"/><rect x="297.5" y="172" width="27.5" height="20" fill="#2a78d6"/><text x="330.9" y="186.0" font-size="10.5" fill="#1f2937" text-anchor="start">1 / 2 / 3 / 0</text><text x="260.0" y="219.0" font-size="11.5" fill="#1f2937" text-anchor="end">D5x lost [done] POST (runner)</text><rect x="270.0" y="206" width="9.2" height="20" fill="#1baf7a"/><rect x="279.2" y="206" width="201.4" height="20" fill="#2a78d6"/><text x="486.5" y="220.0" font-size="10.5" fill="#1f2937" text-anchor="start">1 / 0 / 22 / 0</text><text x="260.0" y="253.0" font-size="11.5" fill="#1f2937" text-anchor="end">D7 duplicate launch (both)</text><rect x="270.0" y="240" width="9.2" height="20" fill="#eb6834"/><rect x="279.2" y="240" width="45.8" height="20" fill="#2a78d6"/><rect x="324.9" y="240" width="18.3" height="20" fill="#94a3b8"/><text x="349.2" y="254.0" font-size="10.5" fill="#1f2937" text-anchor="start">0 / 1 / 5 / 2</text><rect x="270" y="301" width="12" height="12" fill="#1baf7a"/><text x="287.0" y="311.0" font-size="11" fill="#6b7280" text-anchor="start">hit on record</text><rect x="394" y="301" width="12" height="12" fill="#eb6834"/><text x="411.0" y="311.0" font-size="11" fill="#6b7280" text-anchor="start">misse