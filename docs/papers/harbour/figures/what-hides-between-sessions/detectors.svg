<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 334" width="940" height="334" font-family="Inter, system-ui, sans-serif" role="img" aria-label="Each detector run over the history: incidents on record it caught and missed, real cases nobody recorded, and false alarms"><title>Each detector run over the history: incidents on record it caught and missed, real cases nobody recorded, and false alarms</title><rect width="940" height="334" fill="#ffffff"/><text x="24.0" y="26.0" font-size="15" fill="#1f2937" text-anchor="start" font-weight="600">Detectors run over the history</text><text x="24.0" y="44.0" font-size="11" fill="#6b7280" text-anchor="start">Per detector: incidents on record it fired on and missed, alarms that were real but never recorded, and false alarms (alarms read by hand where sampled).</text><text x="260.0" y="83.0" font-size="11.5" fill="#1f2937" text-anchor="end">D1 shared error burst (harbour)</text><rect x="270.0" y="70" width="18.3" height="20" fill="#1baf7a"/><rect x="288.3" y="70" width="18.3" height="20" fill="#eb6834"/><rect x="306.6" y="70" width="183.1" height="20" fill="#2a78d6"/><rect x="489.7" y="70" width="146.4" height="20" fill="#94a3b8"/><text x="642.1" y="84.0" font-size="10.5" fill="#1f2937" text-anchor="start">2 / 2 / 20 / 16</text><text x="260.0" y="117.0" font-size="11.5" fill="#1f2937" text-anchor="end">D1f error lines in feedback (harbour)</text><rect x="270.0" y="104" width="82.4" height="20" fill="#eb6834"/><text x="358.4" y="118.0" font-size="10.5" fill="#1f2937" text-anchor="start">0 / 9 / 0 / 0</text><text x="260.0" y="151.0" font-size="11.5" fill="#1f2937" text-anchor="end">D2 stopped or circular wait (both)</text><rect x="270.0" y="138" width="45.8" height="20" fill="#1baf7a"/><rect x="315.8" y="138" width="82.4" height="20" fill="#eb6834"/><rect x="398.1" y="138" width="393.6" height="20" fill="#2a78d6"/><rect x="791.7" y="138" width="18.3" height="20" fill="#94a3b8"/><text x="816.0" y="152.0" font-size="10.5" fill="#1f2937" text-anchor="start">5 / 9 / 43 / 2</text><text x="260.0" y="185.0" font-size="11.5" fill="#1f2937" text-anchor="end">D5 lost wake (parked parent) (runner)</text><rect x="270.0" y="172" width="9.2" height="20" fill="#1baf7a"/><rect x="279.2" y="172" width="18.3" height="20" fill="#eb6834"/><rect x="297.5" y="172" width="27.5" height="20" fill="#2a78d6"/><text x="330.9" y="186.0" font-size="10.5" fill="#1f2937" text-anchor="start">1 / 2 / 3 / 0</text><text x="260.0" y="219.0" font-size="11.5" fill="#1f2937" text-anchor="end">D5x lost [done] POST (runner)</text><rect x="270.0" y="206" width="9.2" height="20" fill="#1baf7a"/><rect x="279.2" y="206" width="201.4" height="20" fill="#2a78d6"/><text x="486.5" y="220.0" font-size="10.5" fill="#1f2937" text-anchor="start">1 / 0 / 22 / 0</text><text x="260.0" y="253.0" font-size="11.5" fill="#1f2937" text-anchor="end">D7 duplicate launch (both)</text><rect x="270.0" y="240" width="9.2" height="20" fill="#eb6834"/><rect x="279.2" y="240" width="45.8" height="20" fill="#2a78d6"/><rect x="324.9" y="240" width="18.3" height="20" fill="#94a3b8"/><text x="349.2" y="254.0" font-size="10.5" fill="#1f2937" text-anchor="start">0 / 1 / 5 / 2</text><rect x="270" y="301" width="12" height="12" fill="#1baf7a"/><text x="287.0" y="311.0" font-size="11" fill="#6b7280" text-anchor="start">hit on record</text><rect x="394" y="301" width="12" height="12" fill="#eb6834"/><text x="411.0" y="311.0" font-size="11" fill="#6b7280" text-anchor="start">missed</text><rect x="476" y="301" width="12" height="12" fill="#2a78d6"/><text x="493.0" y="311.0" font-size="11" fill="#6b7280" text-anchor="start">real, never recorded</text><rect x="642" y="301" width="12" height="12" fill="#94a3b8"/><text x="659.0" y="311.0" font-size="11" fill="#6b7280" text-anchor="start">false alarm</text></svg>