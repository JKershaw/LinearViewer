1="294" y2="294" stroke="#e5e7eb"/><text x="74.0" y="298.0" font-size="9" fill="#6b7280" text-anchor="end">20%</text><line x1="288" x2="288" y1="70" y2="350" stroke="#e5e7eb"/><text x="288.0" y="364.0" font-size="9" fill="#6b7280" text-anchor="middle">40%</text><line x1="80" x2="600" y1="238" y2="238" stroke="#e5e7eb"/><text x="74.0" y="242.0" font-size="9" fill="#6b7280" text-anchor="end">40%</text><line x1="392" x2="392" y1="70" y2="350" stroke="#e5e7eb"/><text x="392.0" y="364.0" font-size="9" fill="#6b7280" text-anchor="middle">60%</text><line x1="80" x2="600" y1="182" y2="182" stroke="#e5e7eb"/><text x="74.0" y="186.0" font-size="9" fill="#6b7280" text-anchor="end">60%</text><line x1="496" x2="496" y1="70" y2="350" stroke="#e5e7eb"/><text x="496.0" y="364.0" font-size="9" fill="#6b7280" text-anchor="middle">80%</text><line x1="80" x2="600" y1="126" y2="126" stroke="#e5e7eb"/><text x="74.0" y="130.0" font-size="9" fill="#6b7280" text-anchor="end">80%</text><line x1="600" x2="600" y1="70" y2="350" stroke="#e5e7eb"/><text x="600.0" y="364.0" font-size="9" fill="#6b7280" text-anchor="middle">100%</text><line x1="80" x2="600" y1="70" y2="70" stroke="#e5e7eb"/><text x="74.0" y="74.0" font-size="9" fill="#6b7280" text-anchor="end">100%</text><text x="340.0" y="382.0" font-size="10" fill="#1f2937" text-anchor="middle">recall of edited files (pooled)</text><text x="24" y="210" font-size="10" fill="#1f2937" text-anchor="middle" transform="rotate(-90 24 210)">precision against files used (pooled)</text><circle cx="336.88" cy="194.6" r="6" fill="#2a78d6"><title>named paths: recall 49.4%, precision 55.5%, median 5 files named</title></circle><circle cx="645" cy="72" r="5" fill="#2a78d6"/><text x="656.0" y="76.0" font-size="11" fill="#1f2937" text-anchor="start">named paths</text><text x="656.0" y="89.0" font-size="9" fill="#6b7280" text-anchor="start">recall 49.4% · precision 55.5% · names 5 files (median)</text><circle cx="392.52" cy="313.88" r="6" fill="#1baf7a"><title>sy