<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 640" width="940" height="640" font-family="Inter, system-ui, sans-serif" role="img" aria-label="Who wakes whom in September: every Harbour wake edge between session layers, with its count, wakes per correct change and the share that changed nothing"><style data-figure-theme="1">@media (prefers-color-scheme: dark){rect[fill="#fff"]:not([fill-opacity]),rect[fill="#ffffff"]:not([fill-opacity]),rect[fill="white"]:not([fill-opacity]){fill:#16181d}[stroke="#fff"],[stroke="#ffffff"],[stroke="white"]{stroke:#16181d}rect[fill="#fff"][fill-opacity="0.92"],rect[fill="#ffffff"][fill-opacity="0.92"],rect[fill="white"][fill-opacity="0.92"]{fill:#16181d}text[fill="#1f2937"],text[fill="#333"],text[fill="#1f2328"],text[fill="#555"],text[fill="#475569"]{fill:#e6e6e6}[stroke="#1f2937"],[stroke="#333"],[stroke="#1f2328"],[stroke="#555"],[stroke="#475569"]{stroke:#e6e6e6}text[fill="#6b7280"],text[fill="#666"],text[fill="#667085"],text[fill="#888"],text[fill="#6e7781"],text[fill="#999"],text[fill="#aaa"],text[fill="#bbb"],text[fill="#9ca3af"],text[fill="#94a3b8"]{fill:#9aa0a6}[stroke="#6b7280"],[stroke="#666"],[stroke="#667085"],[stroke="#888"],[stroke="#6e7781"],[stroke="#999"],[stroke="#aaa"],[stroke="#bbb"],[stroke="#9ca3af"],[stroke="#94a3b8"]{stroke:#9aa0a6}[stroke="#e5e7eb"],[stroke="#eee"],[stroke="#d1d5db"],[stroke="#f0f0f0"],[stroke="#cbd5e1"],[stroke="#d9d9d9"]{stroke:#2c313a}[fill="#f3f4f6"],[fill="#f9fafb"]{fill:#1f222a}rect[fill="#f0f0f0"],rect[fill="#d1d5db"],rect[fill="#e5e7eb"],rect[fill="#eee"]{fill:#2c313a}text:not([fill]):not([class]){fill:#e6e6e6}svg .t,svg .h{fill:#e6e6e6}svg .a,svg .s{fill:#9aa0a6}svg .f{fill:#1f222a;stroke:#2c313a}svg .g{stroke:#2c313a}rect[fill="#dbeafe"]{fill:#1d2d44}rect[fill="#93c5fd"]{fill:#2a5a9a}rect[fill="#fff7ed"]{fill:#2a2118}}</style><title>Who wakes whom in September: every Harbour wake edge between session layers, with its count, wakes per correct change and the share that changed nothing</title><rect width="940" height="640" fill="#ffffff"/><text x="24.0" y="26.0" font-size="15" fill="#1f2937" text-anchor="start" font-weight="600">Who wakes whom, September (both repos)</text><text x="24.0" y="44.0" font-size="11" fill="#6b7280" text-anchor="start">An arrow runs from the child whose feedback minted the wake to the session it woke. Label: wakes in the month · per correct code change · share that changed nothing.</text><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2a78d6"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#eb6834"/></marker></defs><path d="M300.0,546.0 Q300.0,493.0 300.0,440.0" fill="none" stroke="#2a78d6" stroke-width="11.5" stroke-opacity="0.85" marker-end="url(#ah-blue)"/><rect x="306.0" y="485.0" width="105.6" height="17" rx="3" fill="#ffffff" fill-opacity="0.92"/><text x="310.0" y="498.0" font-size="11" fill="#1f2937" text-anchor="start" font-weight="600">1,555 · 7.8 · 6%</text><path d="M284.3,549.8 Q153.2,427.9 128.5,250.5" fill="none" stroke="#2a78d6" stroke-width="6.5" stroke-opacity="0.85" marker-end="url(#ah-blue)"/><rect x="57.8" y="402.0" width="99.5" height="17" rx="3" fill="#ffffff" fill-opacity="0.92"/><text x="61.8" y="415.0" font-size="11" fill="#1f2937" text-anchor="start" font-weight="600">777 · 4.2 · 12%</text><path d="M315.7,549.8 Q446.8,427.9 471.5,250.5" fill="none" stroke="#2a78d6" stroke-width="1.8" stroke-opacity="0.85" marker-end="url(#ah-blue)"/><rect x="428.2" y="446.0" width="93.4" height="17" rx="3" fill="#ffffff" fill-opacity="0.92"/><text x="432.2" y="459.0" font-size="11" fill="#1f2937" text-anchor="start" font-weight="600">54 · 0.2 · 13%</text><path d="M275.6,376.3 Q214.1,302.4 138.7,242.9" fill="none" stroke="#eb6834" stroke-width="5.3" stroke-opacity="0.85" marker-end="url(#ah-orange)"/><rect x="186.6" y="290.0" width="99.5" height="17" rx="3" fill="#ffffff" fill-opacity="0.92"/><text x="190.6" y="303.0" font-size="11" fill="#1f2937" text-anchor="start" font-weight="600">593 · 3.0 · 92%</text><path d="M324.4,376.3 Q385.9,302.4 461.3,242.9" fill="none" stroke="#eb6834" stroke-width="5.1" stroke-opacity="0.85" marker-end="url(#ah-orange)"/><rect x="299.4" y="290.0" width="99.5" height="17" rx="3" fill="#ffffff" fill-opacity="0.92"/><text x="303.4" y="303.0" font-size="11" fill="#1f2937" text-anchor="start" font-weight="600">567 · 1.2 · 95%</text><path d="M490.0,181.0 Q490.0,150.5 490.0,120.0" fill="none" stroke="#eb6834" stroke-width="4.4" stroke-opacity="0.85" marker-end="url(#ah-orange)"/><rect x="496.0" y="142.5" width="99.5" height="17" rx="3" fill="#ffffff" fill-opacity="0.92"/><text x="500.0" y="155.5" font-size="11" fill="#1f2937" text-anchor="start" font-weight="600">455 · 0.1 · 95%</text><text x="500.0" y="169.5" font-size="10" fill="#6b7280" text-anchor="start">few of them on a code change</text><path d="M360,388 C450,340 450,450 362,414" fill="none" stroke="#eb6834" stroke-width="3.1" stroke-opacity="0.85" marker-end="url(#ah-orange)"/><text x="440.0" y="404.0" font-size="11" fill="#1f2937" text-anchor="start" font-weight="600">253 · 1.3 · 87%</text><text x="440.0" y="418.0" font-size="10" fill="#6b7280" text-anchor="start">stepper under a stepper</text><rect x="222" y="554" width="156" height="52" rx="8" fill="#f3f4f6" stroke="#94a3b8"/><text x="300.0" y="577.0" font-size="12.5" fill="#1f2937" text-anchor="middle" font-weight="600">Worker session</text><text x="300.0" y="593.0" font-size="10" fill="#6b7280" text-anchor="middle">fresh leg or beat</text><rect x="222" y="374" width="156" height="52" rx="8" fill="#f3f4f6" stroke="#94a3b8"/><text x="300.0" y="397.0" font-size="12.5" fill="#1f2937" text-anchor="middle" font-weight="600">Stepper</text><text x="300.0" y="413.0" font-size="10" fill="#6b7280" text-anchor="middle">autopilot, one beat at a time</text><rect x="32" y="189" width="156" height="52" rx="8" fill="#f3f4f6" stroke="#94a3b8"/><text x="110.0" y="212.0" font-size="12.5" fill="#1f2937" text-anchor="middle" font-weight="600">Ticket autopilot</text><text x="110.0" y="228.0" font-size="10" fill="#6b7280" text-anchor="middle">the ticket's own</text><rect x="412" y="189" width="156" height="52" rx="8" fill="#f3f4f6" stroke="#94a3b8"/><text x="490.0" y="212.0" font-size="12.5" fill="#1f2937" text-anchor="middle" font-weight="600">Passage leg</text><text x="490.0" y="228.0" font-size="10" fill="#6b7280" text-anchor="middle">autopilot a Runner dispatched</text><rect x="412" y="54" width="156" height="52" rx="8" fill="#f3f4f6" stroke="#94a3b8"/><text x="490.0" y="77.0" font-size="12.5" fill="#1f2937" text-anchor="middle" font-weight="600">Passage Runner</text><text x="490.0" y="93.0" font-size="10" fill="#6b7280" text-anchor="middle">flies the passage</text><rect x="676" y="60" width="240" height="282" rx="8" fill="none" stroke="#e5e7eb"/><text x="690.0" y="80.0" font-size="12.5" fill="#1f2937" text-anchor="start" font-weight="600">Also into the same sessions</text><text x="690.0" y="102.0" font-size="11.5" fill="#1f2937" text-anchor="start" font-weight="600">7,429 completion gates</text><text x="690.0" y="116.0" font-size="10" fill="#6b7280" text-anchor="start">runner (SD); 62% answered PENDING-EXTERNAL</text><text x="690.0" y="142.0" font-size="11.5" fill="#1f2937" text-anchor="start" font-weight="600">123 stall-failsafe re-fires</text><text x="690.0" y="156.0" font-size="10" fill="#6b7280" text-anchor="start">runner (SD); resumed to re-ask</text><text x="690.0" y="182.0" font-size="11.5" fill="#1f2937" text-anchor="start" font-weight="600">788 self-armed wake-ups</text><text x="690.0" y="196.0" font-size="10" fill="#6b7280" text-anchor="start">harness; 287 of them CI or PR polls</text><text x="690.0" y="222.0" font-size="11.5" fill="#1f2937" text-anchor="start" font-weight="600">597 beats into held workers</text><text x="690.0" y="236.0" font-size="10" fill="#6b7280" text-anchor="start">a stepper, via Harbour</text><text x="690.0" y="262.0" font-size="11.5" fill="#1f2937" text-anchor="start" font-weight="600">339 relayed rulings and notes</text><text x="690.0" y="276.0" font-size="10" fill="#6b7280" text-anchor="start">a person or a supervisor, via Harbour</text><text x="690.0" y="302.0" font-size="11.5" fill="#1f2937" text-anchor="start" font-weight="600">337 wakes whose child is not linked</text><text x="690.0" y="316.0" font-size="10" fill="#6b7280" text-anchor="start">left off the diagram</text><line x1="24" x2="52" y1="612" y2="612" stroke="#2a78d6" stroke-width="4"/><text x="58.0" y="616.0" font-size="11" fill="#6b7280" text-anchor="start">most wakes led to an action</text><line x1="240" x2="268" y1="612" y2="612" stroke="#eb6834" stroke-width="4"/><text x="274.0" y="616.0" font-size="11" fill="#6b7280" text-anchor="start">most wakes changed nothing</text><text x="470.0" y="616.0" font-size="11" fill="#6b7280" text-anchor="start">Width: wakes in September. Per correct change: 127 correct code changes, 1–28 Sep.</text></svg>