.1" height="20" fill="#1baf7a"/><text x="379.1" y="212.0" font-size="10.5" fill="#1f2937" text-anchor="start">3.7  (788 in the month; 4% of tokens)</text><text x="220.0" y="251.0" font-size="11.5" fill="#1f2937" text-anchor="end">Relayed ruling or note</text><rect x="230.0" y="238" width="14.9" height="20" fill="#eb6834"/><rect x="244.9" y="238" width="25.3" height="20" fill="#2a78d6"/><rect x="270.3" y="238" width="17.8" height="20" fill="#1baf7a"/><text x="294.1" y="252.0" font-size="10.5" fill="#1f2937" text-anchor="start">1.5  (339 in the month; 5% of tokens)</text><text x="220.0" y="291.0" font-size="11.5" fill="#1f2937" text-anchor="end">Stall-failsafe re-fire (runner)</text><rect x="230.0" y="278" width="32.7" height="20" fill="#eb6834"/><rect x="262.7" y="278" width="3.2" height="20" fill="#2a78d6"/><rect x="265.9" y="278" width="0.9" height="20" fill="#1baf7a"/><text x="272.8" y="292.0" font-size="10.5" fill="#1f2937" text-anchor="start">1.0  (208 in the month; 1% of tokens)</text><rect x="230" y="353" width="12" height="12" fill="#eb6834"/><text x="247.0" y="363.0" font-size="11" fill="#6b7280" text-anchor="start">changed nothing (read, re-arm)</text><rect x="460" y="353" width="12" height="12" fill="#2a78d6"/><text x="477.0" y="363.0" font-size="11" fill="#6b7280" text-anchor="start">acted (write, push, PR, edit)</text><rect x="684" y="353" width="12" height="12" fill="#1baf7a"/><text x="701.0" y="363.0" font-size="11" fill="#6b7280" text-anchor="start">dispatched</text></svg>